formula = "mol-check-promise-artifacts"
description = "Re-derive and check the files that write dotdiw's promise down and bind the program to them: validate Product, Praxis and the POA source; derive native operation contracts; attach application manifests and generate Python artifacts without changing native semantics; check the IDL, witness contract, replays and sweep; format, lint and type-check; run the relevant test suites and compare the generated gRPC contract with the server and released field numbers. Use when product.yaml, praxis.yaml, poa/product-model.yaml, a binding manifest, contract, fixture, generator or dotdiw changes, or a promise check fails."
examples = [
  "Re-derive the operation IDL",
  "Check the promise artifacts",
  "product.yaml changed, re-check everything",
  "The CESC replay failed",
  "Update the praxis after a release",
  "dotdiw changed, is it still bound to its operations",
  "Run the gRPC conformance harness",
  "Lint and type-check the tree",
  "mypy fails",
  "Native POA contracts changed",
]
verify-using = [
  'run:"${DOTDIW_POA:-$HOME/poa}" check --idl operation-idl.json --product-model poa/product-model.yaml',
  'run:"${DOTDIW_POA:-$HOME/poa}" sweep --product-model poa/product-model.yaml --idl operation-idl.json --include-cesc --cesc contracts/named-work-found-its-procedure.cesc.yaml --source poa/product-model.yaml',
  "run:python3 -I test_promise.py TheDoor NativeOperationContracts TheGrpcProjection",
]
version = 8
type = "workflow"

# Earlier versions completed POA's inferred operation semantics locally. Native
# operationContracts and scoped participation now replace that authoring path.
# generate-project.py attaches only governed application manifests, projection
# descriptions and change records, and generates Python from the native IDL.
# NativeOperationContracts compares every other section with a fresh derivation.
#
# DOTDIW_POA selects the POA binary; otherwise the commands use ~/poa. Read that
# build's learn packet first. It must support native contracts, journey scope,
# field-number registries and --json-list-map. The last option deliberately keeps
# the released repeated-JSON-string encoding of one list-of-maps field. It never
# changes its domain IDL. The native conform command does not forward this
# projection selection; the gRPC proof here uses native generate plus Buf and a
# comparison with the actual server descriptor. Protobuf is required for that
# proof and grpcio for the live server tests; skipped checks do not prove them.

[[steps]]
id = "product"
title = "Validate the thin Product: `~/pd validate model --product product.yaml --json`"

[[steps]]
id = "praxis"
title = "Extract the Praxis schema from `~/px learn`, then validate praxis.yaml against it with the selected POA; confirm source-side lifecycle bindings match their POA mirror"

[[steps]]
id = "model"
title = 'Validate the native source: `"${DOTDIW_POA:-$HOME/poa}" validate --model poa/product-model.yaml`; resolve scope, lifecycle, kind and timing errors in the source without waivers'

[[steps]]
id = "derive"
title = 'Derive natively: `"${DOTDIW_POA:-$HOME/poa}" derive --product-model poa/product-model.yaml --out operation-idl.json --write`; retain lawful lifecycle bindings and actual participation'
needs = ["model"]

[[steps]]
id = "generate"
title = "Run `uv run python poa/generate-project.py`: attach application manifests and generate Python records, doors and adapter starter; native operations, types, calls, dependencies and provenance remain unchanged"
needs = ["derive"]

[[steps]]
id = "idl"
title = 'Run the selected POA `validate --idl operation-idl.json` and `check --idl operation-idl.json --product-model poa/product-model.yaml`; every check passes, no drift, and no missing interface binding'
needs = ["generate"]

[[steps]]
id = "contract"
title = "Validate the witness contract with POA, then check it against operation-idl.json and poa/product-model.yaml; include the governed source artifacts its semantic references require"
needs = ["generate"]

[[steps]]
id = "replay"
title = "Replay every traceExpectation with POA: each golden trace is valid, and every anti-golden trace has the rejected, incomplete or caveated status its contract declares"
needs = ["contract"]

[[steps]]
id = "sweep"
title = "Sweep the model through operation-idl.json with --include-cesc, the witness contract and its source; no gaps or guardrail findings"
needs = ["idl", "contract"]

[[steps]]
id = "lint"
title = "Run `uv run ruff format --check .` and `uv run ruff check .`; the generated regions remain exactly what generate-project.py writes"
needs = ["generate"]

[[steps]]
id = "types"
title = "Run `uv run mypy`; every file pyproject.toml names passes against the IDL-generated record types"
needs = ["generate"]

[[steps]]
id = "promise"
title = "Run `python3 -I suites.py fast` and `python3 -I suites.py poa` with DOTDIW_POA set; a pull request runs all suites; a review also runs the adapter and live gRPC tests its changes affect"
needs = ["idl"]

[[steps]]
id = "conform"
title = "With Buf and protobuf, run `python3 -I test_promise.py TheGrpcProjection`: native generation uses the released registry and explicit JSON field selection; every served message, method and released field number agrees"
needs = ["idl"]

[[steps]]
id = "readme"
title = "Update README counts and workflow descriptions where needed, then re-derive and regenerate once more; no tracked artifact drifts"
needs = ["sweep", "replay", "promise", "conform", "product", "praxis", "lint", "types"]
