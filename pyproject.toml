[project]
name = "dotdiw"
version = "1.1.0"
description = "Workflow discovery for a project: when work starts, the procedure that applies surfaces on its own."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
# dotdiw is one script, installed by the Homebrew tap; nothing here is built or installed.
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# dotdiw has no extension: it is the script the tap installs.
extend-include = ["dotdiw"]
extend-exclude = ["gen", "trial1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Percent formatting is this tree's one style for strings; rewriting its
# sites to f-strings is a change of the tree, not a lint.
ignore = ["UP031", "UP032"]

[tool.mypy]
python_version = "3.11"
# The tool and what binds to it are held strictly. The measurements are the
# apparatus the numbers came from, kept as they ran; ruff reads them, mypy does
# not.
files = ["dotdiw", "promise_bindings.py", "trackers", "poa", "test_promise.py",
         "test_dotdiw.py", "test_tracker.py", "test_jira.py"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The tests are checked, not annotated: every body is read with the types the
# tool declares, and a test method says nothing about its return.
module = ["test_promise", "test_dotdiw", "test_tracker", "test_jira"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.ruff.lint.per-file-ignores]
# Text as it was given is not wrapped: the formulas, prompts and job
# descriptions the measurements were built from, the fixtures the tests write,
# and the source lines a mutation looks for as they stand.
"test_*.py" = ["E501"]
"measurements/fixtures/*" = ["E501"]
"measurements/harness/*" = ["E501"]
"measurements/measure/mutate_tracker.py" = ["E501"]
