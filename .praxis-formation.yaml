  originalPhrases:
  - dotdiw create
  - the declared moment
  - a formula
  - formula new
  - surfaces
  - holds
  - check-promise-artifacts
  - on its own
  - as the project asks
  corePromise: 'That the procedure the project holds is the one that surfaces when
    the work is named, and that it is still right: a formula that says cat where the
    tool now needs a script is a procedure the project holds and should not. The promise
    is that naming the work shows you what applies, and what applies has to be true.'
  beneficiary: The maintainer, who had said on this branch that a release of dotdiw
    must run the promise check first and who would be opening the pull request; and
    whoever next does this work here, person or agent, who will type dotdiw create
    and trust that what surfaces is the procedure as it now is, not as it was.
  possibleHarm: A stale procedure that looks followed. The next person pours check-promise-artifacts,
    runs the cat step, poa check stays green, and the witness contract silently drops
    out of the IDL; the release goes out with the promise unchecked while every step
    shows closed. The repair would land on whoever ships next, who would not know
    where to look.
  expertAttention: 'The step''s own words no longer matched the files in front of
    me. It said operation-idl.yaml and poa/idl-additions.yaml, and I had just deleted
    both. The moment I read a step and reached for a different command than the one
    written, that was the sign: the procedure and the tool had drifted apart, and
    I was about to carry the difference in my head instead of in the file.'
  hardJudgment: 'To stop and rewrite the formula before going on, rather than finish
    the checks by hand and note the drift for later. The pull was real: the checks
    were one command away from green, the rewrite was not on the plan''s list, and
    later never comes. The decision was that the plan was not done until the procedure
    that surfaces for this work was the procedure that works, and to commit that file
    on its own before touching anything else.'
  temptingShortcut: 'Run the right commands from memory, leave the formula as it was,
    and write the drift into the plan as a note for later. It would have looked fine:
    every check green, every box ticked, the formula still discoverable. Only the
    next pour would have found out, and not from me.'
  authorityBoundary: 'At the formula file. Committing it is what the project asks
    of whoever writes a procedure, so I did that on my own. Committing everything
    else, pushing the branch, releasing through the tap, deciding whether the praxis
    is recognised: those are the maintainer''s, and each was asked for and done only
    on their word. dotdiw itself stops even earlier -- it shows and never enforces,
    and it never commits for anyone.'
  proof: Three things anyone can look at. dotdiw check says six formulas, all discoverable,
    and the two new example titles retrieve the rewritten formula. The commit holds
    the file, so a clone has it. And the formula's steps, run from the top, reproduce
    the whole set of checks -- fourteen in poa check, five replays, the sweep, two
    test suites, the conformance harness -- which they did, from a clean state, before
    the plan was called done.
  excellentVersion: The drift never reaches a person. The moment a step names a file
    that is gone, the check says so before anyone pours; the formula is edited where
    it lives, in the same sitting as the change that made it stale, and committed
    with it. Nobody carries the difference in their head, and the next create surfaces
    something that is simply true.
  betrayalVersion: 'A procedure that is followed because it surfaced, not because
    it is right. Steps closing in order while the thing they describe no longer exists;
    a check that stays green because it looks at the file and not at the tool; a formula
    rewritten but not committed, so my checkout has the fix and the project does not.
    Or the tool starting to refuse: a pour blocked because no create came first would
    be enforcing, and this practice shows.'
