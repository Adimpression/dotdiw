case:
  practiceName: Where work starts
  practiceBearer: null
  recognizedByBearer: true
  recognitionStatement: 'Recognized as Where work starts: That the procedure the project
    holds is the one that surfaces when the work is named, and that it is still right:
    a formula that says cat where the tool now needs a script is a procedure the project
    holds and should not. The promise is that naming the work shows you what applies,
    and what applies has to be true. The reliance belongs to: The maintainer, who
    had said on this branch that a release of dotdiw must run the promise check first
    and who would be opening the pull request; and whoever next does this work here,
    person or agent, who will type dotdiw create and trust that what surfaces is the
    procedure as it now is, not as it was.. It would stop being this praxis if Three
    things. Work is named before it is touched, with dotdiw create, in the worker''s
    own words. What surfaces is read, and read as a claim about the project that can
    be wrong. And a procedure that gets repeated, or found stale, is written as a
    formula where it belongs and committed on its own. Take away the naming and nothing
    surfaces; take away the reading and it is a runbook nobody opened; take away the
    commit and only one checkout holds it. Any of those gone, it is a different practice..'
  openQuestions: []
story:
  raw: 'On 2026-11-01, in the dotdiw repository, the agent working here was given
    a task: implement POA_IMPLEMENTATION.md, the plan that binds the program to its
    operation algebra. Before reading a file or cutting a branch it ran dotdiw create
    with the task''s name. The create printed one formula, check-promise-artifacts,
    with the command to pour it.

    The work followed that procedure: validate the thin product, the praxis and the
    source model; derive; the additions step; validate and check the IDL; check the
    witness contract; replay; sweep. The step that could have gone wrong was additions.
    The formula said to append poa/idl-additions.yaml to operation-idl.yaml with cat,
    but the plan had just moved the derived IDL to JSON and the additions into a finishing
    script. Following the step as written would have appended YAML to a JSON file;
    poa check would still have passed on the generated bindings, and only the sweep
    would have lost the contract, later, for somebody else.

    The tempting shortcut was to do the finishing by hand, get the checks green, and
    move on. Instead the formula was rewritten as version 2: a finish step running
    poa/finish-idl.py, a promise step running both test suites, a conform step carrying
    the two facts nobody could guess -- the protobuf pin and the copy into the generated
    root -- and the readme step naming the plan. Then it was committed, on its own,
    as the project asks. The authority stopped there: the commit of everything else
    and the push were asked of the maintainer and done only on their word.

    Proof that the promise held: dotdiw check reports six formulas, all discoverable,
    with the new examples retrieving the formula; the commit holds the file; and the
    next create for this work surfaces the rewritten procedure instead of the stale
    one.'
  summary: 'On 2026-11-01, in the dotdiw repository, the agent working here was given
    a task: implement POA_IMPLEMENTATION.md, the plan that binds the program to its
    operation algebra. Before reading a file or cutting a branch it ran dotdiw create
    with the task''s name. The create printed one formula, check-promise-artifacts,
    with the command to pour it. The work follow...'
  originalPhrases:
  - dotdiw create
  - the declared moment
  - a formula
  - formula new
  - surfaces
  - holds
  - check-promise-artifacts
  - on its own
  - as the project asks
