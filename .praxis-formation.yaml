      Only the next pour would have found out, and not from me.

      - Where authority stops: At the formula file. Committing it is what the project
      asks of whoever writes a procedure, so I did that on my own. Committing everything
      else, pushing the branch, releasing through the tap, deciding whether the praxis
      is recognised: those are the maintainer''s, and each was asked for and done
      only on their word. dotdiw itself stops even earlier -- it shows and never enforces,
      and it never commits for anyone.


      Recognition:

      - Proof it worked: Three things anyone can look at. dotdiw check says six formulas,
      all discoverable, and the two new example titles retrieve the rewritten formula.
      The commit holds the file, so a clone has it. And the formula''s steps, run
      from the top, reproduce the whole set of checks -- fourteen in poa check, five
      replays, the sweep, two test suites, the conformance harness -- which they did,
      from a clean state, before the plan was called done.

      - Excellent version: The drift never reaches a person. The moment a step names
      a file that is gone, the check says so before anyone pours; the formula is edited
      where it lives, in the same sitting as the change that made it stale, and committed
      with it. Nobody carries the difference in their head, and the next create surfaces
      something that is simply true.

      - Betrayal: A procedure that is followed because it surfaced, not because it
      is right. Steps closing in order while the thing they describe no longer exists;
      a check that stays green because it looks at the file and not at the tool; a
      formula rewritten but not committed, so my checkout has the fix and the project
      does not. Or the tool starting to refuse: a pour blocked because no create came
      first would be enforcing, and this practice shows.

      - No longer the same if removed: Three things. Work is named before it is touched,
      with dotdiw create, in the worker''s own words. What surfaces is read, and read
      as a claim about the project that can be wrong. And a procedure that gets repeated,
      or found stale, is written as a formula where it belongs and committed on its
      own. Take away the naming and nothing surfaces; take away the reading and it
      is a runbook nobody opened; take away the commit and only one checkout holds
      it. Any of those gone, it is a different practice.'
