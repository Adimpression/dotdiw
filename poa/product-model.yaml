  - stepId: step.forward-to-the-tracker
    journeyId: journey.run-a-tracker-command
    sequence: 1
    title: Forward to the tracker
    given: A command dotdiw does not own, or cook, which is the tracker's underneath.
    when: dotdiw runs it.
    then: Under beads the command runs with the worker's terminal, through a pty when it is interactive, every occurrence of the tracker's name in the stream is rewritten to dotdiw on the way out, and the exit code is the tracker's; under an adapter with no pass-through, list, ready, show, close, update and dep add are answered from its records, --help, -h and help with the conventions text as bare dotdiw gives it, and any other command is refused as unsupported.
    thenAssertions:
      - Interactive prompts still work.
      - A word split across two reads is still rewritten.
      - Without the tracker on the machine, the worker is told in one line how to install the tracker this checkout chose, and the exit code is 127.
      - The step is bound to the worker's terminal, the tracker's stream being the one thing dotdiw shows that no response carries; a transport without a terminal gets the tracker's output in the response and no prompts.
      - A description typed through the pass-through reaches the tracker exactly as typed.
    relatedObjectIds:
      - object.tracker-command
    relatedInteractionIds:
      - interaction.forward-command
    relatedInvariantIds:
      - invariant.one-door
      - invariant.one-name-for-all-four
    expectedUserVisibleOutcome: The tracker's own answer, under dotdiw's name.
    status: active
    operation:
      externalCalls:
        - dependencyId: dependency.beads
          operationRef: "product.beads::*"
          callPurpose: >-
            Through the beads adapter's forward extra, the pass-through, on
            this body's behalf: whatever command was given, unchanged, with
            the worker's terminal; the tracker's exit code is the worker's.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.tracker"
          callPurpose: >-
            The workspace's adapter, read through the tracker door on this
            body's behalf when the request names none.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --show-toplevel"
          callPurpose: >-
            The checkout, when the request carries no root, for the tracker
            door to read the workspace's adapter from.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config user.name"
          callPurpose: >-
            Under the beads adapter: the name an assignee of me stands for, in
            an update as typed.
          failurePropagation: propagate
      calls:
        - operationId: operation.teach-the-conventions
          callPurpose: >-
            Under an adapter without a pass-through: the conventions text in
            place of the tracker's help, for --help, -h and help, as bare
            dotdiw gives it.
          required: false
          failurePropagation: propagate
        - operationId: operation.list-items
          callPurpose: >-
            Under an adapter without a pass-through: list, open or all,
            perhaps under a parent.
          required: true
          failurePropagation: propagate
        - operationId: operation.ready-items
          callPurpose: "Under an adapter without a pass-through: ready."
          required: true
          failurePropagation: propagate
        - operationId: operation.show-item
          callPurpose: "Under an adapter without a pass-through: show <id>."
          required: true
          failurePropagation: propagate
        - operationId: operation.close-item
          callPurpose: >-
            Under an adapter without a pass-through: close <id>... with its
            reason, one call per id.
          required: true
          failurePropagation: propagate
        - operationId: operation.update-item
          callPurpose: >-
            Under an adapter without a pass-through: update <id> with a title,
            status, priority, parent or assignee.
          required: true
          failurePropagation: propagate
        - operationId: operation.add-need
          callPurpose: >-
            Under an adapter without a pass-through: dep add <id> <needs>.
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: arguments
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            The command-line arguments as typed, forwarded to the tracker
            unchanged.
          cardinality: many
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
      responseFields:
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: output
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The tracker's output with its name rewritten, as the terminal saw
            it; what NameTheWork and PourProcedure read their ids from.
        - name: closedRefs
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            The ids a close that succeeded named; the witness writes
            molecule_closed or step_closed for each one that belongs to a
            poured molecule.
          cardinality: many
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - not-installed
              - unsupported
              - tracker-unknown
              - adapter-failed
              - unsupported-command
          required: false
          summary: >-
            Why nothing ran: the tracker underneath is not installed, the
            chosen adapter offers no pass-through, or no adapter of that name
            is here.
        - name: printed
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            The adapter ran a product's own command with the worker's
            terminal, so what it printed is on the terminal already; false
            when it answered in records, which the presenter then shows.
        - name: operation
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            Under an adapter without a pass-through: the operation of the
            tracker interface the command was answered by.
        - name: answers
          valueType:
            kind: list
            itemType:
              kind: map
              keyType:
                kind: scalar
                scalar: string
              valueType:
                kind: scalar
                scalar: string
          required: false
          summary: >-
            Under an adapter without a pass-through: the interface's
            responses, one per id the command named, in order; the presenter
            shows them.
          cardinality: many
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter that answered, as the tracker door stamped it; the
            witness log records it.
  - stepId: step.index-the-project
    journeyId: journey.find-a-held-procedure
    sequence: 1
    title: Index the project
    given: A repository with formulas wherever they sit in the tree, and the formula management providers registered under the home.
    when: Anything needs to know what the project holds -- a match, a check, a list, a resolve, a new formula's seed examples.
    then: The formula files are found on the file system, every directory whose name starts with a dot left out, no symbolic link followed and only regular files read; each registered provider's formulas are taken from its list, under their suffixed ids; all are indexed with the project's own tracked text as background, so that everyday words in this project score as everyday.
    thenAssertions:
      - An uncommitted formula file is indexed too; git plays no part in finding a formula.
      - A provider that fails, or answers outside its shape, is left out of the run with one line naming it.
      - Each provider is asked for its list once per process.
      - Every operation asked of the door from outside it reads the formula files afresh, and every step of it shares that one reading; the next operation reads them again.
      - A provider's formula is indexed from its list alone; its text is asked for when it is shown or poured.
      - A formula file that does not parse is answered by its path, for check to name.
      - The background is capped so that a create stays faster than the tracker call it follows.
      - A Python without tomllib, or a SQLite without FTS5, is reported and the run stops rather than answering that the project holds nothing.
      - A formula's verify-using is read with it and adds nothing to what a title reaches.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.find-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
    expectedUserVisibleOutcome: Nothing; the index is what the other steps answer from.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: >-
          Observes and prints; changes nothing in the project or the tracker.
      derivedFrom:
        - sourceKind: manual-decision
          sourceRef: step.index-the-project
          reason: "Reads git and the formula files; builds an in-memory index."
      calls:
        - operationId: operation.list-provider-formulas
          callPurpose: >-
            List each registered provider's formulas, under their suffixed
            ids, beside the local ones.
          required: false
          failurePropagation: ignore-with-explicit-reason
          required: false
          failurePropagation: ignore-with-explicit-reason
      externalCalls:
        - dependencyId: dependency.git
          operationRef: "product.git::ls-files"
          callPurpose: >-
            The project's tracked text, the background the formulas are ranked
            against; git plays no part in finding a formula.
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: background
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Build the ranking index too; off when only the formula set is
            wanted.
      responseFields:
        - name: formulaCount
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: fileCount
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            The formula files found on the file system; more than
            formulaCount when a file could not be read, and the summary says
            why.
        - name: providersLeftOut
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            One line for each registered provider that failed or answered
            outside its shape, left out of this run.
          cardinality: many
        - name: unparsed
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            The formula files found that did not parse, by their paths in the
            checkout; check names each.
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - stepId: step.list-formulas
    journeyId: journey.find-a-held-procedure
    sequence: 2
    title: List the formulas
    given: Someone asks what procedures the project holds.
    when: They run dotdiw formula list.
    then: Every formula is listed with its id, its description, and its path or the provider that serves it, and the command to pour one; with --json, the same as data.
    thenAssertions:
      - The answer is about the project, not about the tracker's own two directories.
      - A project with no formulas is told how to write one.
      - With --json, each formula carries its verify-using, and a provider formula its provider.
      - The header counts the formulas listed, wherever they are kept; each formula's own lines say where.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.find-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
    expectedUserVisibleOutcome: One entry per formula with its path or its provider, or the pointer to learn.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: >-
          Observes and prints; changes nothing in the project or the tracker.
      derivedFrom:
        - sourceKind: manual-decision
          sourceRef: step.list-formulas
          reason: "Prints what the project holds."
      calls:
        - operationId: operation.index-the-project
          callPurpose: "The formulas the project holds, read from git."
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: json
          valueType:
            kind: scalar
            scalar: boolean
          required: false
      responseFields:
        - name: formulas
          valueType:
            kind: list
            itemType:
              kind: type-ref
              typeId: type.held-formula
          required: false
          summary: >-
            What the project holds, as the renderer lists it, or prints it as
            JSON when asked.
          cardinality: many
        - name: formulaCount
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - stepId: step.show-formula
    journeyId: journey.find-a-held-procedure
    sequence: 3
    title: Show a formula
    given: Someone names a formula, in local storage or from a registered provider.
    when: They run dotdiw formula show with its id, file name or path, or a provider formula's suffixed id.
    then: The formula is printed as it is written, from where it is written; a provider's formula as its provider shows it, under its suffixed id.
    thenAssertions:
      - The text is the file's, not a rendering of the tracker's cooked copy.
      - An id refused as ambiguous, as a provider's formula the provider does not serve, or for a provider that failed, is said in one line and never handed to the tracker.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.find-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
    expectedUserVisibleOutcome: The formula file.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: >-
          Observes and prints; changes nothing in the project or the tracker.
      derivedFrom:
        - sourceKind: manual-decision
          sourceRef: step.show-formula
          reason: "Prints one formula file."
      calls:
        - operationId: operation.resolve-formula
          callPurpose: "Find the file the id names."
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: ident
          valueType:
            kind: scalar
            scalar: string
          required: true
      responseFields:
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - formula-not-found
              - ambiguous
              - provider-formula-unserved
              - provider-failed
          required: false
          summary: >-
            Why nothing was shown, as resolve-formula answered it; only
            formula-not-found is handed to the tracker as typed.
        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The repository-relative path of the file shown."
        - name: text
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The file, as written."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - stepId: step.resolve-formula
    journeyId: journey.find-a-held-procedure
    sequence: 4
    title: Resolve a formula
    given: An id, a file name or a path that may name a formula, or a suffixed id that may name a provider's.
    when: formula pour, mol pour, cook or formula show is given it.
    then: It resolves to that formula, answered as data from the reading that resolved it -- a file in the tree as the index read it, a provider's formula from its show -- or to nothing, in which case the command is handed to the tracker as it was typed -- unless the ident carries the suffix of a provider registered or removed, which is refused.
    thenAssertions:
      - The id, the file's base name and the repository-relative path all resolve.
      - An ident with the suffix of a registered or removed provider resolves to that provider's formula alone, never to a local formula by its id or by an alias; any other ident resolves by its id, then by a path exactly as given, then by a file's name. Two formulas at one tier are refused as ambiguous.
      - An ident with the suffix of a registered or removed provider that names none of its formulas is refused, and never handed to the tracker.
      - A provider's formula is asked of its provider only when it is resolved, and nothing is written for it.
      - The formula answered for a file in the tree is the one the index read when it resolved the id, so that a pour pours what was selected; nothing reads the file again for it.
      - Nothing outside the repository and the registered providers is searched.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.find-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
    expectedUserVisibleOutcome: Nothing; the formula resolved, as data, is what a pour pours, and its file is what show prints and cook reads.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: >-
          Observes and prints; changes nothing in the project or the tracker,
          and writes nothing for a provider's formula.
      derivedFrom:
        - sourceKind: manual-decision
          sourceRef: step.resolve-formula
          reason: "Maps an id to a file; changes nothing."
      calls:
        - operationId: operation.index-the-project
          callPurpose: "The formulas, by id, file name and path."
          required: true
          failurePropagation: propagate
        - operationId: operation.show-provider-formula
          callPurpose: >-
            A provider's formula, written to a file when the ident names one,
            and only then.
          required: false
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: ident
          valueType:
            kind: scalar
            scalar: string
          required: true
      responseFields:
        - name: formulaRef
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The formula id resolved, or absent."
        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The repository-relative path of its file."
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - formula-not-found
              - ambiguous
              - provider-formula-unserved
              - provider-failed
          required: false
          summary: >-
            Why nothing resolved: no formula, more than one, an ident with a
            provider's suffix that the provider does not serve, or a provider
            that failed to show its formula. Only the first is handed to the
            tracker as typed.
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
        - name: formula
          valueType:
            kind: type-ref
            typeId: type.formula-body
          required: false
          summary: >-
            The formula resolved, as data, from the reading that resolved it: a
            formula in local storage as the index read its file, a provider's
            from its show.
  - stepId: step.teach-the-conventions
    journeyId: journey.learn-the-conventions
    sequence: 1
    title: Teach the conventions
    given: Someone, or an agent on its first day, in any directory.
    when: They run dotdiw with no arguments, or dotdiw learn.
    then: The four capabilities, the two conventions and the commands are printed as one text.
    thenAssertions:
      - The text names dotdiw create as where work starts, the formula file and where it lives, the commit, and how a title is matched.
      - The text is the same in every project.
      - The text says how a formula names the means to prove its run.
    relatedObjectIds: []
    relatedInteractionIds:
      - interaction.learn
    relatedInvariantIds:
      - invariant.one-door
    expectedUserVisibleOutcome: The teaching text.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: >-
          Observes and prints; changes nothing in the project or the tracker.
      derivedFrom:
        - sourceKind: manual-decision
          sourceRef: step.teach-the-conventions
          reason: "Prints compiled-in text."
      responseFields:
        - name: text
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "How work gets done here, as printed."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - stepId: step.open-tracker
    journeyId: journey.answer-through-the-tracker
    sequence: 1
    title: Open the workspace's tracker
    given: A workspace key, and an adapter that would answer.
    when: A body needs the tracker and the adapter has no store for the key yet, or a workspace is moved onto the adapter.
    then: The adapter has a store for this checkout and answers for it.
    thenAssertions:
      - Nothing is made in the repository's tree.
      - A second open changes nothing.
    relatedObjectIds:
      - object.tracker
      - object.tracker-adapter
    relatedInteractionIds:
      - interaction.answer-through-adapter
    relatedInvariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
    expectedUserVisibleOutcome: None; the first operation is answered.
    status: active
    stateTransitions:
      - objectId: object.tracker
        fromState: unopened
        toState: open
    operation:
      visibility: internal-only
      externalCalls:
        - dependencyId: dependency.beads
          operationRef: "product.beads::init --stealth --skip-hooks --skip-agents"
          callPurpose: >-
            Under the beads adapter: bd initialises its database under the
            home, told where through BEADS_DIR; stealth declines the sync
            remote, the other two decline hooks and agent files.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.workspace"
          callPurpose: >-
            The key this checkout's store sits under, read once per process by
            the adapter that answers.
          failurePropagation: propagate
      requestFields:
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, local.
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: prefix
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The id prefix for the workspace, where the adapter honours one.
      responseFields:
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - tracker-unknown
              - adapter-failed
              - no-workspace
              - store-unwritable
              - not-installed
          required: false
          summary: "Why the operation failed, when it did."
        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            Where the store is: a file under the keyed directory, or the
            adapter's own locator.
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: created
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Whether this call made the store, as opposed to finding it already
            there.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter that answered, stamped by the tracker door; what the
            witness log records.
  - stepId: step.describe-tracker
    journeyId: journey.answer-through-the-tracker
    sequence: 2
    title: Describe an adapter
    given: A registered adapter.
    when: A body or the worker asks what it is.
    then: Its name, version, capabilities and check target come back as a record.
    thenAssertions:
      - The record never carries a credential.
      - The capabilities say whether needs are native or kept in a sidecar.
      - An adapter that can say who it acts as names them and says whether the tracker checked; never with an email address.
    relatedObjectIds:
      - object.tracker-adapter
    relatedInteractionIds:
      - interaction.answer-through-adapter
    relatedInvariantIds:
