    approvalStatus: draft
    createdAt: "2026-11-03T18:00:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
        - projection.tracker-door
        - boundary.dotdiw-to-tracker
        - invariant.one-tracker-door
      summary: >-
        Put the tracker behind a door of its own: the ten operations of a
        tracker interface, with typed requests and responses, generated into
        dotdiw as a second table and answered by an adapter chosen per
        request, else per workspace, else the shipped default, with one
