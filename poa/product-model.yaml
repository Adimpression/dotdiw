  - changeId: change.every-read-of-the-tracker-reads-it-whole
    changeType: model-update
    targetRefs:
      - step.notice-handmade-procedures
      - step.write-formula
      - step.pour-steps
    summary: >
      From 3.0.0, every read dotdiw makes of the tracker reads every item it
      asks for. The notice of procedures built by hand, the past titles a
      formula's name is drawn against, and the steps formula new --from reads
      take every item, where each stopped at the first 300 without saying so;
      under beads, a pour reads its own root's children back, all of them,
      where it read 300 issues of the whole workspace.
    reason: >
      A procedure built after the 300th item was never noticed, an id past it
      gave formula new --from nothing, and a pour into a busy workspace could
      come back short of its steps. Nothing said any of it.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.keep-procedures-findable
      affectedJourneys:
        - journey.write-a-procedure-down
        - journey.start-named-work
        - journey.answer-through-the-tracker
      affectedSlos: []
      affectedTraces: []
      affectedInvariants: []
      riskLevel: low
      riskExplanation: >
        A tracker holding many items is read whole where it was read in part;
        the hosted adapter already read every page before cutting the list.
    migrationPlan: null
    approvalStatus: draft
    createdAt: "2026-11-10T02:30:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
      summary: >-
        notice-handmade-procedures and write-formula ask list-items for every
        item, with no limit; pour-steps under beads lists the root's children
        with --parent and no count. No type moves. Migration plan: none.
      reason: >-
        Three reads stopped at 300 items without saying so.
      compatibility: corrective
      createdAt: "2026-11-10T02:30:00+08:00"
      approvalStatus: draft
  - changeId: change.beads-pours-the-steps-it-is-given
    changeType: model-update
    targetRefs:
      - step.pour-steps
      - step.pour-procedure
      - step.forward-to-the-tracker
    summary: >
      From 3.0.0, the beads adapter pours as the local adapter does: it makes
      the root with bd create, keeping the formula's description and the
      means to prove its run in its metadata, then one issue per step in the
      order the needs allow, each blocked by the steps it needs, and answers
      the step ids in the formula's order. bd's cook and mol pour are no
      longer a pour's. A pour that fails after making its root names the root
      and the steps it made, in JSON too under --json; steps that share an id
      are refused before anything is made; and every title and description
      reaches bd as a value, never read as a flag.
    reason: >
      Through bd's own cook and pour, the adapter could not tell which issue
      was which step, so it answered the new issues sorted by id where the
      interface promises the formula's order, and found them by reading the
      workspace back.
    compatibility: breaking
    impactAssessment:
      affectedDuties:
        - duty.surface-procedures-when-work-starts
      affectedJourneys:
        - journey.start-named-work
        - journey.answer-through-the-tracker
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.one-tracker-door
      riskLevel: medium
      riskExplanation: >
        A formula that leans on bd's own formula features -- its variables,
        its conditions -- pours its steps as written, and a root a pour makes
        carries none of bd's proto labels. formula pour --json answers
        dotdiw's record, the root id and the step ids, where it answered bd's.
    migrationPlan: >
      Nothing moves. A run poured before 3.0.0 stays as bd poured it.
    approvalStatus: draft
    createdAt: "2026-11-10T03:00:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
        - projection.tracker-door
      summary: >-
        pour-steps under beads runs create alone, for the root and for each
        step; cook --persist --force, mol pour, list, show and update leave
        its external calls. The reason of pour-steps and of pour-procedure
        gains duplicate-step, for steps that share an id. Migration plan:
        none.
      reason: >-
        bd's own pour hid which issue was which step.
      compatibility: breaking
      createdAt: "2026-11-10T03:00:00+08:00"
      approvalStatus: draft
  - changeId: change.no-pour-lock-under-beads
    changeType: model-update
    targetRefs:
      - step.forward-to-the-tracker
    summary: >
      From 3.0.0, the beads adapter holds no lock: a pour cooks nothing, so a
      command forwarded to bd runs as typed, whatever words it holds.
    reason: >
      The lock kept a cook forwarded through dotdiw from landing between a
      pour's cook and its pour, and found such a cook by scanning the
      forwarded words for cook and mol. A pour makes its issues itself now.
    compatibility: corrective
    impactAssessment:
      affectedDuties: []
      affectedJourneys:
        - journey.run-a-tracker-command
      affectedSlos: []
      affectedTraces: []
      affectedInvariants: []
      riskLevel: low
      riskExplanation: >
        Nothing a pour does can be interleaved with a forwarded command, since
        a pour no longer cooks.
    migrationPlan: >
      A pour.lock left in a workspace by 2.0.0 is read by nothing and may be
      removed.
    approvalStatus: draft
    createdAt: "2026-11-10T03:30:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
      summary: >-
        forward-to-the-tracker no longer promises a lock held while a
        forwarded command names cook or mol. No type moves. Migration plan:
        none.
      reason: >-
        A pour no longer cooks, so there is nothing for a forwarded cook to
        land between.
      compatibility: corrective
      createdAt: "2026-11-10T03:30:00+08:00"
      approvalStatus: draft
  - changeId: change.a-pour-hands-over-the-formula-it-read
    changeType: model-update
    targetRefs:
      - step.pour-procedure
    summary: >
      From 3.0.0, a pour reads its formula once and hands the tracker what it
      read: the title, the description, the means to prove and the steps. No
      path goes to the tracker, and nothing is written under the workspace;
      the formula poured is the one its lookup selected, as the index read
      it for that pour, whatever is written to its file meanwhile; the next
      pour reads it again, and steps that share an id are refused before the
      tracker is asked.
    reason: >
      Every pour copied its formula into a snapshot under the workspace, named
      for a digest of its bytes, only so that beads could cook a file that
      read as the pour had. Beads pours the steps it is given now.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.surface-procedures-when-work-starts
      affectedJourneys:
        - journey.start-named-work
      affectedSlos: []
      affectedTraces: []
      affectedInvariants: []
      riskLevel: low
      riskExplanation: >
        An adapter that poured from the file at path is handed none; every
        shipped adapter pours the steps it is given.
    migrationPlan: >
      The pours directory a workspace holds from 2.0.0 is read by nothing and
      may be removed.
    approvalStatus: draft
    createdAt: "2026-11-10T04:00:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
      summary: >-
        pour-procedure hands pour-steps no path, and promises one reading of
        the formula with nothing written for it. No type moves. Migration
        plan: none.
      reason: >-
        The snapshot existed for beads to cook, and beads no longer cooks.
      compatibility: corrective
      createdAt: "2026-11-10T04:00:00+08:00"
      approvalStatus: draft
  - changeId: change.dotdiw-parses-its-own-flags
    changeType: model-update
    targetRefs:
      - step.name-the-work
      - journey.start-named-work
      - step.pour-procedure
      - step.adopt-repository
      - journey.adopt-a-repository
      - step.forward-to-the-tracker
    summary: >
      From 3.0.0, dotdiw's own commands read their own flags, and nothing
      typed goes to the tracker. create takes one title, -p or --priority,
      --parent, -d or --description, --json, and -q, --quiet or --silent;
      formula pour takes --json; init takes --prefix and --tracker. Any other
      flag is refused in one line naming it, and so is a flag of its own
      given no value, or --tracker given no name; --description=<text> gives
      a value that starts with a dash. bd's table of flags is the beads
      adapter's, read only by its pass-through.
    reason: >
      dotdiw read create's title around a table of bd's own flags, so every
      tracker's create was parsed as bd's, and everything typed after create,
      formula pour and init went to the tracker as it was typed.
    compatibility: breaking
    impactAssessment:
      affectedDuties:
        - duty.surface-procedures-when-work-starts
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.start-named-work
        - journey.adopt-a-repository
        - journey.run-a-tracker-command
      affectedSlos: []
      affectedTraces: []
      affectedInvariants: []
      riskLevel: medium
      riskExplanation: >
        A create under beads that relied on one of bd's own flags -- a label, a
        type, an assignee -- is refused; the flag is set afterwards through
        the pass-through, as dotdiw update. Under beads, create, formula pour
        and init print dotdiw's own lines, as under every tracker.
    migrationPlan: >
      Set what bd's own create flags set with dotdiw update after the create.
    approvalStatus: draft
    createdAt: "2026-11-10T04:30:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
      summary: >-
        start-named-work and name-the-work take json and no arguments; pour-procedure takes json and no arguments;
        adopt-a-repository and adopt-repository take prefix and no arguments.
        Migration plan: set what bd's own create flags set with dotdiw update.
      reason: >-
        What was typed went to the tracker as typed, parsed around bd's own
        flags.
      compatibility: breaking
      createdAt: "2026-11-10T04:30:00+08:00"
      approvalStatus: draft
  - changeId: change.tracker-interface-3-carries-data-alone
    changeType: model-update
    targetRefs:
      - step.pour-steps
      - step.create-item
      - step.open-tracker
      - step.name-the-work
      - step.pour-procedure
      - step.adopt-repository
      - invariant.one-tracker-door
    summary: >
      From 3.0.0, the tracker interface is number 3 and carries data alone:
      path, arguments and terminal leave the requests of pour-steps,
      create-item and open-tracker, and printed leaves their answers and the
      answers of name-the-work, pour-procedure and adopt-repository. Every
      adapter answers in records, and dotdiw prints every create, pour and
      init from them. A module written for interface 2 is refused in one
      line naming it.
    reason: >
      The interface carried a formula's file, the words a worker typed, the
      worker's terminal and whether the adapter had printed for itself, only
      so that beads could run bd's own commands with the terminal and the
      flags as typed.
    compatibility: breaking
    impactAssessment:
      affectedDuties:
        - duty.surface-procedures-when-work-starts
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.answer-through-the-tracker
        - journey.start-named-work
        - journey.adopt-a-repository
        - journey.ship-a-tracker
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.one-tracker-door
      riskLevel: high
      riskExplanation: >
        Every adapter written for interface 2, the Jira adapter among them, is
        refused until its author ships one written for 3; the adapters dotdiw
        ships move with it, and the Jira adapter in trackers/ moves in the
        same change.
    migrationPlan: >
      An adapter's author declares interface 3, reads no path, arguments or
      terminal, and answers every create, pour and open in records, with no
      printed.
    approvalStatus: draft
    createdAt: "2026-11-10T05:00:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
        - projection.tracker-door
        - invariant.one-tracker-door
      summary: >-
        pour-steps loses path, arguments and terminal; create-item and
        open-tracker lose arguments and terminal; their answers lose printed,
        and so do name-the-work's, pour-procedure's and adopt-repository's.
        The tracker interface is number 3, with its digest recorded, and a
        module written for 2 is refused in one line that names it. Migration
        plan: an adapter declares interface 3 and answers in records.
      reason: >-
        The interface carried a file, typed words and a terminal for one
        adapter's own commands.
      compatibility: breaking
      createdAt: "2026-11-10T05:00:00+08:00"
      approvalStatus: draft
  - changeId: change.a-provider-answers-a-formula-as-data
    changeType: model-update
    targetRefs:
      - step.show-provider-formula
      - step.resolve-formula
      - step.show-formula
      - step.pour-procedure
      - step.describe-provider
      - term.formula-management-provider
    summary: >
      From 3.0.0, a formula management provider's show answers the formula as
      data: its description, its means to prove, and its steps, each with an
      id, a title and the step ids it needs. dotdiw holds the answer to that
      shape and keeps it in memory; no text format is read, no file is
      written for it, and formula show prints it in the form a .formula.json
      file takes. A provider module says in its info that it was written for
      formula provider interface 2, and one that does not is refused in one
      line.
    reason: >
      show answered a file's text in TOML or JSON, which dotdiw parsed,
      rewrote with a TOML writer of its own to set the suffixed id, and cached
      as a file under the workspace, so that a provider's formula could be
      read and cooked as a local file was. An interface carries data.
    compatibility: breaking
    impactAssessment:
      affectedDuties:
        - duty.keep-procedures-findable
        - duty.surface-procedures-when-work-starts
      affectedJourneys:
        - journey.answer-through-a-formula-provider
        - journey.find-a-held-procedure
        - journey.start-named-work
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.every-provider-formula-carries-its-suffix
        - invariant.formula-storage-apart-from-task-storage
      riskLevel: medium
      riskExplanation: >
        A provider module written for 2.0.0 answers show with text and names
        no interface, so it is refused until its author moves it; the
        directory provider that ships with dotdiw moves with this change.
    migrationPlan: >
      A provider's author answers show with the formula as data and declares
      interface 2 in the module's info. The formula-providers directory a
      workspace holds from 2.0.0 is read by nothing.
    approvalStatus: draft
    createdAt: "2026-11-10T05:30:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
        - projection.door
      summary: >-
        type.formula-body and type.formula-step join the IDL. show-provider-
        formula answers formula, a type.formula-body, where it answered text
        and path; resolve-formula answers formula for every formula it
        resolves, a local one as the index read it, and so does
        find-a-held-procedure; a pour pours it.
        Migration plan: a provider answers show with the formula as data and
        declares interface 2.
      reason: >-
        The provider interface carried a file's text in one of two formats.
      compatibility: breaking
      createdAt: "2026-11-10T05:30:00+08:00"
      approvalStatus: draft
openQuestions:
  - questionId: question.hundreds-of-formulas
    question: >
      The threshold of 0.15 was calibrated on three to fifty-six formulas.
      What do retrieval and silence look like at the hundreds this is for?
    blocksChange: false
    neededFrom: measurement
    targetRefs:
      - step.match-formulas
      - slo.applicable-formula-surfaces
    decisionNeeded:
      - clarify-timing
      - other
    candidateResolutions:
      - Keep 0.15 and the bm25 ordering until a project with hundreds of committed formulas is measured; the witness log now records every match and every silence, so the measurement can come from use rather than from a built fixture.
      - Raise the floor at scale if coincidences cost more than a glance there.
      - Rank against competitors rather than a constant, which outlier.py showed does not recover silence at the sizes measured.
    recommendedDefault: >
      Kept open on 2026-11-01, consciously: the first candidate, until a
      project of that size is witnessed. Not blocking.
  - questionId: question.enforcing-the-declared-moment
    question: >
      Should a project be able to tell, per piece of work, that it began
      unnamed, or does that cross from showing into enforcing?
    blocksChange: false
    neededFrom: product-owner
    targetRefs:
      - duty.surface-procedures-when-work-starts
      - invariant.work-starts-named
    decisionNeeded:
      - clarify-product-boundary
    candidateResolutions:
      - dotdiw keeps showing and never enforces; a story the contract calls incomplete because a pour had no naming is the project's to read, in its own witness log, and nothing more.
      - A project may opt in to a notice on pour when no create preceded it in the log, which is still showing.
      - A project may refuse the pour, which is enforcing and is boundary.only-the-declared-moment crossed.
    recommendedDefault: >
      Kept open on 2026-11-01, consciously: the first candidate stands until
      the product owner decides otherwise; the second is the furthest this
      product's boundaries allow. Not blocking.
  - questionId: question.how-migrate-copies-a-root
    question: >
      create-item takes no kind, so tracker migrate moves a root as a task, and
      the notice about procedures built by hand can then name it. How does
      migrate bring a root across as a root?
    blocksChange: false
    neededFrom: product-owner
    targetRefs:
      - step.migrate-workspace
      - step.create-item
    decisionNeeded:
      - other
    candidateResolutions:
      - Migrate pours the root and its steps again through pour-steps, then sets their statuses, reasons and needs.
      - The interface gains an operation that copies a root.
    recommendedDefault: >
      Kept open on 2026-11-06 on the maintainer's word: a root moves as a task,
      its description and verify-using with it, until this is decided. Not
      blocking.
