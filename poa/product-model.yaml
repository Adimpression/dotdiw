          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --show-toplevel"
          callPurpose: >-
            The checkout, when the request carries no root, for the tracker
            door to read the workspace's adapter from.
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: ident
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The formula id, file name or path to pour."
        - name: workRef
          valueType:
            kind: scalar
            scalar: string
          required: false
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
        - name: json
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Print the root and the step ids as JSON, a pour cut short after
