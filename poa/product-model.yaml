  - changeId: change.formulas-behind-a-storage-abstraction
    changeType: model-update
    targetRefs:
      - term.formula
      - term.formula-management-provider
      - term.local-storage
      - term.suffixed-id
      - invariant.only-committed-formulas-are-held
      - invariant.every-provider-formula-carries-its-suffix
      - invariant.formula-storage-apart-from-task-storage
      - step.index-the-project
      - step.match-formulas
      - step.resolve-formula
      - step.list-formulas
      - step.show-formula
      - step.write-formula
      - step.commit-formula
      - step.describe-and-check
      - step.pour-procedure
      - step.declare-conventions
      - step.register-provider
      - step.describe-provider
      - step.list-provider-formulas
      - step.show-provider-formula
      - step.create-provider-formula
      - step.remove-provider
    summary: >
      From 2.0.0, formulas are reached through a formula management
      abstraction. A formula management provider behind it can be a file
      system or an API endpoint; several are hooked in at once, and one may
      offer discovery only. Installing a package that provides one makes it
      eligible, and it is registered under an alphanumeric name. Every formula
      from a registered provider carries that name as a suffix, after a
      hyphen. A formula without a suffix is in local storage, the file
      system, where git plays no part in finding it, and local storage itself
      commits nothing and keeps no history; committing is the concern of a
      git formula management provider. Until one ships, a formula in a
      checkout is shared by committing it, as every other file is, and
      `dotdiw check` names one git does not track. A provider answers list
      and show, and create where it can, in typical API style, and declares
      which of these it answers; initial versions require list and show of
      every provider. For now, every registered provider serves every
      checkout. A local formula whose id reads like a provider's suffixed id
      migrates.
    reason: >
      A formula was a file that one repository's git tracked, so a procedure
      could be kept nowhere else and shared only by committing it. Behind a
      formula management abstraction, where a formula is kept is the provider's business,
      and a file system or an API endpoint serves the same matching and the
      same pour.
    compatibility: breaking
    impactAssessment:
      affectedDuties:
        - duty.keep-procedures-findable
        - duty.surface-procedures-when-work-starts
        - duty.teach-without-a-project
      affectedJourneys:
        - journey.start-named-work
        - journey.write-a-procedure-down
        - journey.find-a-held-procedure
        - journey.learn-the-conventions
        - journey.answer-through-a-formula-provider
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.only-committed-formulas-are-held
        - invariant.every-provider-formula-carries-its-suffix
        - invariant.formula-storage-apart-from-task-storage
      riskLevel: high
      riskExplanation: >
        Every repository's formulas move from being found through git to being
        found on the file system, an uncommitted one included. The declared
        conventions said an uncommitted formula does not appear in formula
        list; from 2.0.0 they say it is found on its holder's file system
        alone, and they change in every repository that runs 2.0.0.
    migrationPlan: >
      The Carrier's limit on what dotdiw sees, and its substitution
      envelope's formulas, are rewritten for local storage and the providers;
      in the Praxis, the carrier that matches formulas, duty.commit-the-formula,
      antitrace.formula-held-by-one-person and the formula's lifecycle are
      rewritten the same way, and evidence.formula-committed-and-found
      stands, since committing is still how a formula in a checkout is
      shared; the Reliant Enactment's passages stand, since a provider's
      formula surfaces and pours as a local one does. A local formula whose id
      reads like a provider's suffixed id is renamed: register refuses while
      the checkout holds one, and check names one afterwards.
    approvalStatus: draft
    createdAt: "2026-11-08T12:24:00+08:00"
    idlRecord:
      changeType: project-python-protocol
      targetRefs:
        - idl.dotdiw
        - projection.door
      summary: >-
        answer-through-a-formula-provider, register-provider,
        describe-provider, list-provider-formulas, show-provider-formula and
        remove-provider join the door, with type.formula-provider for a
        registered provider. type.held-formula gains provider, the name of the
        provider that serves the formula. index-the-project finds the local
        formulas on the file system, calls list-provider-formulas and
        show-provider-formula for each registered provider, and answers
        providersLeftOut, one line for each provider it left out of the run,
        and unparsed, the formula files it could not parse; a provider's
        formulas are indexed from its list, and resolve-formula
        calls show-provider-formula when a formula is shown or poured.
        resolve-formula answers a reason -- formula-not-found, ambiguous,
        provider-formula-unserved or provider-failed -- and pour-procedure's
        reason gains the last three, none of them handed to the tracker.
        type.formula-provider gains unavailable. Migration plan: a local
        formula whose id reads like a provider's suffixed id is renamed;
        nothing else moves.
      reason: >-
        A formula was a file that one repository's git tracked. Behind a
        formula management abstraction, where a formula is kept is the
        provider's business, and the door reaches every provider the same way.
      compatibility: breaking
      createdAt: "2026-11-08T12:24:00+08:00"
      approvalStatus: draft
