    - traceId: trace.day-one-read-learn
      traceType: golden
      title: Day 1 began with learn
      description: >
        DAY_1.md: someone arriving in a project types dotdiw, is taught the
        four things and the two conventions, and from then on starts work with
        create.
      dutyId: duty.teach-without-a-project
      journeyId: journey.learn-the-conventions
      scenario: A first day in an adopted project.
      trigger: dotdiw, with no arguments.
      events:
        - sequence: 1
          title: Taught
          event: The teaching text is printed.
