      own on the way out, the witness log appended and the terminal fed from
      the typed response, with the request and response types made true to
      what the bodies use. Migration plan: none; nothing a worker sees
      changes, and seventeen commands print the same bytes as before.
    reason: >-
      A body bound to the IDL in name only read fields its type never
      declared, printed what no response carried and wrote the witness log
