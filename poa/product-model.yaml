    approvalStatus: draft
    createdAt: "2026-11-02T18:00:00+08:00"
  - changeId: change.the-tracker-behind-a-door-of-its-own
    changeType: model-update
    targetRefs:
      - object.tracker
      - object.tracker-adapter
      - interaction.answer-through-adapter
      - interaction.choose-tracker
      - interaction.move-workspace
      - boundary.dotdiw-to-tracker
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
