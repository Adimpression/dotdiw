      affectedDuties:
        - duty.put-all-four-under-one-name
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.answer-through-the-tracker
        - journey.choose-a-tracker
        - journey.move-a-workspace
        - journey.run-a-tracker-command
        - journey.adopt-a-repository
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.one-tracker-door
        - invariant.one-name-for-all-four
        - invariant.nothing-outside-the-repository
      riskLevel: medium
      riskExplanation: >
        A new adoption's work goes into the store dotdiw brings rather than the
