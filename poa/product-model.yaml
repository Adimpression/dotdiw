          failurePropagation: propagate
        - operationId: operation.update-item
          callPurpose: "An item that was in progress or blocked, set so."
          required: true
          failurePropagation: propagate
        - operationId: operation.close-item
          callPurpose: >-
            Each closed item closed with its reason, in passes, as its needs
            and children close.
          required: true
          failurePropagation: propagate
      externalCalls:
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.workspace"
          callPurpose: >-
