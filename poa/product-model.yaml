          sourceRef: step.describe-and-check
          reason: >-
            Reads the formulas and the index and prints; changes nothing.
      calls:
        - operationId: operation.index-the-project
          callPurpose: >-
            Every check is a search over the project's formulas with the
            example taken out of the index.
          required: true
          failurePropagation: propagate
        - operationId: operation.match-formulas
          callPurpose: >-
            Each example is searched for with itself taken out of the index;
            the formula must come back in the top three.
          required: true
          failurePropagation: propagate
        - operationId: operation.notice-handmade-procedures
          callPurpose: >-
            The handmade notice follows the check wherever the check runs.
          required: true
          failurePropagation: propagate
      externalCalls:
        - dependencyId: dependency.git
          operationRef: "product.git::ls-tree -z --name-only HEAD"
          callPurpose: >-
            A formula found here that HEAD does not hold -- new, staged, or
            under an ignored directory -- is reported as one nobody else can
            see.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::ls-files"
          callPurpose: >-
            A tracker directory tracked in git is a convention problem, with
            the command that ends it. A file of this repository that a
            formula's verify-using names is held when git tracks it.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.workspace"
          callPurpose: >-
            Whether this checkout is adopted, read from its key, so that a
            plain repository is not held to a convention it never declared.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::remote -v"
          callPurpose: >-
            The repositories this checkout's remotes name, so that a git+ URL
            under verify-using is told for one of this repository; the remote
            is never contacted.
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: mode
          valueType:
            kind: enum-inline
            values:
              - check
              - quiet
              - doctor
          required: false
          summary: >-
            Which of the three places asks. check: in full, with the exit
            code. quiet: under a create, the handmade notice first and then
            the first three problems. doctor: under the tracker's doctor and
            lint, the first five problems and then the notice. check when
            absent.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
      responseFields:
        - name: problems
          valueType:
            kind: list
            itemType:
              kind: type-ref
              typeId: type.convention-problem
          required: false
          summary: >-
            Every problem found, the conventions first, then the formulas in
            the order the index holds them.
          cardinality: many
        - name: formulaCount
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
        - name: undeclared
          valueType:
            kind: list
            itemType:
              kind: type-ref
              typeId: type.handmade-procedure
          required: false
          summary: >-
            The handmade notice, as NoticeHandmadeProcedures returned it,
            shown with the problems: before them under a create, after them
            under check, doctor and lint.
          cardinality: many
  - stepId: step.commit-formula
    journeyId: journey.write-a-procedure-down
    sequence: 5
    title: Commit the formula
    given: A formula that finds itself.
    when: The worker commits the formula file, on its own, as the last step of writing it.
    then: The project holds the formula; every create in every checkout that has pulled it can reach it.
    thenAssertions:
      - git lists the formula.
      - dotdiw check no longer reports it as uncommitted.
      - dotdiw did not make the commit.
      - The command it prints runs as printed, whatever the directory is called.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.write-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
      - invariant.tool-never-commits
    expectedUserVisibleOutcome: The formula appears in dotdiw formula list for everyone.
    status: active
    stateTransitions:
      - objectId: object.formula
        fromState: findable
        toState: held
    operation:
      calls: []
      externalCalls: []
      notes: >-
        Never performed by dotdiw: invariant.tool-never-commits. The body
        refuses, returning blocked with the exact git command and the reason
        the commit is the worker's. It binds inline because POA's conformance
        check requires every binding to resolve to a callable.
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The repository the interface resolved; bodies never ask git for it
