            scalar: string
          required: true
          summary: >-
            The tracker's name: lowercase letters, digits and hyphens,
            starting with a letter.
        - name: directory
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "Where to write the file; the current directory by default."
      responseFields:
        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The file written."
        - name: reason
          valueType:
            kind: enum-inline
            values:
