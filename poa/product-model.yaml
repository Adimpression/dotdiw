  - stepId: step.describe-and-check
    journeyId: journey.write-a-procedure-down
    sequence: 4
    title: Describe it to be found, and check
    given: A written formula.
    when: The description and examples are written in the words people use for the work, and dotdiw check is run.
    then: check reports whether the formula is found from each of its examples, each one taken out of the index while it is searched for, together with the other convention problems -- an uncommitted formula, a local formula whose id reads like a registered provider's suffixed id, a formula outside the repository, a description too short to name a situation, a scaffold still carrying TODO, too few examples, a verify-using value it cannot read or one longer than a line, a file of this repository that verify-using names and git does not track, instruction files that do not say where work starts.
    thenAssertions:
      - An example that fails is named, with the formula it should reach.
      - A formula found in local storage that HEAD does not hold -- new, staged, or under an ignored directory -- is reported as one nobody else can see, whether or not it parses.
      - A formula file that does not parse is named, since nothing can find it.
      - A local formula whose id carries the suffix of a registered or removed provider is named with the provider, to rename.
      - The same check runs quietly after every create, and after doctor and lint, printing only the first few problems.
      - A verify-using value check cannot read, one longer than a line, and a file of this repository that a value names and git does not track are each named with the formula; the file is looked for in the checkout, and no remote is contacted.
