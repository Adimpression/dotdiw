journeys:
  - journeyId: journey.start-named-work
    dutyId: duty.surface-procedures-when-work-starts
    title: Start named work
    description: >
      Someone names the work, the formulas that apply appear with it, and the
      one that fits is poured as tracked steps.
    purpose: Discovery fires at the declared moment, every time.
    trigger: Someone is about to do a piece of work in an adopted project.
    preconditions:
      - The repository is adopted.
      - Formulas are in local storage or served by a registered provider.
    primaryFlow:
      - The work is named with dotdiw create.
      - The title is matched against the formulas in local storage and from the registered providers, and the applying ones are printed.
      - The one that fits is poured as ordered steps.
      - With every create, because the tracker rewrites the files agents read, the conventions are re-declared, procedures carried out by hand are noticed, and the conventions check runs quietly.
    completionCriteria:
      - The work item exists.
      - Every formula that applies to the title was printed, with its path and the command to pour it.
      - The poured formula's steps are tracked with their dependencies.
    variants:
      - No formula applies, and the create prints the work item alone.
    failureBoundaries:
      - A title in words no formula uses surfaces nothing; the description is where that is fixed.
    nonGoals:
      - Deciding for the worker which formula to pour.
    inputObjectIds:
      - object.work
      - object.formula
    outputObjectIds:
      - object.work
      - object.molecule
    invariantIds:
      - invariant.one-door
      - invariant.work-starts-named
    stepIds:
      - step.name-the-work
      - step.match-formulas
      - step.pour-procedure
    sliIds:
      - sli.applicable-formula-surfaces
      - sli.create-feedback-latency
    sloIds:
      - slo.applicable-formula-surfaces
      - slo.create-feedback-under-one-second
    goldenTraceIds:
      - trace.release-found-its-procedure
      - trace.recorded-run-found-its-procedure
      - trace.pour-named-the-means-to-prove-its-run
    antiGoldenTraceIds:
      - antitrace.procedure-poured-unnamed
      - antitrace.poured-what-never-surfaced
      - antitrace.coincidence-surfaces
      - antitrace.create-both-surfaced-and-silent
    timing:
      realWorldLatencyClass: mixed
      syncExpectation: mixed
      causalJustification: >
        The match is in the same breath as the title; the pour's issues may
        take the tracker longer than a second. Measured 2026-11-01 on the
        maintainer's machine, seven runs: a create with everything that rides
        along takes 0.79 s at the median (0.78 to 0.81), of which bd's own
        create is 0.41 s; most of the rest is the tracker listing for the
        handmade notice, which comes after the match. From the witness log,
        ten creates: 464 ms at the median from the process starting to the
        match being printed, the figure the SLO is about.
    networkBoundaryIds:
      - boundary.create-to-match
      - boundary.dotdiw-to-tracker
    status: active
    version: 0.3.0
    operation:
      calls:
        - operationId: operation.name-the-work
          callPurpose: "Compose operation.name-the-work as a governed journey step."
          required: true
          failurePropagation: propagate
        - operationId: operation.declare-conventions
          callPurpose: >-
            Re-declare the conventions after the create, because the tracker
            rewrites the files agents read on setup, doctor --fix and
            upgrades.
          required: true
          failurePropagation: propagate
        - operationId: operation.index-the-project
          callPurpose: >-
            Index the project once and hand the index to the match and the
            check, so a create indexes once.
          required: true
          failurePropagation: propagate
        - operationId: operation.match-formulas
          callPurpose: "Compose operation.match-formulas as a governed journey step."
          required: true
          failurePropagation: propagate
        - operationId: operation.describe-and-check
          callPurpose: >-
            Run the conventions check quietly after every create, printing the
            first three problems and the handmade notice.
          required: true
          failurePropagation: propagate
        - operationId: operation.pour-procedure
          callPurpose: "Compose operation.pour-procedure as a governed journey step."
          required: false
          failurePropagation: propagate
          notes: >-
            Performed when the request names a formula to pour. From the
            command line the worker pours through dotdiw formula pour after
            reading what surfaced; the create does not choose for them.
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: title
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "What the work is called, in the worker's words."
        - name: description
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The -d description, matched together with the title."
        - name: quiet
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Print the work created and nothing that rides along with it;
            --json, -q, --quiet, --silent and DOTDIW_NO_HINTS set it.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
        - name: priority
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            The item's priority, 0 to 4, from -p or --priority; 2 when unsaid.
        - name: parent
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The parent item's id, from --parent."
        - name: json
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Print the record of the work created as JSON, and nothing else; from
            --json.
      responseFields:
        - name: workRef
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The id of the work item the tracker created."
        - name: surfaced
          valueType:
            kind: list
            itemType:
              kind: type-ref
              typeId: type.held-formula
          required: false
          summary: >-
            The formulas that applied to the title, best first; empty when
            nothing crossed the threshold or the create was quiet.
          cardinality: many
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - journeyId: journey.write-a-procedure-down
    dutyId: duty.keep-procedures-findable
    title: Write a procedure down
    description: >
      Someone who repeated themselves writes the procedure as a formula next
      to what it is about, makes it findable, and commits it.
    purpose: A procedure done twice becomes one the project holds and can reach.
    trigger: Someone notices they are repeating themselves, or just did by hand what they will do again -- or dotdiw notices for them.
    preconditions:
      - The repository is adopted.
    primaryFlow:
      - A procedure built by hand in the tracker is named as undeclared, with the formula new --from line that turns it into steps; a memory that reads like a procedure is answered with the formula new line.
      - dotdiw formula new writes the file next to what it is about.
      - The description and examples are written in the words people use, and dotdiw check is run until the formula finds itself.
      - The formula file is committed, on its own.
    completionCriteria:
      - The formula is tracked by git.
      - dotdiw check finds it from each of its examples.
    variants:
      - The formula is written from work already done, with --from the work item.
    failureBoundaries:
      - A formula that cannot find itself is reported by check and not treated as held.
    nonGoals:
      - Committing or pushing on the worker's behalf.
    inputObjectIds:
      - object.formula
    outputObjectIds:
      - object.formula
    invariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
      - invariant.every-formula-finds-itself
    stepIds:
      - step.notice-handmade-procedures
      - step.nudge-towards-a-formula
      - step.write-formula
      - step.describe-and-check
      - step.commit-formula
    sliIds:
      - sli.formula-finds-itself
    sloIds:
      - slo.every-formula-finds-itself
    goldenTraceIds:
      - trace.formula-written-after-repeating
      - trace.handmade-procedure-noticed
    antiGoldenTraceIds:
      - antitrace.formula-held-by-one-person
    timing:
      realWorldLatencyClass: over-or-equal-1s
      syncExpectation: asynchronous
      causalJustification: Writing a procedure down is authoring, on human time.
    networkBoundaryIds:
      - boundary.repository-to-remote
      - boundary.check-to-report
    status: active
    version: 0.3.0
    operation:
      calls:
        - operationId: operation.index-the-project
          callPurpose: "Index the project once for the notice and the check."
          required: true
          failurePropagation: propagate
        - operationId: operation.notice-handmade-procedures
          callPurpose: >-
            Compose operation.notice-handmade-procedures as a governed journey
            step.
          required: true
          failurePropagation: propagate
        - operationId: operation.nudge-towards-a-formula
          callPurpose: >-
            Compose operation.nudge-towards-a-formula as a governed journey
            step.
          required: false
          failurePropagation: propagate
          notes: >-
            Performed when the request carries remembered text; from the
            command line it rides on dotdiw remember.
        - operationId: operation.write-formula
          callPurpose: "Compose operation.write-formula as a governed journey step."
          required: false
          failurePropagation: propagate
          notes: >-
            Performed when the request names what the procedure is for; from
            the command line it is dotdiw formula new.
        - operationId: operation.describe-and-check
          callPurpose: >-
            Compose operation.describe-and-check as a governed journey step.
          required: true
          failurePropagation: propagate
        - operationId: operation.commit-formula
          callPurpose: "Compose operation.commit-formula as a governed journey step."
          required: true
          failurePropagation: propagate
          notes: >-
            Always ends blocked: the commit is the worker's, and the response
            carries the command.
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: title
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            What the procedure is for; when present, the formula is written.
        - name: directory
          valueType:
            kind: scalar
            scalar: string
          required: false
        - name: fromRef
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The work item whose children become the steps."
        - name: text
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            Remembered text, when the journey was entered through remember.
        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            A formula file already written, when the journey is entered to
            check and commit one rather than to write it; otherwise the file
            the title produces.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
      responseFields:
        - name: command
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The git command that commits the formula; dotdiw never runs it.
        - name: problems
          valueType:
            kind: list
            itemType:
              kind: type-ref
              typeId: type.convention-problem
          required: false
          summary: "What the check found, as DescribeAndCheck reports it."
          cardinality: many
        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The formula file, written by this call or named in the request.
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - journeyId: journey.adopt-a-repository
    dutyId: duty.adopt-without-reaching-outside
    title: Adopt a repository
    description: >
      A repository is given tracking and the two conventions once. The
      tracker's state lives under the user's home, keyed to the checkout by
      one line in its own .git/config; the repository holds only the
      declaration, which the worker is told to commit; and a repository an
      earlier version adopted is put right by dotdiw init.
    purpose: Day 1 in a project is one command, the repository holds only what the project shares on purpose, and what the tool does on somebody's behalf is said.
    trigger: Someone runs dotdiw init, or runs any dotdiw command in a repository an earlier version adopted.
    preconditions:
      - Day 0 happened; dotdiw is on the machine, and so is any tracker the checkout chooses in place of the store it brings.
    primaryFlow:
      - A key and the tracker's name are written into the checkout's .git/config and the tracker is initialised under the home at that key, in stealth mode with hooks and agent files declined where it has them; nothing of it is in the repository.
      - The conventions are declared in the instruction files, which are created when absent, and the tracker is renamed in any an earlier version's tracker wrote.
      - The declaration files are listed as the worker's to commit, with the one command.
      - A hook override left by v0.1.0 is unset; a tracker left in the tree by any earlier version is replaced by one under the home with the same prefix, under init, and the command that removes the in-tree copy is named.
      - The tracker's usage metrics, where it has any, are turned off before any command of its own, and announced once.
    completionCriteria:
      - The tracker made no commit and nothing of its own is in the tree.
      - The key is in .git/config and the state is under the home; worktrees of the checkout share it.
      - core.hooksPath is not set to the tracker's directory, and the tracker under the home has no remote.
      - The instruction files declare where work starts.
      - The declaration files are named with the command that commits them, and that command leaves the tree clean.
    variants:
      - A repository already adopted by this version: init says so and changes nothing.
      - A clone of an adopted repository: it has no key, so create says to run init once; init commits nothing and makes the clone's own tracker.
      - A repository adopted by an earlier version: init adopts it under the home, keeping the prefix; earlier tasks are not carried over, and that is said once. Until then any other command is refused in one line naming init.
    failureBoundaries:
      - A core.hooksPath the project chose for itself is left alone.
      - Outside a git repository, init refuses and creates nothing.
      - What an earlier version left that cannot be put right -- a tracker in the tree that cannot be adopted under the home, or a store its adapter cannot bring up to date -- stops init in one line naming it, and nothing is adopted.
      - The tracker's own command typed in the repository finds no tracker; everything goes through dotdiw, which is the promise.
    nonGoals:
      - Committing the edited files.
      - Repairing what was already pushed into a repository's history.
    inputObjectIds:
      - object.repository
    outputObjectIds:
      - object.repository
      - object.conventions
    invariantIds:
      - invariant.one-door
      - invariant.nothing-outside-the-repository
      - invariant.tool-never-commits
    stepIds:
      - step.adopt-repository
      - step.declare-conventions
      - step.report-what-is-yours-to-commit
      - step.undo-earlier-adoption
      - step.turn-metrics-off
    sliIds:
      - sli.adoption-leaves-nothing-outside
    sloIds:
      - slo.adoption-leaves-nothing-outside
    goldenTraceIds:
      - trace.adoption-left-nothing-outside
    antiGoldenTraceIds:
      - antitrace.adoption-reached-outside
    timing:
      realWorldLatencyClass: over-or-equal-1s
      syncExpectation: asynchronous
      causalJustification: The tracker initialises its database, which takes seconds.
    networkBoundaryIds:
      - boundary.adoption
      - boundary.run-any-command
    status: active
    version: 0.6.0
    operation:
      calls:
        - operationId: operation.turn-metrics-off
          callPurpose: >-
            Compose operation.turn-metrics-off as a governed journey step.
          required: true
          failurePropagation: propagate
        - operationId: operation.undo-earlier-adoption
          callPurpose: >-
            Compose operation.undo-earlier-adoption as a governed journey
            step, with apply, before the checkout is adopted: what an earlier
            version left is put right by init alone.
          required: true
          failurePropagation: propagate
        - operationId: operation.adopt-repository
          callPurpose: >-
            Compose operation.adopt-repository as a governed journey step.
          required: true
          failurePropagation: propagate
        - operationId: operation.declare-conventions
          callPurpose: >-
            Compose operation.declare-conventions as a governed journey step.
          required: true
          failurePropagation: propagate
        - operationId: operation.report-what-is-yours-to-commit
          callPurpose: >-
            Compose operation.report-what-is-yours-to-commit as a governed
            journey step.
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
        - name: prefix
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The prefix the tracker's ids begin with, where the adapter honours one;
            from --prefix or -p.
      responseFields:
        - name: workspace
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "~/.dotdiw/<key>, where this checkout's tracker lives."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - journeyId: journey.run-a-tracker-command
    dutyId: duty.put-all-four-under-one-name
    title: Run a tracker command
    description: >
      Someone runs a command dotdiw does not own. Under beads it reaches the
      tracker unchanged, interactive prompts included, and comes back without
      the tracker's name; under the store dotdiw brings, the tracker's own
      commands are answered from it, help is the conventions text, and any
      other is refused as unsupported.
      Where the command is one people reach for instead of check or learn,
      the conventions check and the handmade notice ride along; where it is a
      memory that reads like a procedure, the nudge does.
    purpose: No task ever requires typing the tracker's own name, and the project's conventions are checked where people actually look.
    trigger: Someone runs dotdiw with a command it does not own.
    preconditions:
      - Day 0 happened; the checkout's tracker is on the machine, or reachable.
    primaryFlow:
      - For cook, the formula id is resolved to the file it lives in, wherever that is in the tree.
      - The command runs in the chosen adapter; under beads through a pty when the terminal is interactive, with the tracker's name rewritten in the stream.
      - For doctor and lint, the conventions check and the handmade notice follow the tracker's own report; for remember, a memory that reads like a procedure is answered with the formula new line.
    completionCriteria:
      - The tracker's exit code and output are the worker's, with the tracker's name replaced.
      - A doctor or lint run shows the project's convention problems under the tracker's report.
    variants:
      - The chosen tracker is not installed, and the worker is told how to install it.
      - Under an adapter without a pass-through, --help, -h and help print the conventions text, as bare dotdiw does.
      - A close of a step of a poured molecule is written to the witness log when the log is on.
    failureBoundaries:
      - Under beads, a word that is the tracker's name inside the worker's own text is rewritten too; the rewrite is on the word, not on meaning.
    nonGoals:
      - Interpreting the command or changing its arguments, beyond resolving a formula path for cook.
    inputObjectIds:
      - object.tracker-command
    outputObjectIds:
      - object.tracker-command
    invariantIds:
      - invariant.one-door
      - invariant.one-name-for-all-four
    stepIds:
      - step.forward-to-the-tracker
    sliIds: []
    sloIds: []
    goldenTraceIds:
      - trace.doctor-carried-the-check
    antiGoldenTraceIds:
      - antitrace.tracker-named-itself
    timing:
      realWorldLatencyClass: mixed
      syncExpectation: mixed
      causalJustification: >
        The spawn and the rewrite are immediate; the tracker takes however
        long its command takes.
    networkBoundaryIds:
      - boundary.command-to-tracker
    status: active
    version: 0.6.0
    operation:
      calls:
        - operationId: operation.resolve-formula
          callPurpose: >-
            For cook, resolve the formula id to the file it lives in before
            the tracker sees the command.
          required: false
          failurePropagation: propagate
        - operationId: operation.forward-to-the-tracker
          callPurpose: >-
            Compose operation.forward-to-the-tracker as a governed journey
            step.
          required: true
          failurePropagation: propagate
        - operationId: operation.describe-and-check
          callPurpose: >-
            After doctor or lint, print the project's convention problems and
            the handmade notice under the tracker's report.
          required: false
          failurePropagation: propagate
        - operationId: operation.nudge-towards-a-formula
          callPurpose: >-
            After remember, say so when the remembered text reads like a
            procedure.
          required: false
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: arguments
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            The command-line arguments as typed, forwarded to the tracker
            unchanged.
          cardinality: many
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
      responseFields:
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
  - journeyId: journey.find-a-held-procedure
    dutyId: duty.keep-procedures-findable
    title: Find a held procedure
    description: >
      Someone asks what procedures the project holds, reads one, or names one
      by its id to pour or cook it. The answer is about the project -- every
      formula in local storage wherever it sits in the tree, and every formula
      the registered providers serve -- and not about the tracker's own two
      directories.
    purpose: A formula is found where it lives, so it never has to be moved or linked anywhere.
    trigger: Someone runs formula list, formula show, formula pour, mol pour or cook.
    preconditions:
      - The repository is adopted.
    primaryFlow:
      - The formulas in the checkout are found on the file system, each registered provider's are listed and shown under their suffixed ids, and all are parsed and indexed with the project's own text as background.
      - formula list answers with every formula, its description, and its path or the provider that serves it.
      - formula show prints one formula as it is written, from where it is written, and a provider's in the form a .formula.json file takes.
      - A formula id, file name or path given to pour or cook resolves to the formula's file, and a suffixed id to the provider's formula, as data.
    completionCriteria:
      - Every formula in local storage appears with its path, and every provider formula under its suffixed id with its provider.
      - An id resolves to exactly the file it names.
    variants:
      - The project holds no formulas yet, and the answer says how to write one.
    failureBoundaries:
      - An id that names no formula is handed to the tracker as it was typed.
      - A provider that fails is left out of the run in one line, and the local formulas answer as before.
    nonGoals:
      - Searching for formulas anywhere outside the repository and the registered providers.
    inputObjectIds:
      - object.formula
    outputObjectIds:
      - object.formula
    invariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
    stepIds:
