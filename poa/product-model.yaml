      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: paths
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: "The declaration files dotdiw wrote or changed."
          cardinality: many
      responseFields:
        - name: yours
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          cardinality: many
          summary: "The files that are the worker's to commit."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - stepId: step.undo-earlier-adoption
    journeyId: journey.adopt-a-repository
    sequence: 4
    title: Undo an earlier adoption
    given: A repository adopted by any version before 0.4.0, with the tracker in its tree -- committed by 0.2.x, excluded by 0.3.0, and under v0.1.0 also carrying a core.hooksPath into .beads and a Dolt remote at its git remote.
    when: dotdiw init runs there, and puts right what is left; any other command asks first, without putting anything right.
    then: Under init, the hook override is unset, because it decides which hooks git runs. A tracker is made under the home with the prefix read from the in-tree copy's metadata and the key is written, before init adopts the checkout; the in-tree copy is left exactly as it was and the one command that removes it is named, once here and on check while it remains. Earlier tasks are not carried over, and that is said. A workspace with one adapter's store and no tracker chosen has that adapter written as the choice. Under any other command, nothing is changed, and while anything is left the command is refused in one line that names what is left and init.
    thenAssertions:
      - Only init puts anything right. Every other command but learn and --version asks first and writes nothing, and while anything is left it exits 1 with one line naming dotdiw init.
      - What cannot be put right -- a tracker in the tree that is not adopted under the home, or a store the adapter's upgrade extra could not bring up to date -- stops init in one line naming it, with exit 1, and init adopts nothing.
      - The tracker's store as an earlier version kept it is the adapter's to say and to bring up to date, through its upgrade extra; the local store and beads keep the means to prove a run as data from 3.0.0, and a store kept before then has each description's section of means moved into the store's own place for them, once, under init; an upgrade cut short is taken up by the next init where it stopped, and what it moved is left as it is; an issue whose beads metadata holds dotdiw as a value of its own, null included, keeps that value and its description as they were, since the means cannot sit beside it, and init names it.
      - A core.hooksPath pointing anywhere but .beads is left alone.
      - Nothing in the in-tree copy is read but its metadata, and nothing in it is moved, edited or deleted; a remote inside it reaches nothing, since no tracker runs there any more.
      - The new tracker has the old prefix and no tasks.
      - Nothing is printed where there was nothing to do, and the upgrade's notice is printed once.
      - The notice says an earlier version left it, which is the only case there is; a fresh init leaves nothing to put right, and nothing is printed.
    relatedObjectIds:
      - object.repository
    relatedInteractionIds:
      - interaction.run-any-command
    relatedInvariantIds:
      - invariant.one-door
      - invariant.nothing-outside-the-repository
    expectedUserVisibleOutcome: From init, a short account of what was put right, once, with the one command for the in-tree copy; from any other command, one line naming init while anything is left.
    status: active
    stateTransitions:
      - objectId: object.repository
        fromState: carrying-earlier-adoption
        toState: adopted
    operation:
      externalCalls:
        - dependencyId: dependency.git
          operationRef: "product.git::config --get core.hooksPath"
          callPurpose: >-
            Whether the tracker's hook directory stands in for the
            repository's own.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --show-toplevel"
          callPurpose: >-
            The checkout, when the request carries no root, for the tracker
            door to read the workspace's adapter from, so that the upgrade
            extra of the adapter keeping the store is asked.
          failurePropagation: propagate
        - dependencyId: dependency.beads
          operationRef: "product.beads::list --all --json"
          callPurpose: >-
            Through the beads adapter's upgrade extra, when init asks: every
            issue read, so that the means to prove a run an earlier version
            kept in a description move into the issue's metadata; an issue
            marked as moved is left as it is, and so is one whose metadata
            holds dotdiw as a value of its own, null included.
          failurePropagation: propagate
        - dependencyId: dependency.beads
          operationRef: "product.beads::update --description --metadata"
          callPurpose: >-
            Through the beads adapter's upgrade extra, when init asks: each
            such issue's description given back as it was given, and the
            means in its metadata, marked as moved, so that no later init
            moves them again.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --unset core.hooksPath"
          callPurpose: >-
            Hand the hooks back to .git/hooks; only a path inside .beads is
            ever unset.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.workspace"
          callPurpose: "Whether this checkout already has a tracker under the home."
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::ls-files"
          callPurpose: >-
            Whether the in-tree copy an earlier version left is tracked, which
            decides the one command named for removing it.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local dotdiw.tracker"
          callPurpose: >-
            The upgrade of a workspace adopted before there was a choice: the
            one adapter holding a store there is written as the choice, once,
            and said once.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.tracker"
          callPurpose: >-
            Whether a choice is recorded already, read with --local like the
            key.
          failurePropagation: propagate
      calls:
        - operationId: operation.adopt-repository
          callPurpose: >-
            Where an earlier version left the tracker in the tree and no key
            exists, and init asks for it put right, the repository is adopted
            under the home with the old prefix, quietly, before init adopts
            the checkout.
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
        - name: apply
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Put right what an earlier version left; init alone asks for it.
            Unsaid, nothing is changed, and what is left is answered as
            pending.
      responseFields:
        - name: pending
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            Without apply, one line for each thing an earlier version left
            that init would put right; empty when there is nothing.
          cardinality: many
        - name: undone
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            One line per thing undone; empty and silent when there was
            nothing.
          cardinality: many
        - name: command
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The one command that removes the in-tree copy, never run by
            dotdiw.
        - name: workspace
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The tracker this checkout is keyed to after the step."
        - name: adopted
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The tracker made by this call for a repository an earlier version
            left, or absent.
        - name: hooksReplaced
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Whether the tracker's hook directory stood in for the repository's
            own when this ran; the notice then says what that skipped.
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter written as dotdiw.tracker by this run, when the
            workspace had one adapter's store and no choice recorded; absent
            otherwise.
  - stepId: step.turn-metrics-off
    journeyId: journey.adopt-a-repository
    sequence: 5
    title: Turn the tracker's metrics off
    given: The beads tracker ships its anonymous usage metrics on, and dotdiw is about to run a command of its own; the store dotdiw brings has none.
    when: Any dotdiw command runs, --version included.
    then: Whenever a run reaches the beads tracker, chosen or not, its config says metrics are off before its first command runs, and the first time it was dotdiw that turned them off it says so; a run that reaches no adapter with metrics does nothing and says nothing.
    thenAssertions:
      - No event is queued by the tracker on the run that turns them off.
      - A checkout on local that lists, checks, chooses or moves to beads still has them off before beads is first asked anything.
      - Later runs are silent.
      - Metrics turned back on by hand are turned off again by the next run.
    relatedObjectIds:
      - object.repository
    relatedInteractionIds:
      - interaction.run-any-command
    relatedInvariantIds:
      - invariant.one-door
      - invariant.nothing-outside-the-repository
    expectedUserVisibleOutcome: One notice, once, naming the tracker, the file and the setting, with the example command under dotdiw's name.
    status: active
    operation:
      externalCalls:
        - dependencyId: dependency.beads
          operationRef: "product.beads::metrics off"
          callPurpose: >-
            Through the beads adapter's metrics-off extra, on this body's
            behalf: the tracker's anonymous usage metrics off for this machine
            before any other tracker command runs; an adapter without the
            extra has nothing to turn off.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.tracker"
          callPurpose: >-
            The workspace's adapter, read through the tracker door on this
            body's behalf when the request names none.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --show-toplevel"
          callPurpose: >-
