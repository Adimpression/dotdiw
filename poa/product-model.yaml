  - changeId: change.init-leaves-git-alone
    changeType: model-update
    targetRefs:
      - step.adopt-repository
      - step.report-what-is-yours-to-commit
      - step.undo-earlier-adoption
      - journey.adopt-a-repository
      - lifecycle.repository
    summary: >
      init runs the tracker in its stealth mode: bd commits nothing, writes
      nothing for agents, configures no remote, and keeps .beads/ local to the
      checkout. The report names dotdiw's declaration files as the worker's to
      commit; the undo step names the one command for repositories where an
      earlier version let bd commit, and says who did what it undid.
    reason: >
      bd's stealth mode commits nothing. 0.2.0 and 0.2.1 used the default
      init, declined the hooks, removed the sync remote afterwards and
      reported the files left modified; the report did not include the file
      the removal changed, and the notice described the removal as undoing an
      earlier version's work. The step's assertion that every edited file was
      listed did not hold.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.adopt-a-repository
      affectedSlos:
        - slo.adoption-leaves-nothing-outside
      affectedTraces:
        - trace.adoption-left-nothing-outside
        - antitrace.adoption-reached-outside
      affectedInvariants:
        - invariant.nothing-outside-the-repository
        - invariant.tool-never-commits
      riskLevel: medium
      riskExplanation: >
        New adoptions change shape; adoptions by 0.1.x and 0.2.x keep working
        and are told one command, which dotdiw never runs for them.
    migrationPlan: >
      For a repository adopted before 0.3.0: every run writes the stealth
      exclude lines into .git/info/exclude; init, check, doctor and lint print
      "git rm -r --cached .beads && git commit" until it is done; clones that
      pull that commit run dotdiw init once. Nothing is deleted and nothing is
      done on the worker's behalf.
    approvalStatus: draft
    createdAt: "2026-11-01T18:30:00+08:00"
  - changeId: change.tracker-state-leaves-the-repository
    changeType: model-update
    targetRefs:
      - object.repository
      - step.adopt-repository
      - step.undo-earlier-adoption
      - journey.adopt-a-repository
      - invariant.nothing-outside-the-repository
      - lifecycle.repository
    summary: >
      The tracker's state leaves the repository: it lives under the user's
      home in ~/.dotdiw/<key>, keyed to the checkout by one line in its
      .git/config, told to bd through BEADS_DIR, with stealth, hooks and agent
      files declined. The repository holds only the formulas and the
      declaration. A repository adopted earlier is adopted under the home by
      its first command, keeping its prefix; its tasks are not carried over.
    reason: >
      Every version before 0.4.0 kept bd's state in the working tree, where it
      needed an exclude, a check for leftovers and an explanation in every
      notice, and where a clone could never use it anyway. Under the home it
      is keyed to the checkout, survives a move, is shared by worktrees, and
      is nobody else's.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.adopt-a-repository
      affectedSlos:
        - slo.adoption-leaves-nothing-outside
      affectedTraces:
        - trace.adoption-left-nothing-outside
        - trace.upgrade-was-one-command
        - antitrace.adoption-reached-outside
      affectedInvariants:
        - invariant.nothing-outside-the-repository
      riskLevel: medium
      riskExplanation: >
        New adoptions change shape; adoptions by earlier versions are upgraded
        by their first command and lose their task history, which clients are
        told before they upgrade.
    migrationPlan: >
      Clients close their tasks before upgrading and are told the history is
      not carried over. After brew upgrade, the first dotdiw command in a
      repository adopted earlier writes the key, makes the tracker under the
      home with the old prefix, says so once, and names the one command that
      removes the in-tree copy -- git rm -r -q .beads && git commit && rm -rf
      .beads .beads.gate.lock where it was committed, rm -rf .beads
      .beads.gate.lock where it was not. dotdiw runs neither. A fresh clone
      runs dotdiw init once.
    approvalStatus: draft
    createdAt: "2026-11-01T21:00:00+08:00"

  - changeId: change.the-tracker-is-not-named
    changeType: model-update
    targetRefs:
      - invariant.one-name-for-all-four
      - step.forward-to-the-tracker
      - step.declare-conventions
      - step.turn-metrics-off
      - step.undo-earlier-adoption
    summary: >
      Nothing dotdiw says names bd or beads: the install line when the
      tracker is missing is Day 0's command, the metrics notice names the
      tracker and its file, --version reports the tracker's version as a
      number, the rename lines say how many files now name dotdiw, and the
      formula problem line says the tracker finds it. The name appears only
      inside the names of bd's own things on the machine. A test holds every
      string literal in the program to that.
    reason: >
      A worker needs a command when something is missing, a path when a file
      of theirs was changed, and a number for a bug report; none of those
      needs the word. The --version line named bd and so breached this
      invariant as written, and nothing checked it.
    compatibility: additive
    impactAssessment:
      affectedDuties:
        - duty.put-all-four-under-one-name
      affectedJourneys:
        - journey.run-a-tracker-command
        - journey.adopt-a-repository
      affectedSlos: []
      affectedTraces:
        - antitrace.tracker-named-itself
      affectedInvariants:
        - invariant.one-name-for-all-four
      riskLevel: low
      riskExplanation: Messages change their words; what the program does, writes and runs is unchanged.
    migrationPlan: null
    approvalStatus: draft
    createdAt: "2026-11-01T22:30:00+08:00"
  - changeId: change.the-tracker-behind-a-door-of-its-own
    changeType: model-update
    targetRefs:
      - object.tracker
      - object.tracker-adapter
      - interaction.answer-through-adapter
      - interaction.choose-tracker
      - interaction.move-workspace
      - boundary.dotdiw-to-tracker
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
      - journey.answer-through-the-tracker
      - journey.choose-a-tracker
      - journey.move-a-workspace
      - journey.run-a-tracker-command
      - journey.adopt-a-repository
    summary: >
      The tracker is an interface of ten operations behind a door of its own,
      answered by an adapter chosen per request, else per checkout, else the
      store dotdiw brings. Two adapters ship: local, one sqlite file under the
      workspace's keyed directory and the default for a new adoption, and
      beads, the tracker of every version before 0.6.0, with everything that
      contained it moved inside and its bytes kept. A third, for a hosted
      tracker, is loaded by name from the home and proved against a stub.
      Choosing and moving are journeys of their own; a name appears only where
      it was chosen. Nothing a worker who chose nothing sees changes.
    reason: >
      Eight steps crossed to one tracker by name, through two runners and a
      stream rewrite that no record set apart from dotdiw's own work. Behind
      one door the interface is the record, every adapter is held to the same
      types and the same scenario, and the tracker can be chosen, or none.
    compatibility: strengthening
    impactAssessment:
      affectedDuties:
        - duty.put-all-four-under-one-name
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.answer-through-the-tracker
        - journey.choose-a-tracker
        - journey.move-a-workspace
        - journey.run-a-tracker-command
        - journey.adopt-a-repository
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.one-tracker-door
        - invariant.one-name-for-all-four
        - invariant.nothing-outside-the-repository
      riskLevel: medium
      riskExplanation: >
        A new adoption's work goes into the store dotdiw brings rather than the
        tracker of every version before; a checkout adopted earlier is kept on
        that tracker, so what it prints and holds is unchanged.
    migrationPlan: >
      A checkout adopted by 0.4.0 or 0.5.0 holds one adapter's store and no
      choice; its first 0.6.0 command writes dotdiw.tracker for it and says so
      once. dotdiw tracker migrate <from> <to> moves a workspace between
      adapters, parents before children, ids kept where the target accepts
      them and mapped in a record under the workspace where it does not; the
      source is never written, a second run moves nothing, and a run a target
      refused part of is finished by the next.
    approvalStatus: draft
    createdAt: "2026-11-03T18:00:00+08:00"
  - changeId: change.a-tracker-ships-by-convention
    changeType: model-update
    targetRefs:
      - object.tracker-adapter
      - interaction.ship-tracker
      - invariant.one-tracker-door
      - journey.choose-a-tracker
      - journey.ship-a-tracker
    summary: >
      A tracker package is named dotdiw-tracker-<name>, installs its file under
      share/dotdiw/trackers, passes dotdiw tracker check and states the interface
      it was written for. A module is looked for in the home directory and then in
      share/dotdiw/trackers beside the tool; dotdiw tracker check takes a file
      by path; dotdiw tracker new writes the file to start from, generated from
      the interface. The tap's formula no longer installs beads: a checkout that
      chose it is told brew install beads when the binary is missing.
    reason: >
      A tracker could only be copied by hand into the home directory, which a
      package manager cannot write to. Nothing said which interface a module
      was written for, and starting one meant copying an adapter that talks to
      a network.
    compatibility: strengthening
    impactAssessment:
      affectedDuties:
        - duty.put-all-four-under-one-name
      affectedJourneys:
        - journey.choose-a-tracker
        - journey.ship-a-tracker
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.one-tracker-door
      riskLevel: low
      riskExplanation: >
        Nothing changes for a worker on the store dotdiw brings. A module written
        for 0.6.0 declares no interface and is read as interface 1.
    migrationPlan: >
      A module under the home directory goes on loading from there, and wins
      over one a package installed under the same name. A checkout on beads goes
      on working while the binary is on the machine. An upgrade leaves the binary
      in place until Homebrew's periodic cleanup, which can remove it as unused;
      brew install beads keeps it.
    approvalStatus: draft
    createdAt: "2026-11-05T12:00:00+08:00"
  - changeId: change.pour-is-a-formula-command
    changeType: model-update
    targetRefs:
      - objective.one-name-for-all-four
      - journey.find-a-held-procedure
      - step.pour-procedure
      - step.pour-steps
      - step.forward-to-the-tracker
      - step.resolve-formula
      - antitrace.procedure-poured-unnamed
      - antitrace.poured-what-never-surfaced
    summary: >
      From 0.8.0, dotdiw formula pour <id> creates a formula's steps as
      tracked items, and dotdiw's own messages tell people to use it. The old
      command, dotdiw mol pour <id>, still works and prints the same. The
      instructions dotdiw writes into CLAUDE.md and AGENTS.md still say mol
      pour. The objective now lists declaration before management, and it and
      the opening of learn say only that no task needs the tracker's own name.
    reason: >
      mol pour is a name from beads. The other formula commands are formula
      new, formula list and formula show, so pouring now sits with them. The
      objective used to say that no task needs anything else typed, but
      formula new tells the worker to commit with git.
    compatibility: additive
    impactAssessment:
      affectedDuties:
        - duty.surface-procedures-when-work-starts
        - duty.keep-procedures-findable
        - duty.put-all-four-under-one-name
        - duty.teach-without-a-project
      affectedJourneys:
        - journey.start-named-work
        - journey.find-a-held-procedure
        - journey.run-a-tracker-command
        - journey.learn-the-conventions
      affectedSlos: []
      affectedTraces:
        - antitrace.procedure-poured-unnamed
        - antitrace.poured-what-never-surfaced
      affectedInvariants:
        - invariant.one-name-for-all-four
      riskLevel: low
      riskExplanation: >
        Three hints and the opening of learn change their wording. mol pour
        does exactly what it did, so scripts and habits that use it keep
        working.
    migrationPlan: >
      None. Both commands work. The instructions in CLAUDE.md and AGENTS.md
      keep saying mol pour, because dotdiw rewrites that text in every
      repository that uses it on the next create, and teammates on different
      versions would keep overwriting each other's copy.
    approvalStatus: draft
    createdAt: "2026-11-06T08:12:00+08:00"
  - changeId: change.a-tracker-says-who-it-acts-as
    changeType: model-update
    targetRefs:
      - object.tracker-adapter
      - object.tracker
      - step.describe-tracker
      - step.adopt-repository
      - step.use-tracker
      - step.update-item
      - step.migrate-workspace
      - invariant.one-tracker-door
    summary: >
      From 0.8.0, dotdiw says which account a tracker writes work under, when
      the tracker can confirm it. Jira confirms it from the API token, so init
      names that account once and tracker use names it every time. Beads
      takes its name from git or the environment, which anyone can set, so
      dotdiw does not show it. Items now record who they are assigned to.
      show prints it under local and Jira, and in Jira and beads,
      update -a me assigns an item to the account the work is written under.
      Any other assignee is the tracker's own id for a person; dotdiw never
      searches for a person by name. tracker migrate does not carry
      assignments over to the new tracker, and says how many items had one.
    reason: >
      Jira and beads write work under someone's name, and dotdiw never said
      whose. The worst mistake is writing work under the wrong person's name
      without anyone noticing, and finding a person by searching for a name
      can pick the wrong one.
    compatibility: additive
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
        - duty.put-all-four-under-one-name
      affectedJourneys:
        - journey.adopt-a-repository
        - journey.choose-a-tracker
        - journey.answer-through-the-tracker
        - journey.move-a-workspace
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.one-tracker-door
      riskLevel: low
      riskExplanation: >
        Every new field is optional, so the tracker interface keeps number 1
        and an adapter written for it still passes tracker check, ten of ten.
        New lines appear only when there is something to say: show for an item
        with an assignee under local and Jira, init and tracker use when the
        tracker confirms the account, and tracker migrate when assignments were
        left behind. Under beads, this change adds nothing to what the byte
        test's commands print.
    migrationPlan: >
      None. An adapter that does not say which account it uses works as
      before. Assignments do not carry over from one tracker to another, and
      tracker migrate says how many items had one.
    approvalStatus: draft
    createdAt: "2026-11-06T08:12:00+08:00"
  - changeId: change.kind-is-root-or-task
    changeType: model-update
    targetRefs:
