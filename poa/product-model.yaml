      - journey.choose-a-tracker
      - journey.move-a-workspace
      - journey.run-a-tracker-command
      - journey.adopt-a-repository
    summary: >
      The tracker is an interface of ten operations behind a door of its own,
      answered by an adapter chosen per request, else per checkout, else the
      store dotdiw brings. Two adapters ship: local, one sqlite file under the
