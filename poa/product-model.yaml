      - lifecycle.molecule
      - step.pour-steps
      - step.create-item
      - step.notice-handmade-procedures
      - step.check-tracker
      - step.migrate-workspace
      - invariant.one-tracker-door
    summary: >
      From 1.0.0, an item's kind is root or task. The root a pour makes is
      root, and every other item is task, whatever the tracker calls it.
      create-item takes no kind, and the notice about procedures built by hand
      reads a parent of kind task. The tracker interface is number 2, and an
      adapter written for 1 is refused in one line that names it. A local
      store made before 1.0.0 reads its roots, recorded as molecule, as root.
    reason: >
      dotdiw reads the kind for one thing, telling a poured root from a parent
      someone built by hand. While the kind was open, a root could be a
      molecule or an epic, and an epic someone built by hand could not be told
      from one.
    compatibility: breaking
    impactAssessment:
      affectedDuties:
        - duty.keep-procedures-findable
        - duty.put-all-four-under-one-name
      affectedJourneys:
        - journey.write-a-procedure-down
        - journey.answer-through-the-tracker
        - journey.choose-a-tracker
        - journey.move-a-workspace
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.one-tracker-door
      riskLevel: medium
      riskExplanation: >
        Every adapter written for interface 1 is refused until its author ships
        one written for 2; the adapters dotdiw ships move with it. A root that
        tracker migrate moves arrives as a task until
        question.how-migrate-copies-a-root is settled.
    migrationPlan: >
      An adapter's author declares interface 2, reads the root a pour made
      back as root and every other item as task, and takes no kind on
      create-item. A local store's roots, recorded as molecule before 1.0.0,
      read as root.
    approvalStatus: draft
    createdAt: "2026-11-06T19:40:00+08:00"
  - changeId: change.a-formula-names-the-means-to-prove-its-run
    changeType: model-update
    targetRefs:
      - term.formula
      - term.verify-using
      - invariant.the-prover-uses-the-means
      - invariant.only-committed-formulas-are-held
      - step.index-the-project
      - step.describe-and-check
      - step.list-formulas
      - step.pour-procedure
      - step.pour-steps
      - step.show-item
      - step.create-item
      - step.migrate-workspace
      - step.check-tracker
      - step.teach-the-conventions
      - antitrace.proved-by-what-is-gone
      - trace.pour-named-the-means-to-prove-its-run
    summary: >
      From 1.0.0, a formula can name the means to prove that its run did what
      it claims, in a list called verify-using. Each value is one line: a
      command after run:, a file in a repository as a git+https:// or
      git+ssh:// URL with the file's path after #, or a link. A pour hands the
      list to the tracker with the root, which keeps it and returns it exactly
      as given, and shows it after the pour; tracker migrate carries it with
      the item, as create-item takes it. check names a value it cannot
      read, a value longer than one line, and a file of this repository that
      git does not track. The list adds nothing to what a title reaches.
    reason: >
      A formula said what to do and how its steps follow each other. Steps
      closed in order show that the order was kept; the means to prove show
      that the run did what the formula claims.
    compatibility: additive
    impactAssessment:
      affectedDuties:
        - duty.surface-procedures-when-work-starts
        - duty.keep-procedures-findable
        - duty.teach-without-a-project
      affectedJourneys:
        - journey.start-named-work
        - journey.write-a-procedure-down
        - journey.find-a-held-procedure
        - journey.learn-the-conventions
        - journey.answer-through-the-tracker
        - journey.move-a-workspace
      affectedSlos: []
      affectedTraces:
        - antitrace.proved-by-what-is-gone
        - trace.pour-named-the-means-to-prove-its-run
      affectedInvariants:
        - invariant.the-prover-uses-the-means
        - invariant.only-committed-formulas-are-held
        - invariant.one-tracker-door
      riskLevel: low
      riskExplanation: >
        A formula without verify-using is read, matched, poured and shown as
        before. The root's description and verify-using ride on the move to
        tracker interface 2 that the kind of an item makes.
    migrationPlan: null
    approvalStatus: draft
    createdAt: "2026-11-06T19:40:00+08:00"

openQuestions:
  - questionId: question.hundreds-of-formulas
    question: >
      The threshold of 0.15 was calibrated on three to fifty-six formulas.
      What do retrieval and silence look like at the hundreds this is for?
    blocksChange: false
    neededFrom: measurement
    targetRefs:
      - step.match-formulas
      - slo.applicable-formula-surfaces
    decisionNeeded:
      - clarify-timing
      - other
    candidateResolutions:
      - Keep 0.15 and the bm25 ordering until a project with hundreds of committed formulas is measured; the witness log now records every match and every silence, so the measurement can come from use rather than from a built fixture.
      - Raise the floor at scale if coincidences cost more than a glance there.
      - Rank against competitors rather than a constant, which outlier.py showed does not recover silence at the sizes measured.
    recommendedDefault: >
      Kept open on 2026-11-01, consciously: the first candidate, until a
      project of that size is witnessed. Not blocking.
  - questionId: question.enforcing-the-declared-moment
    question: >
      Should a project be able to tell, per piece of work, that it began
      unnamed, or does that cross from showing into enforcing?
    blocksChange: false
    neededFrom: product-owner
    targetRefs:
      - duty.surface-procedures-when-work-starts
      - invariant.work-starts-named
    decisionNeeded:
      - clarify-product-boundary
    candidateResolutions:
      - dotdiw keeps showing and never enforces; a story the contract calls incomplete because a pour had no naming is the project's to read, in its own witness log, and nothing more.
      - A project may opt in to a notice on pour when no create preceded it in the log, which is still showing.
      - A project may refuse the pour, which is enforcing and is boundary.only-the-declared-moment crossed.
    recommendedDefault: >
      Kept open on 2026-11-01, consciously: the first candidate stands until
      the product owner decides otherwise; the second is the furthest this
      product's boundaries allow. Not blocking.
  - questionId: question.how-migrate-copies-a-root
    question: >
      create-item takes no kind, so tracker migrate moves a root as a task, and
      the notice about procedures built by hand can then name it. How does
      migrate bring a root across as a root?
    blocksChange: false
    neededFrom: product-owner
    targetRefs:
      - step.migrate-workspace
      - step.create-item
    decisionNeeded:
      - other
    candidateResolutions:
      - Migrate pours the root and its steps again through pour-steps, then sets their statuses, reasons and needs.
      - The interface gains an operation that copies a root.
    recommendedDefault: >
      Kept open on 2026-11-06 on the maintainer's word: a root moves as a task,
      its description and verify-using with it, until this is decided. Not
      blocking.
