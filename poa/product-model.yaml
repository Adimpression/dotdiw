  - dutyId: duty.put-all-four-under-one-name
    title: Put all four under one name
    intent: >
      Let everything the tracker does be reached under dotdiw's name, so no
      task ever requires typing the tracker's own name, and so the tracker's
      own commands carry what the project asks for where people actually run
      them.
    scope: >
      Covers answering the tracker's commands through the adapter the checkout
      chose, forwarding every command dotdiw does not own to beads unchanged
      where that is the adapter, with its name rewritten in what comes back,
      resolving a formula id to its file for cook, and letting doctor, lint
      and remember carry the conventions check, the handmade notice and the
      nudge towards a formula.
    nonGoals:
      - Changing what any tracker command does.
