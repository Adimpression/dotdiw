      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: >-
          Observes and prints; changes nothing in the project or the tracker.
      derivedFrom:
        - sourceKind: manual-decision
          sourceRef: step.match-formulas
          reason: >-
            The step id does not start with a query verb, so derive called
            this a command. It ranks and prints; it changes nothing.
      calls:
        - operationId: operation.index-the-project
          callPurpose: >-
            Rank the title against the project's formulas with the project's
            own text as background; the index is built here when the
            orchestration did not pass one in.
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: title
          valueType:
            kind: scalar
            scalar: string
          required: true
        - name: description
          valueType:
            kind: scalar
            scalar: string
          required: false
