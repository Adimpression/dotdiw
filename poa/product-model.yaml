  - stepId: step.register-provider
    journeyId: journey.answer-through-a-formula-provider
    sequence: 1
    title: Register a formula management provider
    given: A package that provides a formula management provider is installed, so the provider is eligible.
    when: Someone registers it under an alphanumeric name.
    then: The provider is registered under that name, and every formula of it carries the name as a suffix, after a hyphen.
    thenAssertions:
      - The name is alphanumeric.
      - A name already registered, in any case, is refused, so that a suffix names one provider wherever case does not count.
      - The location recorded is the one describe answers, a directory by its absolute path, so that it names one store from every directory dotdiw runs in.
      - The registry is read, changed and written under its lock, so that two registrations never lose one another.
      - Every provider list this run read is forgotten, so that a name registered again is listed from where it points now; the next operation reads the formulas afresh, so the next question reaches the provider.
      - A local formula whose id reads like one of the provider's suffixed ids migrates.
      - For now, the registered provider serves every checkout.
    relatedObjectIds:
      - object.formula-management-provider
      - object.formula
    relatedInteractionIds:
      - interaction.answer-through-formula-provider
    relatedInvariantIds:
      - invariant.every-provider-formula-carries-its-suffix
    expectedUserVisibleOutcome: The provider's name, which its formulas carry as a suffix.
    status: active
    stateTransitions:
      - objectId: object.formula-management-provider
        fromState: eligible
        toState: registered
    operation:
      calls:
        - operationId: operation.describe-provider
          callPurpose: >-
            Learn what the module answers before it is registered, and refuse
            one that lacks list or show.
          required: true
          failurePropagation: propagate
        - operationId: operation.index-the-project
          callPurpose: >-
            Find the checkout's local formulas, to refuse a registration while
            one reads like the provider's suffixed id.
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The checkout, where a local formula that clashes is found."
        - name: name
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The name to register under, letters and digits."
        - name: module
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The provider module a package installed, by its name."
        - name: location
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "Where the provider keeps its formulas: a directory or a URL."
      responseFields:
        - name: provider
          valueType:
            kind: type-ref
            typeId: type.formula-provider
          required: false
          summary: "The provider as registered."
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - name-not-alphanumeric
              - name-taken
              - module-not-found
              - not-a-provider
              - lacks-list-or-show
              - clashing-local-formula
              - provider-failed
          required: false
          summary: "Why nothing was registered."
        - name: clashing
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            Local formulas whose ids read like the provider's suffixed ids.
          cardinality: many
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: "The process exit code the command line ends with."
  - stepId: step.describe-provider
    journeyId: journey.answer-through-a-formula-provider
    sequence: 2
    title: Describe a formula management provider
    given: A registered provider.
    when: A body of dotdiw asks what it answers.
    then: The provider declares which of list, show and create it answers.
    thenAssertions:
      - Every provider declares list and show, which initial versions require of it.
      - A provider that offers discovery only declares list and show, and not create.
      - A provider may answer its location as it means it, and that is the location registered; the directory provider answers its directory's absolute path, and refuses a directory that is not there.
    relatedObjectIds:
      - object.formula-management-provider
      - object.formula
    relatedInteractionIds:
      - interaction.answer-through-formula-provider
    relatedInvariantIds:
      - invariant.every-provider-formula-carries-its-suffix
    expectedUserVisibleOutcome: Nothing; the declaration is what the other steps answer from.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: "Queries do not change product state."
      requestFields:
        - name: name
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "A registered provider's name."
        - name: module
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "A provider module, described before it is registered."
        - name: location
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The location the module is given."
      responseFields:
        - name: answers
          valueType:
            kind: list
            itemType:
              kind: enum-inline
              values:
                - list
                - show
                - create
          required: false
          summary: "Which of list, show and create the provider answers."
          cardinality: many
        - name: provider
          valueType:
            kind: type-ref
            typeId: type.formula-provider
          required: false
          summary: "The provider described."
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - provider-unknown
              - module-not-found
              - not-a-provider
              - provider-failed
          required: false
          summary: "Why the provider could not be described."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: "The process exit code the command line ends with."
  - stepId: step.list-provider-formulas
    journeyId: journey.answer-through-a-formula-provider
    sequence: 3
    title: List a provider's formulas
    given: A registered provider that answers list.
    when: A body of dotdiw asks for its formulas, to match a title or to list what is held.
    then: Its formulas come back, each under its suffixed id.
    thenAssertions:
      - Every formula carries the provider's name as a suffix.
      - The whole answer is held to its shape before any of it is taken -- every id letters, digits, dots, hyphens and underscores, starting with a letter or a digit, and listed once; every description text; every list of examples text. A provider that answers outside it is left out of the run in one line, with every one of its formulas.
      - A store that is not there is a failure, said in that line, and never an empty list.
      - Nothing about the provider reaches a pour or a tracker.
    relatedObjectIds:
      - object.formula-management-provider
      - object.formula
    relatedInteractionIds:
      - interaction.answer-through-formula-provider
    relatedInvariantIds:
      - invariant.every-provider-formula-carries-its-suffix
      - invariant.formula-storage-apart-from-task-storage
    expectedUserVisibleOutcome: The provider's formulas among the others, each under its suffixed id.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: "Queries do not change product state."
      requestFields:
        - name: name
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "A registered provider's name."
      responseFields:
        - name: formulas
          valueType:
            kind: list
            itemType:
              kind: type-ref
              typeId: type.held-formula
          required: false
          summary: >-
            Every formula the provider holds, each under its suffixed id.
          cardinality: many
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - provider-unknown
              - provider-failed
          required: false
          summary: "Why the provider's formulas could not be listed."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: "The process exit code the command line ends with."
  - stepId: step.show-provider-formula
    journeyId: journey.answer-through-a-formula-provider
    sequence: 4
    title: Show a provider's formula
    given: A registered provider that answers show, and one of its suffixed ids.
    when: A body of dotdiw asks for that formula, to show it or to pour it.
    then: The formula comes back as data -- its description, its means to prove and its steps -- held to their shape.
    thenAssertions:
      - A pour of it carries nothing about the provider.
      - Its answer is held to its shape before anything is taken from it -- a description that is text, steps that are a list, each with an id and a title once and needs that are step ids, and means to prove each one line in a form check reads -- and a formula outside it is refused in one line naming the provider. Only the means to prove and a step's needs may be left out, and nothing given is replaced by a default.
      - Nothing is written for it; a pour hands the tracker the steps it answered, and formula show prints it in the form a .formula.json file takes.
      - It is asked when a formula is shown or poured, and never while the project is indexed.
    relatedObjectIds:
      - object.formula-management-provider
      - object.formula
    relatedInteractionIds:
      - interaction.answer-through-formula-provider
    relatedInvariantIds:
      - invariant.every-provider-formula-carries-its-suffix
      - invariant.formula-storage-apart-from-task-storage
    expectedUserVisibleOutcome: The formula as the provider keeps it.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: "Queries do not change product state."
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The checkout the formula is shown for; nothing is written for it.
        - name: name
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "A registered provider's name."
        - name: ident
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The formula's id as the provider gives it, without the suffix.
      responseFields:
        - name: formulaRef
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The formula's suffixed id."
        - name: formula
          valueType:
            kind: type-ref
            typeId: type.formula-body
          required: false
          summary: >-
            The formula, as data, held to its shape.
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - provider-unknown
              - formula-not-found
              - provider-failed
          required: false
          summary: "Why the formula could not be shown."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: "The process exit code the command line ends with."
  - stepId: step.create-provider-formula
    journeyId: journey.answer-through-a-formula-provider
    sequence: 5
    title: Create a formula through a provider
    given: A registered provider that answers create.
    when: Someone writes a formula down into it.
    then: The provider creates the formula, in typical API style, and it is found under its suffixed id from then on.
    thenAssertions:
      - Committing is the concern of a git formula management provider; local storage keeps no commits and no history.
      - A provider that offers discovery only is never asked to create.
    relatedObjectIds:
      - object.formula-management-provider
      - object.formula
    relatedInteractionIds:
      - interaction.answer-through-formula-provider
    relatedInvariantIds:
      - invariant.every-provider-formula-carries-its-suffix
    expectedUserVisibleOutcome: The new formula's suffixed id.
    status: draft
  - stepId: step.remove-provider
    journeyId: journey.answer-through-a-formula-provider
    sequence: 6
    title: Remove a formula management provider
    given: A registered provider.
    when: Someone removes it by its name.
    then: >
      The registration is gone, and the provider's formulas no longer surface;
      its package stays installed, so the provider is eligible again.
    thenAssertions:
      - Nothing but the registry changes -- under its lock the registration goes, and the name is kept as removed, so that an id with its suffix is refused rather than handed to the tracker.
      - The next operation reads the formulas afresh, so the provider's formulas are gone from the next answer.
    relatedObjectIds:
      - object.formula-management-provider
    relatedInteractionIds:
      - interaction.answer-through-formula-provider
    relatedInvariantIds:
      - invariant.every-provider-formula-carries-its-suffix
    expectedUserVisibleOutcome: The provider is no longer listed, and its formulas are no longer found.
    status: active
    stateTransitions:
      - objectId: object.formula-management-provider
        fromState: registered
        toState: eligible
    operation:
      requestFields:
        - name: name
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "A registered provider's name."
      responseFields:
        - name: provider
          valueType:
            kind: type-ref
            typeId: type.formula-provider
          required: false
          summary: "The provider removed."
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - provider-unknown
          required: false
          summary: "Why nothing was removed."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: "The process exit code the command line ends with."
experience:
  slis:
    - sliId: sli.applicable-formula-surfaces
      name: Applicable formula surfaces
      description: >
        Of titles that an existing formula applies to, the share for which
        that formula was printed by create.
      measurementType: success-rate
      unit: percent
      eventSource: measurements/results invocation logs against the fixture ground truth
      appliesToDutyIds:
        - duty.surface-procedures-when-work-starts
      appliesToJourneyIds:
        - journey.start-named-work
      status: active
    - sliId: sli.create-feedback-latency
      name: Create feedback latency
      description: >
        Time from invoking dotdiw create to the applying formulas being
        printed. Measured from the witness log: work_named carries startedAt,
        the process's first instruction after start-up, and the
        formula_surfaced or nothing_surfaced event of the same case carries
        occurredAt, written as the match was printed. First measured
        2026-11-01, ten creates in a throwaway repository on the maintainer's
        machine: median 464 ms, 437 to 478.
      measurementType: latency
      unit: milliseconds
      eventSource: the witness log, read by measurements/harness/witness.py --log
      appliesToDutyIds:
        - duty.surface-procedures-when-work-starts
      appliesToJourneyIds:
        - journey.start-named-work
      status: active
    - sliId: sli.formula-finds-itself
      name: Formula finds itself
      description: The share of the formulas in a checkout found from every one of their own examples.
      measurementType: success-rate
      unit: percent
      eventSource: dotdiw check
      appliesToDutyIds:
        - duty.keep-procedures-findable
      appliesToJourneyIds:
        - journey.write-a-procedure-down
      status: active
    - sliId: sli.adoption-leaves-nothing-outside
      name: Adoption leaves nothing outside
      description: >
        The share of adoptions after which core.hooksPath is unset, the
        tracker under the home has no remote, nothing of the tracker's is in
        the tree, and the only changes outside the repository are the tracker
        under ~/.dotdiw and the announced metrics setting.
      measurementType: correctness
      unit: percent
      eventSource: test_dotdiw.py
      appliesToDutyIds:
        - duty.adopt-without-reaching-outside
      appliesToJourneyIds:
        - journey.adopt-a-repository
      status: active
  slos:
    - sloId: slo.applicable-formula-surfaces
      sliId: sli.applicable-formula-surfaces
      name: Applicable formulas surface
      targetOperator: ">="
      targetValue: 90
      measurementWindow: per fixture round
      consequenceOfViolation: >
        Discovery stops being something a project can rely on; procedures
        become runbooks again.
      severity: critical
      status: active
    - sloId: slo.create-feedback-under-one-second
      sliId: sli.create-feedback-latency
      name: Create feedback under one second
      targetOperator: "<="
      targetValue: 1000
      measurementWindow: per create invocation
      consequenceOfViolation: The match arrives after the work began.
      severity: high
      status: active
    - sloId: slo.every-formula-finds-itself
      sliId: sli.formula-finds-itself
      name: Every formula finds itself
      targetOperator: "="
      targetValue: 100
      measurementWindow: per dotdiw check
      consequenceOfViolation: The project holds a procedure nobody can reach.
      severity: critical
      status: active
    - sloId: slo.adoption-leaves-nothing-outside
      sliId: sli.adoption-leaves-nothing-outside
      name: Adoption leaves nothing outside
      targetOperator: "="
      targetValue: 100
      measurementWindow: per test run
      consequenceOfViolation: >
        A repository is changed in ways its owners were not told about, as
        happened under v0.1.0.
      severity: critical
      status: active

traces:
  golden:
    - traceId: trace.release-found-its-procedure
      traceType: golden
      title: A release found its procedure
      description: >
        Work named "Release v0.2.1 through the tap" surfaced the
        release-through-tap formula, which was poured and followed.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: A new version of dotdiw is tagged and needs to reach brew.
      trigger: dotdiw create is run in the tap repository with that title.
      events:
        - sequence: 1
          title: Named
          event: dotdiw create "Release v0.2.1 through the tap" creates tap-r3e.
          stateBefore: The release is intended.
          stateAfter: The work is named.
          observedOutcome: The work item id is printed.
          elapsedTimeMs: 600
          relatedStepIds:
            - step.name-the-work
        - sequence: 2
          title: Surfaced
          event: The same invocation prints release-through-tap with its path and the pour command.
          observedOutcome: The procedure that applies is in front of the worker before any step is taken.
          elapsedTimeMs: 50
          relatedStepIds:
            - step.match-formulas
        - sequence: 3
          title: Poured
          event: dotdiw mol pour mol-release-through-tap creates tap-mol-gxc with nine steps.
          stateBefore: The work is named.
          stateAfter: The procedure is poured.
          observedOutcome: Nine tracked steps, closed in dependency order over the next twenty minutes.
          elapsedTimeMs: 1500
          relatedStepIds:
            - step.pour-procedure
      finalState: The release shipped by the procedure, one step skipped with a recorded reason.
      validatesStepIds:
        - step.name-the-work
        - step.match-formulas
        - step.pour-procedure
      classificationReason: The procedure surfaced at the declared moment and was followed as tracked steps.
      status: active
    - traceId: trace.recorded-run-found-its-procedure
      traceType: golden
      title: A recorded run found its procedure
      description: >
        2026-11-01, a throwaway repository holding one release formula, the
        witness log on: work named "Release v0.3.0 through the tap" surfaced
        release-through-tap, which was poured as three steps and closed in
        order, every event written by dotdiw itself. The log is
        events/recorded-run.jsonl, as written; the contract calls it valid.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: The witness log's first real story, recorded rather than reconstructed.
      trigger: DOTDIW_WITNESS=1 dotdiw create "Release v0.3.0 through the tap"
      events:
        - sequence: 1
          title: Named
          event: create makes w-hkx and writes work_named.
          stateBefore: Intended.
          stateAfter: Named.
          observedOutcome: One line in the log, from the body that named the work.
          elapsedTimeMs: 600
          relatedStepIds:
            - step.name-the-work
        - sequence: 2
          title: Surfaced
          event: The same invocation prints release-through-tap and writes formula_surfaced.
          observedOutcome: The surfacing and its evidence come from the same body.
          elapsedTimeMs: 25
          relatedStepIds:
            - step.match-formulas
        - sequence: 3
          title: Poured and closed
          event: mol pour makes w-mol-7qp with three steps and writes procedure_poured with their ids; each close through dotdiw writes step_closed, the last molecule_closed.
          stateBefore: Named.
          stateAfter: Done.
          observedOutcome: Seven events, one case, which poa match cesc calls valid.
          elapsedTimeMs: 5000
          relatedStepIds:
            - step.pour-procedure
      finalState: A story the contract accepts, from a run and not from a hand.
      validatesStepIds:
        - step.name-the-work
        - step.match-formulas
        - step.pour-procedure
      classificationReason: The first story witnessed rather than reconstructed, and the test suite records it again on every run.
      status: active
    - traceId: trace.formula-written-after-repeating
      traceType: golden
      title: A formula written after the same mistake twice
      description: >
        Two pushes happened without a procedure; the make-commit formula
        gained the steps that stop before a push, and was committed.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.write-a-procedure-down
      scenario: A procedure that existed only as something done by hand failed the same way twice.
      trigger: The author notices the repetition.
      events:
        - sequence: 1
          title: Written
          event: make-commit.formula.toml gains the asked, where, irreversible, push and landed steps.
          stateBefore: The procedure is repeated by hand.
          stateAfter: The procedure is written.
          observedOutcome: Steps and needs in TOML, next to the work they are about.
          relatedStepIds:
            - step.write-formula
        - sequence: 2
          title: Checked
          event: dotdiw check finds the formula from each of its examples.
          stateBefore: Written.
          stateAfter: Findable.
          observedOutcome: "5 formulas, all discoverable."
          relatedStepIds:
            - step.describe-and-check
        - sequence: 3
          title: Committed
          event: The formula is committed on its own.
          stateBefore: Findable.
          stateAfter: Held.
          observedOutcome: Every later commit's create surfaces it.
          relatedStepIds:
            - step.commit-formula
      finalState: The project holds a procedure for committing and pushing that it did not hold before.
      validatesStepIds:
        - step.write-formula
        - step.describe-and-check
        - step.commit-formula
      classificationReason: The repetition was written down as a formula, made findable, and committed.
      status: active
    - traceId: trace.adoption-left-nothing-outside
      traceType: golden
      title: Adoption left nothing outside the repository
      description: >
        init keys the checkout, puts the tracker under the home in stealth
        mode without hooks or agent files, names the declaration files as the
        worker's, and turns metrics off before the first bd command.
      dutyId: duty.adopt-without-reaching-outside
      journeyId: journey.adopt-a-repository
      scenario: A fresh repository with a hook of its own is adopted on an empty machine.
      trigger: dotdiw init --prefix t
      events:
        - sequence: 1
          title: Adopted
          event: The key is written into .git/config; bd init runs with --stealth --skip-hooks --skip-agents under ~/.dotdiw/<key>; the conventions are declared in files that did not exist.
          stateBefore: Unadopted.
          stateAfter: Adopted.
          observedOutcome: bd made no commit; nothing of bd's is in the tree; core.hooksPath is unset; the repository's own pre-commit hook still runs.
          relatedStepIds:
            - step.adopt-repository
        - sequence: 2
          title: Reported
          event: AGENTS.md and CLAUDE.md are listed as the worker's to commit, with the command; run, it leaves the tree clean.
          observedOutcome: No commit was made by dotdiw or by bd.
          relatedStepIds:
            - step.report-what-is-yours-to-commit
        - sequence: 3
          title: Metrics off
          event: bd's config says metrics are off before --version runs bd, and nothing is queued.
          observedOutcome: One notice, naming the file and the setting.
          relatedStepIds:
            - step.turn-metrics-off
      finalState: The repository holds the declaration and nothing else of this; the tracker is under the home.
      validatesStepIds:
        - step.adopt-repository
        - step.report-what-is-yours-to-commit
        - step.undo-earlier-adoption
        - step.turn-metrics-off
      classificationReason: Every assertion is a test in test_dotdiw.py that passes.
      status: active
    - traceId: trace.upgrade-was-one-command
      traceType: golden
      title: The upgrade was the first command
      description: >
        A repository adopted by 0.2.x, with bd's files committed and the
        prefix "old", after the upgrade to 0.4.0: dotdiw create adopts it
        under the home with the same prefix, says once that earlier tasks are
        not carried over and names the one command for the in-tree copy, and
        then creates the issue; the tree is untouched. Recorded as a test.
      dutyId: duty.adopt-without-reaching-outside
      journeyId: journey.adopt-a-repository
      scenario: A client's checkout, tasks closed, after brew upgrade.
      trigger: dotdiw create "After the upgrade"
      events:
        - sequence: 1
          title: Put right
          event: The key is written, the tracker is made under the home with prefix old, the notice is printed once with the removal command.
          stateBefore: Carrying an earlier adoption.
          stateAfter: Adopted.
          observedOutcome: The in-tree .beads is byte for byte as it was; nothing was deleted.
          relatedStepIds:
            - step.undo-earlier-adoption
        - sequence: 2
          title: Named
          event: The create runs against the new tracker and makes old-r5b.
          observedOutcome: The command typed just worked; the second create prints no notice.
          relatedStepIds:
            - step.name-the-work
      finalState: The repository works as before, minus its history, which it was told about.
      validatesStepIds:
        - step.undo-earlier-adoption
        - step.adopt-repository
      classificationReason: One command, nothing to run by hand, nothing unsaid.
      status: active
    - traceId: trace.handmade-procedure-noticed
      traceType: golden
      title: A procedure built by hand was noticed
      description: >
        In the measurement round that gave adopted projects uncovered work, two
        runs built a six-step dependency graph by hand in the tracker; the
        handmade notice named both as procedures never declared, with the
        --from line.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.write-a-procedure-down
      scenario: Work no formula covered, done as ordered tracker issues under one parent.
      trigger: dotdiw check in the project afterwards.
      events:
        - sequence: 1
          title: Noticed
          event: The parent with six ordered children is printed as carried out here and never declared, with dotdiw formula new "<its title>" --from <its id>.
          observedOutcome: The procedure that existed only in the tracker is one command from being a formula.
          relatedStepIds:
            - step.notice-handmade-procedures
      finalState: The repetition is visible before it happens a second time.
      validatesStepIds:
        - step.notice-handmade-procedures
      classificationReason: The DAG was there, the notice fired, and it named the exact command.
      status: active
    - traceId: trace.doctor-carried-the-check
      traceType: golden
      title: doctor carried the conventions check
      description: >
        Nobody in the trial ran check or learn; they ran doctor and lint. Since
        0.1.x those two print the project's convention problems under the
        tracker's own report.
      dutyId: duty.put-all-four-under-one-name
      journeyId: journey.run-a-tracker-command
      scenario: An agent checks the project's health the way it knows how.
      trigger: dotdiw doctor
      events:
        - sequence: 1
          title: Forwarded
          event: beads runs doctor and its report comes back with bd renamed.
          observedOutcome: The tracker's report, under dotdiw's name.
          relatedStepIds:
            - step.forward-to-the-tracker
        - sequence: 2
          title: Checked
          event: The convention problems and the handmade notice follow the report.
          observedOutcome: The uncommitted formula is named where the agent was already looking.
          relatedStepIds:
            - step.describe-and-check
            - step.notice-handmade-procedures
      finalState: The conventions were checked without anyone running check.
      validatesStepIds:
        - step.forward-to-the-tracker
        - step.describe-and-check
      classificationReason: The check reached the place people look instead of waiting to be asked.
      status: active
    - traceId: trace.formula-list-answered-about-the-project
      traceType: golden
      title: formula list answered about the project
      description: >
        In this repository, dotdiw formula list names six formulas with the
        paths they live at -- the root, measurements/ -- where bd's own
        formula list says No formulas found.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.find-a-held-procedure
      scenario: Someone asks what procedures the project holds.
      trigger: dotdiw formula list
      events:
        - sequence: 1
          title: Listed
          event: Six formulas, each with its description and repository-relative path, and the pour command.
          observedOutcome: The formulas are where they belong and are found there.
          relatedStepIds:
            - step.index-the-project
            - step.list-formulas
      finalState: Nothing was moved to make it findable.
      validatesStepIds:
        - step.index-the-project
        - step.list-formulas
      classificationReason: The question was about the project and the answer was about the project.
      status: active
    - traceId: trace.day-one-read-learn
      traceType: golden
      title: Day 1 began with learn
      description: >
        DAY_1.md: someone arriving in a project types dotdiw, is taught the
        four things and the two conventions, and from then on starts work with
        create.
      dutyId: duty.teach-without-a-project
      journeyId: journey.learn-the-conventions
      scenario: A first day in an adopted project.
      trigger: dotdiw, with no arguments.
      events:
        - sequence: 1
          title: Taught
          event: The teaching text is printed.
          observedOutcome: The reader knows where work starts and what a formula is before touching anything.
          relatedStepIds:
            - step.teach-the-conventions
      finalState: The next thing typed is dotdiw create.
      validatesStepIds:
        - step.teach-the-conventions
      classificationReason: Nothing had to be installed or found; the text was the first thing.
      status: active
    - traceId: trace.pour-named-the-means-to-prove-its-run
      traceType: golden
      title: A pour named the means to prove its run
      description: >
        2026-11-06, this repository on the 1.0.0 tree with beads underneath:
        check-promise-artifacts, naming three means under verify-using, was
        poured as trials-mol-yo5u with fourteen steps. bd's own output came
        first and the means followed it, one to a line, and the root came back
        through the door of kind root, with the formula's description and the
        three means exactly as given, every step of kind task. The steps were
        followed and closed, and the three means were run and passed before
        the root closed.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: The procedure that checks the promise's own artifacts names how its run is proved.
      trigger: dotdiw formula pour mol-check-promise-artifacts
      events:
        - sequence: 1
          title: Poured
          event: The pour makes trials-mol-yo5u with fourteen steps and keeps the three means as the last section of the root's description.
          stateBefore: The procedure surfaced.
          stateAfter: The procedure is poured, its root carrying the means to prove its run.
          observedOutcome: bd prints its pour, then dotdiw prints Verify using and the three means, one to a line.
          elapsedTimeMs: 6975
          relatedStepIds:
            - step.pour-procedure
        - sequence: 2
          title: Read back
          event: show-item returns the root of kind root with the formula's description and its three means exactly as given, and fourteen children of kind task.
          observedOutcome: The means outlive the pour, kept the way beads keeps them.
          relatedStepIds:
            - step.pour-procedure
        - sequence: 3
          title: Proved
          event: The fourteen steps are followed and closed; before the root closes, its three means are run, the IDL's checks, the sweep and the promise tests.
          stateBefore: Every step closed.
          stateAfter: The run is proved, and the root closes.
          observedOutcome: poa check passes with no operation unbound, the sweep passes with no gaps, and test_promise passes its 48 tests.
          elapsedTimeMs: 39523
          relatedStepIds:
            - step.pour-procedure
      finalState: A run closed after the means its formula names had proved it.
      validatesStepIds:
        - step.pour-procedure
      classificationReason: The means the formula names reached the worker at the pour and stayed on the root, so the run can be proved before it closes.
      status: active
  antiGolden:
    - traceId: antitrace.procedure-poured-unnamed
      traceType: anti-golden
      title: A procedure poured for work nobody named
      description: A molecule is poured and its steps closed, but no create ever ran for the work.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: Someone pours a formula they remember, straight from the tracker.
      trigger: dotdiw formula pour without a preceding dotdiw create.
      events:
        - sequence: 1
          title: Poured unnamed
          event: A molecule exists for work that was never named.
          stateBefore: The work is intended.
          stateAfter: A procedure is poured.
          observedOutcome: Discovery never had its moment; whatever else applied was never shown.
          relatedStepIds:
            - step.name-the-work
            - step.pour-procedure
      finalState: Work proceeds by memory under the appearance of a tracked procedure.
      violatesStepIds:
        - step.name-the-work
      violatesInvariantIds:
        - invariant.work-starts-named
      classificationReason: The declared moment was skipped.
      status: active
    - traceId: antitrace.poured-what-never-surfaced
      traceType: anti-golden
      title: Poured what never surfaced
      description: Work was named and one formula surfaced, but a different formula was poured.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: The worker ignores the surfaced formula and pours one from memory.
      trigger: dotdiw formula pour with a formula the create did not print.
      events:
        - sequence: 1
          title: Named and surfaced
          event: create prints formula A.
          observedOutcome: A is in front of the worker.
          relatedStepIds:
            - step.name-the-work
            - step.match-formulas
        - sequence: 2
          title: Poured B
          event: Formula B is poured.
          observedOutcome: The tracking shows a procedure followed; the surfaced one was not.
          relatedStepIds:
            - step.pour-procedure
      finalState: The surfacing looks to have worked and did not.
      violatesStepIds:
        - step.pour-procedure
      violatesInvariantIds:
        - invariant.work-starts-named
      classificationReason: The procedure that applied was shown and not the one followed.
      status: active
    - traceId: antitrace.create-both-surfaced-and-silent
      traceType: anti-golden
      title: One create both surfaced a formula and reported silence
      description: >
        The log for one work item carries both formula_surfaced and
        nothing_surfaced from its create. No single run of match_formulas can
        write both; a log that holds both was written by two processes for one
        id, or by a defect. The contract refuses it as conflicted rather than
        choosing a side.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: A log that contradicts itself about what the worker was shown.
      trigger: Two writers, or a defect in the one body that matches.
      events:
        - sequence: 1
          title: Contradiction
          event: formula_surfaced and nothing_surfaced for the same workId.
          observedOutcome: Nobody can say from the log whether discovery fired.
          relatedStepIds:
            - step.match-formulas
      finalState: The story is conflicted and no report may claim discovery fired for it.
      violatesStepIds:
        - step.match-formulas
      violatesInvariantIds:
        - invariant.every-formula-finds-itself
      classificationReason: Silence and a match are each evidence; both at once is evidence of nothing.
      status: active
    - traceId: antitrace.coincidence-surfaces
      traceType: anti-golden
      title: A coincidence surfaces
      description: >
        A title about turning bd's metrics off surfaces the retrieval
        threshold sweep and the add-a-domain formula, on the word metrics.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: dotdiw create "Turn bd's usage metrics off on every run" in this repository, 2026-11-01.
      trigger: Two measurement formulas share the title's distinctive word.
      events:
        - sequence: 1
          title: Wrong match
          event: sweep-retrieval-threshold and add-domain-trial-matrix are printed.
          observedOutcome: A glance, then nothing poured.
          relatedStepIds:
            - step.match-formulas
      finalState: Nothing was followed that did not apply, at the cost of a glance.
      violatesStepIds:
        - step.match-formulas
      violatesInvariantIds:
        - invariant.every-formula-finds-itself
      violatesSloIds:
        - slo.applicable-formula-surfaces
      classificationReason: >
        The chosen trade: a coincidence costs a glance, silence would cost
        the mechanism. Recorded so the cost is visible.
      status: active
    - traceId: antitrace.formula-held-by-one-person
      traceType: anti-golden
      title: A formula held by one person
      description: A formula is written and used from one checkout and never committed.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.write-a-procedure-down
      scenario: The author believes the project has a procedure.
      trigger: dotdiw check in any other checkout.
      events:
        - sequence: 1
          title: Not held
          event: check in the author's checkout reports the formula as uncommitted; elsewhere it does not exist.
          stateBefore: Findable in one checkout.
          stateAfter: Still held by nobody but the author.
          observedOutcome: Nobody else's create can reach it.
          relatedStepIds:
            - step.commit-formula
      finalState: Sharing is counterfeited.
      violatesStepIds:
        - step.commit-formula
      violatesInvariantIds:
        - invariant.only-committed-formulas-are-held
      violatesSloIds:
        - slo.every-formula-finds-itself
      classificationReason: The project does not hold what git does not hold.
      status: active
    - traceId: antitrace.adoption-reached-outside
      traceType: anti-golden
      title: Adoption reached outside the repository
      description: >
        v0.1.0 passed bd init through unchanged: core.hooksPath set to an
        absolute path into .beads, a Dolt remote aimed at the git remote, and
        telemetry left on, none of it said. Under 0.2.0 and 0.2.1 bd
        committed its own files during init; the sync remote was then removed
        from .beads/config.yaml, and that file was not in the list of files
        reported as left uncommitted.
      dutyId: duty.adopt-without-reaching-outside
      journeyId: journey.adopt-a-repository
      scenario: Clients ran dotdiw init in October 2026.
      trigger: dotdiw init under v0.1.0.
      events:
        - sequence: 1
          title: Hooks overridden
          event: core.hooksPath points at .beads/hooks; hooks added later to .git/hooks are skipped.
          observedOutcome: Commits in between did not see those hooks.
          relatedStepIds:
            - step.adopt-repository
        - sequence: 2
          title: Database aimed at the repository
          event: A Dolt remote at the git remote; a push puts the issue database into the repository as refs/dolt/data and a branch.
          observedOutcome: Plaintext issue content in a git repository, growing with its history.
          relatedStepIds:
            - step.adopt-repository
        - sequence: 3
          title: The tracker's files committed, one of them then changed
          event: Under 0.2.0 and 0.2.1 bd committed fourteen files during init; the sync block was then removed from .beads/config.yaml, the report of what was left uncommitted did not list that file, and the notice described the removal as undoing an earlier version's work.
          observedOutcome: A diff in a file bd committed, with no line in the report naming it. bd's stealth mode commits nothing.
          relatedStepIds:
            - step.adopt-repository
            - step.report-what-is-yours-to-commit
            - step.undo-earlier-adoption
        - sequence: 4
          title: The tracker's state in the tree
          event: Under 0.3.0 the tracker stayed in the working tree, local and excluded, with an exclude to maintain, a leftover check, and a line of explanation in every notice.
          observedOutcome: The repository carried state that was never the project's; 0.4.0 moves it under the home.
          relatedStepIds:
            - step.adopt-repository
      finalState: Repositories changed in ways their owners were not told about.
      violatesStepIds:
        - step.adopt-repository
        - step.undo-earlier-adoption
      violatesInvariantIds:
        - invariant.nothing-outside-the-repository
      violatesSloIds:
        - slo.adoption-leaves-nothing-outside
      classificationReason: What a tool does on somebody's behalf must be stated. It was not.
      status: active
    - traceId: antitrace.tracker-named-itself
      traceType: anti-golden
      title: The tracker named itself
      description: >
        Under 0.1.x, --version forwarded to bd and rewrote bd's name in the
        answer, so dotdiw reported another tool's version as its own; and the
        files bd wrote for agents kept naming bd, which the stream rewrite never
        reached.
      dutyId: duty.put-all-four-under-one-name
      journeyId: journey.run-a-tracker-command
      scenario: dotdiw --version, and an agent reading CLAUDE.md after init, under 0.1.x.
      trigger: The rewrite was applied to the stream and nowhere else.
      events:
        - sequence: 1
          title: Wrong version
          event: dotdiw --version printed bd's version string with bd renamed.
          observedOutcome: A tool reporting a version it does not have.
          relatedStepIds:
            - step.forward-to-the-tracker
        - sequence: 2
          title: Wrong name in the files
          event: AGENTS.md and CLAUDE.md, written by bd, told agents to run bd.
          observedOutcome: Agents learned the name the project was trying not to teach.
          relatedStepIds:
            - step.declare-conventions
      finalState: Two names for the same thing, in the one place that was supposed to have one.
      violatesStepIds:
        - step.forward-to-the-tracker
        - step.declare-conventions
      violatesInvariantIds:
        - invariant.one-name-for-all-four
      classificationReason: Fixed in 0.2.0 by owning --version and renaming in the files; recorded as the shape of the failure.
      status: active
    - traceId: antitrace.formulas-moved-to-the-trackers-directory
      traceType: anti-golden
      title: Formulas moved to the tracker's directory
      description: >
        bd's own formula list answers about .beads/formulas and says No
        formulas found in a project whose formulas sit next to what they are
        about. Every agent in the trial believed it and moved the formulas.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.find-a-held-procedure
      scenario: An agent asks what the project holds and gets the tracker's answer.
      trigger: formula list forwarded to bd unchanged.
      events:
        - sequence: 1
          title: Told nothing is held
          event: No formulas found.
          observedOutcome: The agent moves every formula into .beads/formulas, away from what it is about.
          relatedStepIds:
            - step.list-formulas
      finalState: The convention that a formula lives next to its work is undone by the tool meant to serve it.
      violatesStepIds:
        - step.list-formulas
      violatesInvariantIds:
        - invariant.only-committed-formulas-are-held
        - invariant.notice-stops-when-written
      classificationReason: The question was about the project and the answer was about two directories.
      status: active
    - traceId: antitrace.proved-by-what-is-gone
      traceType: anti-golden
      title: Proved by what is gone
      description: >
        A formula's verify-using names a report in this repository that a later
        change deleted. The run is poured and closed, and the means to prove it
        points at nothing.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.write-a-procedure-down
      scenario: A release formula names the scan report it is proved by, and a cleanup removes the report.
      trigger: dotdiw check after the cleanup.
      events:
        - sequence: 1
          title: Named before anyone pours
          event: check names the formula and the file its verify-using names, which git no longer tracks.
          observedOutcome: The formula is fixed where it lives before the next run relies on it.
          relatedStepIds:
            - step.describe-and-check
      finalState: A proved run is counterfeited.
      violatesStepIds:
        - step.describe-and-check
      violatesInvariantIds:
        - invariant.only-committed-formulas-are-held
      classificationReason: A proof that points at something gone counterfeits a proved run.
      status: active

operationTypes:
  - typeId: type.formula-provider
    name: FormulaProvider
    kind: record
    description: >-
      A formula management provider as registered: its name, its module, where
      it keeps its formulas and what it answers.
    fields:
      - name: name
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: >-
          The registered name, letters and digits, and the suffix of its
          formulas.
      - name: module
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The provider module a package installed."
      - name: location
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "Where the provider keeps its formulas: a directory or a URL."
      - name: version
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "The module's version, as its info gives it."
      - name: answers
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: "Which of list, show and create it answers."
        cardinality: many
      - name: unavailable
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: >-
          Why a registered provider cannot answer now -- its module is not
          installed, or it failed to describe itself -- so that a
          registration whose name stays taken is never hidden.
  - typeId: type.held-formula
    name: HeldFormula
    kind: record
    description: >-
      A formula as dotdiw reads it, from its file in local storage or from
      its provider's list: what ListFormulas lists, MatchFormulas surfaces and
      the witness records.
    fields:
      - name: formulaRef
        valueType:
          kind: reference
          targetRef: object.formula
        required: true
        summary: >-
          The formula's id, as its file declares it; the file's name when it
          declares none.
      - name: name
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: >-
          The file's name without its extensions, which is what MatchFormulas
          prints.
      - name: description
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The description as written in the file."
      - name: path
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: >-
          The repository-relative path of the file; for a provider's formula,
          the file it is written to once it is shown or poured, and empty
          before.
      - name: examples
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: "The example titles the file declares, in its order."
        cardinality: many
      - name: verifyUsing
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: >-
          The means to prove the formula's run, as the file declares them, in
          its order: run: commands, git+https:// or git+ssh:// files with the
          path after #, and links.
        cardinality: many
      - name: provider
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: >-
          The registered provider the formula comes from; absent for a local
          formula.
  - typeId: type.formula-example
    name: FormulaExample
    kind: record
    description: >-
      One example title of one formula, named so that the conventions check
      can take it out of the index while that formula is searched for.
    fields:
      - name: formulaRef
        valueType:
          kind: reference
          targetRef: object.formula
        required: true
        summary: "The formula whose example it is."
      - name: example
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The example title, as the file declares it."
  - typeId: type.convention-problem
    name: ConventionProblem
    kind: record
    description: >-
      One problem DescribeAndCheck found: where it is, what is wrong, and
      which convention it breaks.
    fields:
      - name: kind
        valueType:
          kind: enum-inline
          values:
            - convention
            - formula
        required: true
        summary: >-
          convention: an instruction file that does not say where work starts,
          or the tracker's directory tracked in git. formula: a formula that
          is uncommitted, outside the repository, under an id that reads like
          a registered provider's suffixed id, too short to name a situation, still a scaffold, short of examples, not retrieved by one
          of its examples, or whose verify-using holds a value check cannot
          read, a value longer than one line, or a file of this repository
          that git does not track.
      - name: where
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: >-
          The file, repository-relative; the absolute path of a formula
          outside the repository.
      - name: what
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: >-
          What is wrong with it, and the command that puts it right when there
          is one.
  - typeId: type.handmade-procedure
    name: HandmadeProcedure
    kind: record
    description: >-
      A procedure carried out in the tracker and never declared: a parent of
      kind task, with ordered children, that no formula reaches.
    fields:
      - name: workRef
        valueType:
          kind: reference
          targetRef: object.work
        required: true
        summary: "The parent's id, which formula new --from turns into steps."
      - name: title
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The parent's title, which becomes the formula's."
      - name: stepCount
        valueType:
          kind: scalar
          scalar: integer
        required: true
        summary: "How many ordered children it has."
  - typeId: type.tracker-item
    name: TrackerItem
    kind: record
    description: >-
      One item of the tracker as an adapter returns it: what every tracker
      operation reads and writes, whichever adapter answers.
    fields:
      - name: id
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: >-
          The adapter's id for the item; opaque to dotdiw, prefixed where the
          adapter honours the workspace prefix.
      - name: title
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The title as given."
      - name: kind
        valueType:
          kind: enum-inline
          values:
            - root
            - task
        required: false
        summary: >-
          root for the root a pour made, and task for every other item,
          whatever the tracker calls it; task when unsaid.
      - name: status
        valueType:
          kind: enum-inline
          values:
            - open
            - in_progress
            - blocked
            - closed
        required: true
        summary: "open, in_progress, blocked or closed."
      - name: priority
        valueType:
          kind: scalar
          scalar: integer
        required: false
        summary: "0 is highest; 2 when unsaid."
      - name: parent
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "The parent's id, when the item is a child."
      - name: reason
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "Why it was closed, when it was."
      - name: needs
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: "Ids of the items this one needs closed first."
        cardinality: many
      - name: createdAt
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "When it was made, as the adapter states it."
      - name: updatedAt
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "When it last changed, as the adapter states it."
      - name: assignee
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "Who claims it, as the tracker shows them."
      - name: description
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: >-
          What the item says beyond its title, exactly as given; a root
          carries its formula's description.
      - name: verifyUsing
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: >-
          The means to prove a run, one line each: a poured root's, or those a
          move carried with an item; show-item returns them exactly as given.
        cardinality: many
  - typeId: type.tracker-edge
    name: TrackerEdge
    kind: record
    description: >-
      A need between two items: the first cannot close while the second is
      open.
    fields:
      - name: id
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The item that needs."
      - name: needs
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The item it needs closed first."
  - typeId: type.tracker-step
    name: TrackerStep
    kind: record
    description: >-
      One step of a formula as handed to the tracker to pour: its id within
      the formula, its title and the step ids it needs.
    fields:
      - name: id
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The step's id in the formula."
      - name: title
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The step's title."
      - name: needs
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: "Step ids this one needs, by the formula."
        cardinality: many
  - typeId: type.formula-step
    name: FormulaStep
    kind: record
    description: >-
      One step of a formula as data: its id within the formula, its title and
      the step ids it needs.
    fields:
      - name: id
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The step's id in the formula."
      - name: title
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The step's title."
      - name: needs
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: "Step ids this one needs."
        cardinality: many
  - typeId: type.formula-body
    name: FormulaBody
    kind: record
    description: >-
      A formula as data, the way a formula management provider answers show:
      its description, its means to prove, and its steps.
    fields:
      - name: description
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The formula's description."
      - name: verifyUsing
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: "The means to prove a run of it, one line each."
        cardinality: many
      - name: steps
        valueType:
          kind: list
          itemType:
            kind: type-ref
            typeId: type.formula-step
        required: true
        summary: "Its steps, in the formula's order."
        cardinality: many
  - typeId: type.tracker-info
    name: TrackerInfo
    kind: record
    description: >-
      What an adapter says of itself: its name and version, where it came
      from, and what it can do.
    fields:
      - name: name
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: >-
          The registered name: local, beads, or the name it was loaded under.
      - name: version
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The adapter's own version, or the product's behind it."
      - name: interface
        valueType:
          kind: scalar
          scalar: integer
        required: false
        summary: >-
          The tracker interface it was written for; a module that says nothing
          was written for interface 1.
      - name: origin
        valueType:
          kind: enum-inline
          values:
            - shipped
            - loaded
        required: true
        summary: >-
          Inside dotdiw, or loaded by name from the home directory or
          share/dotdiw/trackers.
      - name: source
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "The file it was loaded from, when loaded."
      - name: nativeNeeds
        valueType:
          kind: scalar
          scalar: boolean
        required: false
        summary: >-
          Whether the product behind it holds needs itself, or the adapter
          keeps them in a sidecar.
      - name: checkTarget
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: >-
          Where tracker check may create and close items: a project, a board,
          a throwaway store; absent, the check refuses to run.
      - name: extras
        valueType:
          kind: list
          itemType:
            kind: scalar
            scalar: string
        required: false
        summary: >-
          What the adapter offers beyond the interface, by name: forward,
          for the beads adapter's pass-through; metrics-off; and upgrade, for
          an adapter whose store an earlier version kept another way.
        cardinality: many
  - typeId: type.tracker-actor
    name: TrackerActor
    kind: record
    description: >-
      Who a tracker would act as: the name it shows, its own id where it has
      one, and whether it checked. A name anyone could give is not verified.
    fields:
      - name: name
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The name the tracker shows; never an email address."
      - name: id
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "The tracker's own id for them, where it has one."
      - name: verified
        valueType:
          kind: scalar
          scalar: boolean
        required: true
        summary: >-
          True only where the tracker checked credentials; false for a name
          anyone could give.
  - typeId: type.tracker-check-result
    name: TrackerCheckResult
    kind: record
    description: >-
      One operation of the conformance scenario as it ran against an adapter.
    fields:
      - name: operation
        valueType:
          kind: scalar
          scalar: string
        required: true
        summary: "The operation id."
      - name: status
        valueType:
          kind: enum-inline
          values:
            - pass
            - fail
        required: true
        summary: "Whether the adapter answered as the interface says."
      - name: detail
        valueType:
          kind: scalar
          scalar: string
        required: false
        summary: "What failed, when it did."
externalProductDependencies:
  - dependencyId: dependency.beads
    productId: product.beads
    productName: "beads (bd)"
    reason: >-
      beads is a tracker a checkout may choose, installed on its own: under
      that choice it holds the work items, cooks and pours formulas, and owns
      every command dotdiw forwards. dotdiw adds discovery and hides the
      second name. It is reached only through the beads adapter, behind the
      tracker door; the interface is what dotdiw's bodies see.
    boundarySemantics: >-
      A local subprocess on the same machine, run by the beads adapter alone,
      told where its state lives through BEADS_DIR: ~/.dotdiw/<key>/.beads
      under the user's home, keyed to the checkout. It runs in its stealth
      mode with hooks and agent files declined, so it commits nothing, writes
      nothing into the repository and configures no remote. The adapter turns
      its usage metrics off before the first call, rewrites its name in
      everything it prints, and otherwise changes nothing it does. It has no
      POA IDL; the commands below are what the adapter calls.
    calledOperations:
      - create
      - "init --stealth --skip-hooks --skip-agents"
      - "mol pour"
      - "cook --persist --force"
      - "metrics off"
      - "list --json --brief"
      - "dep add"
      - close
      - show
      - update
      - ready
      - "--version"
      - "every command dotdiw does not own, forwarded unchanged"
  - dependencyId: dependency.git
    productId: product.git
    productName: git
    reason: >-
      git is the sharing mechanism: a formula the project holds is one git
      tracks, and it reaches other people as every other file does. The
      project's tracked text is read from it as the background the formulas
      are ranked against; the formulas themselves are found on the file
      system.
    boundarySemantics: >-
      The project's own repository, read and never written except two lines
      inside its .git/config -- the key under which this checkout's tracker
      lives, and the adapter it was chosen to go through, local to the clone
      and never in the tree: dotdiw lists tracked and untracked files, reads
      and unsets one hooks key that an earlier version let the tracker set,
      and reads status for the declaration files. For a tracker check it makes
      a scratch repository of its own under a temporary directory and removes
      it. It never commits, pushes, syncs or changes the index. It has no POA
      IDL; the commands below are what dotdiw calls.
    calledOperations:
      - "rev-parse --show-toplevel"
      - ls-files
      - "ls-tree -z --name-only HEAD"
      - "config --get core.hooksPath"
      - "config --unset core.hooksPath"
      - "diff --name-only"
      - "rev-parse --is-inside-work-tree"
      - "status --porcelain"
      - "config --local --get dotdiw.workspace"
      - "config --local dotdiw.workspace"
      - "config --local --get dotdiw.tracker"
      - "config --local dotdiw.tracker"
      - init
      - "config user.name"
      - "remote -v"
operationProjections:
  - projectionId: projection.cli
    projectionKind: cli
    status: manual
    outputPath: dotdiw
    generator: >-
      hand-written: main() in dotdiw parses the affordance, builds the request
      and calls the operation through the door, invoke, by its id; it installs
      the presenter that shows each response as its operation returns
  - projectionId: projection.door
    projectionKind: python-dispatcher
    status: generated
    outputPath: dotdiw
    generator: >-
      poa/complete-idl.py writes the door's table into dotdiw between markers,
      from operation-idl.json: for every operation, the body's name and the
      fields of its request and its response, the required ones named. invoke,
      DoorError and witness_from beside it are hand-written
    notes: >-
      The one way an operation is invoked, by id and with a request dict. The
      request is held to its type on the way in and the response to its own on
      the way out; a key outside either raises DoorError naming the operation
      and the key. The witness log is appended from the response, and the
      response is shown by the presenter the interface installs, so every
      transport runs the same bodies. test_promise.py regenerates the table
      and fails on any difference.
  - projectionId: projection.grpc
    projectionKind: grpc
    status: planned
    outputPath: gen
    protoOutputPath: gen/proto
    bufConfigPath: gen/buf.yaml
    bufGenerationTemplatePath: gen/buf.gen.yaml
    languageTargets:
      - language: python
        outputPath: gen/python
    protovalidate:
      enabled: true
      dependency: buf.build/bufbuild/protovalidate
      import: buf/validate/validate.proto
    generator: >-
      poa conform grpc-signatures, as a conformance harness only: generated
      into gitignored gen/ on a machine with Buf; never served
  - projectionId: projection.tracker-door
    projectionKind: python-protocol
    status: generated
    outputPath: dotdiw
    generator: >-
      poa/complete-idl.py writes the inner door's table into dotdiw between its
      own markers, from operation-idl.json: for every operation of the tracker
      interface, the fields of its request and its response, the required ones
      named. invoke_tracker, register_tracker and load_tracker beside it are
      hand-written
    notes: >-
      The tracker interface as a protocol every adapter implements: a table
      from operation id to one callable of one request. The registry holds
      adapters by name; the door resolves the adapter from the request, the
      workspace's key, or the shipped default, holds both sides to their
      types, and returns the adapter's records. test_promise.py regenerates
      the table and fails on any difference.
