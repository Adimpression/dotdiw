  - journeyId: journey.answer-through-the-tracker
    dutyId: duty.put-all-four-under-one-name
    title: Answer through the chosen tracker
    description: >
      A body asks the tracker for something and the chosen adapter answers, through the inner door, in typed records.
    purpose: Every tracker operation has one door, and the adapter behind it can be swapped per request.
    trigger: A body of dotdiw needs the tracker.
    preconditions:
      - The repository is adopted and its workspace has a key.
      - The adapter that would answer is registered.
    primaryFlow:
      - The request names an adapter, or the workspace's key does, or local answers.
      - The door holds the request to its type and calls the adapter's callable for the operation.
      - The adapter answers with records, which the door holds to the response type.
    completionCriteria:
      - The response is the operation's, whichever adapter answered.
      - Nothing was printed by the adapter.
    variants:
      - The adapter has no store for the workspace yet and opens one first.
    failureBoundaries:
      - A request naming an adapter that is not registered fails with the registered names.
    nonGoals:
      - Choosing an adapter for the worker.
    inputObjectIds:
      - object.tracker-adapter
      - object.work
    outputObjectIds:
      - object.tracker
      - object.work
      - object.molecule
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
    stepIds:
      - step.open-tracker
      - step.describe-tracker
      - step.create-item
      - step.add-need
      - step.pour-steps
      - step.close-item
      - step.show-item
      - step.list-items
      - step.update-item
      - step.ready-items
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: mixed
      syncExpectation: mixed
      causalJustification: >
        The local store answers in the same breath; the beads adapter in the tracker process's time; a hosted tracker in its network's.
    networkBoundaryIds:
      - boundary.dotdiw-to-tracker
    status: active
    version: 0.6.0
  - journeyId: journey.choose-a-tracker
    dutyId: duty.put-all-four-under-one-name
    title: Choose a tracker
    description: >
      Someone sees which adapters are registered, makes one the workspace's, or checks one against the suite that defines an adapter.
    purpose: A tracker is chosen in the open, by name, and proven before it is trusted.
    trigger: Someone wants a workspace on a tracker other than the default, or wants to know which it is on.
    preconditions:
      - The repository is adopted.
    primaryFlow:
      - dotdiw tracker list prints each registered adapter, its version, and which the workspace uses.
      - dotdiw tracker use <name> writes dotdiw.tracker into the checkout's config and opens the store.
      - dotdiw tracker check <name> runs the conformance suite against the adapter's declared target.
    completionCriteria:
      - The workspace's config names a registered adapter.
      - A checked adapter passed every operation, or the failing one is named.
    variants:
      - init --tracker <name> chooses at adoption.
      - dotdiw tracker check <path> proves a file that is not installed.
    failureBoundaries:
      - A name that is not registered is refused with the registered names and nothing is written.
    nonGoals:
      - Installing a hosted tracker's credentials; the adapter reads its own.
    inputObjectIds:
      - object.tracker-adapter
      - object.repository
    outputObjectIds:
      - object.tracker-adapter
      - object.tracker
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
    stepIds:
      - step.list-trackers
      - step.use-tracker
      - step.check-tracker
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: mixed
      syncExpectation: synchronous
      causalJustification: >
        Listing and choosing are a line in the checkout's config and answer at once; a check runs the whole suite and takes what the adapter takes.
    networkBoundaryIds:
      - boundary.dotdiw-to-tracker
    status: active
    version: 0.6.0
  - journeyId: journey.move-a-workspace
    dutyId: duty.put-all-four-under-one-name
    title: Move a workspace between trackers
    description: >
      Everything a workspace holds in one adapter is written into another, and the source is left as it was.
    purpose: "Changing trackers loses nothing: items, statuses, reasons and needs cross over."
    trigger: A workspace on one adapter is wanted on another.
    preconditions:
      - Both adapters are registered.
      - The target has, or can open, a store for the workspace.
    primaryFlow:
      - dotdiw tracker migrate <from> <to> lists everything in the source.
      - Open items are created in the target, then closed ones with their reasons, then the needs.
      - Ids are kept where the target accepts them; otherwise the mapping is recorded in the target's meta.
    completionCriteria:
      - Every item of the source exists in the target with its status, reason and needs.
      - The source is unchanged.
      - Run again, nothing changes.
    variants:
      - The target already holds some of the items, which are left alone.
    failureBoundaries:
      - A target that refuses an item stops the move with the item named; what was written stays, and the next run continues.
    nonGoals:
      - Keeping two trackers in step afterwards.
    inputObjectIds:
      - object.tracker
      - object.work
    outputObjectIds:
      - object.tracker
      - object.work
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
    stepIds:
      - step.migrate-workspace
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: over-or-equal-1s
      syncExpectation: synchronous
      causalJustification: >
        One item at a time through two adapters; the command runs to completion and reports the count.
    networkBoundaryIds:
      - boundary.dotdiw-to-tracker
    status: active
    version: 0.6.0
  - journeyId: journey.ship-a-tracker
    dutyId: duty.put-all-four-under-one-name
    title: Ship a tracker
    description: >
      Someone writes a tracker adapter of their own and ships it so that others install it by name.
    purpose: Let someone write a tracker dotdiw does not ship, check it, and publish it as a package others can install.
    trigger: Someone wants dotdiw to work on a tracker it does not ship.
    preconditions:
      - dotdiw is installed.
    primaryFlow:
      - dotdiw tracker new <name> writes the file to start from.
      - dotdiw tracker check ./<name>.py says which operations are left to answer.
      - A package named dotdiw-tracker-<name> installs the file under share/dotdiw/trackers.
    completionCriteria:
      - The file passes every operation of the scenario.
      - dotdiw tracker list shows it from where the package put it.
    variants:
      - The file is copied to ~/.dotdiw/trackers with no package; that directory is looked in first.
    failureBoundaries:
      - A name with anything but lowercase letters, digits and hyphens, the name of a built-in adapter, or a file that exists is refused and nothing is written.
    nonGoals:
      - A registry of trackers; dotdiw reads no package's name.
      - A repository choosing an adapter; a clone cannot make dotdiw run its code.
    inputObjectIds:
      - object.tracker-adapter
    outputObjectIds:
      - object.tracker-adapter
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
    stepIds:
      - step.write-tracker
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: under-1s
      syncExpectation: synchronous
      causalJustification: >
        dotdiw's own step here is one small file, written from text the tool already holds.
    networkBoundaryIds:
      - boundary.new-to-file
    status: active
    version: 0.7.0

steps:
  - stepId: step.name-the-work
    journeyId: journey.start-named-work
    sequence: 1
    title: Name the work
    given: An adopted repository, and someone about to do a piece of work.
    when: They run dotdiw create with a title in their own words.
    then: A work item is created under that title, and it is the first thing that has happened to the work.
    thenAssertions:
      - The work item exists in the tracker with the title given.
      - No branch, file or other command preceded it for this work.
    relatedObjectIds:
      - object.work
    relatedInteractionIds:
      - interaction.start-work
    relatedInvariantIds:
      - invariant.one-door
      - invariant.work-starts-named
    expectedUserVisibleOutcome: The created work item and its id.
    status: active
    stateTransitions:
      - objectId: object.work
        fromState: intended
        toState: named
  - stepId: step.match-formulas
    journeyId: journey.start-named-work
    sequence: 2
    title: Match formulas
    given: The work has just been named and the project holds committed formulas.
    when: The title is ranked against every formula's description, examples and path, with the project's own text as the background.
    then: The formulas accounting for at least 0.15 of what is distinctive about the title are printed, best first, with their paths and the command to pour one.
    thenAssertions:
      - Only committed formulas can appear.
      - Silence is printed when nothing crosses the threshold.
      - The match is in the same invocation as the create.
    relatedObjectIds:
      - object.work
      - object.formula
    relatedInteractionIds:
      - interaction.start-work
    relatedInvariantIds:
      - invariant.one-door
      - invariant.work-starts-named
      - invariant.only-committed-formulas-are-held
    expectedUserVisibleOutcome: Up to three formulas under the work item, or nothing.
    status: active
  - stepId: step.pour-procedure
    journeyId: journey.start-named-work
    sequence: 3
    title: Pour the procedure
    given: A formula surfaced for the named work.
    when: The worker runs dotdiw formula pour with that formula.
    then: One tracked issue per step is created under a root, each blocked by the steps it needs.
    thenAssertions:
      - dotdiw mol pour, the older spelling, does the same and prints the same.
      - A step cannot be closed before the steps it needs.
      - The root names the formula it was poured from.
      - The formula's verify-using goes to the tracker with the root and is shown after the pour.
    relatedObjectIds:
      - object.work
      - object.formula
      - object.molecule
    relatedInteractionIds:
      - interaction.pour-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.work-starts-named
      - invariant.the-prover-uses-the-means
    expectedUserVisibleOutcome: The root issue id and the count of steps created.
    status: active
    stateTransitions:
      - objectId: object.work
        fromState: named
        toState: procedure-poured
      - objectId: object.molecule
        fromState: none
        toState: poured
  - stepId: step.notice-handmade-procedures
    journeyId: journey.write-a-procedure-down
    sequence: 1
    title: Notice a procedure carried out by hand
    given: The tracker holds a parent of kind task, with three or more children and a blocks dependency among them -- a procedure built by hand.
    when: dotdiw create, check, doctor or lint runs, and no committed formula reaches the parent's title.
    then: The procedure is named as carried out here and never declared, with its ordered step count and the formula new --from line that turns the work actually done into steps.
    thenAssertions:
      - A parent whose title a committed formula reaches is not named.
      - Children without any blocks edge are a checklist and are not named.
      - Nothing is written anywhere; the notice is printed.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.check-discoverability
    relatedInvariantIds:
      - invariant.one-door
      - invariant.notice-stops-when-written
    expectedUserVisibleOutcome: Up to three undeclared procedures, each with the command that declares it.
    status: active
  - stepId: step.nudge-towards-a-formula
    journeyId: journey.write-a-procedure-down
    sequence: 2
    title: Nudge towards a formula
    given: Someone keeps a procedure as a memory, with dotdiw remember.
    when: The remembered text reads like a procedure -- two or more of the words that order steps, such as first, then, after, every time.
    then: The memory is kept, and the worker is told that a formula can be matched against a title and poured into tracked steps where a memory can do neither, with the formula new line for this text.
    thenAssertions:
      - The memory is stored exactly as the tracker would have stored it.
      - A note that reads like a fact gets no nudge.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.write-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
    expectedUserVisibleOutcome: The tracker's confirmation, then the nudge with a command to copy.
    status: active
  - stepId: step.write-formula
    journeyId: journey.write-a-procedure-down
    sequence: 3
    title: Write the formula
    given: Someone noticed they are repeating a procedure, or just did by hand what they will do again.
    when: They run dotdiw formula new with what the procedure is for, optionally --from the work already done.
    then: A formula file is written next to what it is about, with the description, examples and steps to fill in.
    thenAssertions:
      - The file is named <something>.formula.toml and sits in the tree, not in a formulas directory.
      - Steps and their needs are TOML, not prose.
      - Steps asked from work on a tracker whose binary is missing are refused in one line, and nothing is written.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.write-procedure
    relatedInvariantIds:
      - invariant.one-door
      - invariant.only-committed-formulas-are-held
    expectedUserVisibleOutcome: The path of the new formula and what to fill in.
    status: active
    stateTransitions:
      - objectId: object.formula
        fromState: repeated
        toState: written
  - stepId: step.describe-and-check
    journeyId: journey.write-a-procedure-down
    sequence: 4
    title: Describe it to be found, and check
    given: A written formula.
    when: The description and examples are written in the words people use for the work, and dotdiw check is run.
    then: check reports whether the formula is found from each of its examples, each one taken out of the index while it is searched for, together with the other convention problems -- an uncommitted formula, a formula outside the repository, a description too short to name a situation, a scaffold still carrying TODO, too few examples, a verify-using value it cannot read or one longer than a line, a file of this repository that verify-using names and git does not track, instruction files that do not say where work starts.
    thenAssertions:
      - An example that fails is named, with the formula it should reach.
      - An uncommitted formula is reported as not yet held.
      - The same check runs quietly after every create, and after doctor and lint, printing only the first few problems.
      - A verify-using value check cannot read, one longer than a line, and a file of this repository that a value names and git does not track are each named with the formula; the file is looked for in the checkout, and no remote is contacted.
    relatedObjectIds:
      - object.formula
    relatedInteractionIds:
      - interaction.check-discoverability
    relatedInvariantIds:
      - invariant.one-door
      - invariant.every-formula-finds-itself
      - invariant.the-prover-uses-the-means
    expectedUserVisibleOutcome: One line per failing example, or one line saying every formula is discoverable.
    status: active
    stateTransitions:
      - objectId: object.formula
        fromState: written
        toState: findable
  - stepId: step.commit-formula
    journeyId: journey.write-a-procedure-down
    sequence: 5
    title: Commit the formula
