    summary: >-
      Replace the generated poa invoke bindings with dotdiw's real command
      line, bind every operation to one inline body in dotdiw through
      promise_bindings.py, declare beads and git as the products dotdiw calls
      and name the calls, correct the kinds the step-id heuristic got wrong,
