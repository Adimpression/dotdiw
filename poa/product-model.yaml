    approvalStatus: draft
    createdAt: "2026-11-01T12:00:00+08:00"
  - changeId: change.init-leaves-git-alone
    changeType: model-update
    targetRefs:
      - step.adopt-repository
      - step.report-what-is-yours-to-commit
      - step.undo-earlier-adoption
      - journey.adopt-a-repository
      - lifecycle.repository
    summary: >
      init runs the tracker in its stealth mode: bd commits nothing, writes
      nothing for agents, configures no remote, and keeps .beads/ local to the
      checkout. The report names dotdiw's declaration files as the worker's to
      commit; the undo step names the one command for repositories where an
      earlier version let bd commit, and says who did what it undid.
    reason: >
      bd's stealth mode commits nothing. 0.2.0 and 0.2.1 used the default
      init, declined the hooks, removed the sync remote afterwards and
      reported the files left modified; the report did not include the file
      the removal changed, and the notice described the removal as undoing an
      earlier version's work. The step's assertion that every edited file was
      listed did not hold.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.adopt-a-repository
      affectedSlos:
        - slo.adoption-leaves-nothing-outside
      affectedTraces:
        - trace.adoption-left-nothing-outside
        - antitrace.adoption-reached-outside
      affectedInvariants:
        - invariant.nothing-outside-the-repository
        - invariant.tool-never-commits
      riskLevel: medium
      riskExplanation: >
        New adoptions change shape; adoptions by 0.1.x and 0.2.x keep working
        and are told one command, which dotdiw never runs for them.
    migrationPlan: >
      For a repository adopted before 0.3.0: every run writes the stealth
      exclude lines into .git/info/exclude; init, check, doctor and lint print
      "git rm -r --cached .beads && git commit" until it is done; clones that
      pull that commit run dotdiw init once. Nothing is deleted and nothing is
      done on the worker's behalf.
    approvalStatus: draft
    createdAt: "2026-11-01T18:30:00+08:00"
  - changeId: change.tracker-state-leaves-the-repository
    changeType: model-update
    targetRefs:
      - object.repository
      - step.adopt-repository
      - step.undo-earlier-adoption
      - journey.adopt-a-repository
      - invariant.nothing-outside-the-repository
      - lifecycle.repository
    summary: >
      The tracker's state leaves the repository: it lives under the user's
      home in ~/.dotdiw/<key>, keyed to the checkout by one line in its
      .git/config, told to bd through BEADS_DIR, with stealth, hooks and agent
      files declined. The repository holds only the formulas and the
      declaration. A repository adopted earlier is adopted under the home by
      its first command, keeping its prefix; its tasks are not carried over.
    reason: >
      Every version before 0.4.0 kept bd's state in the working tree, where it
      needed an exclude, a check for leftovers and an explanation in every
      notice, and where a clone could never use it anyway. Under the home it
      is keyed to the checkout, survives a move, is shared by worktrees, and
      is nobody else's.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.adopt-a-repository
      affectedSlos:
        - slo.adoption-leaves-nothing-outside
      affectedTraces:
        - trace.adoption-left-nothing-outside
        - trace.upgrade-was-one-command
        - antitrace.adoption-reached-outside
      affectedInvariants:
        - invariant.nothing-outside-the-repository
      riskLevel: medium
      riskExplanation: >
        New adoptions change shape; adoptions by earlier versions are upgraded
        by their first command and lose their task history, which clients are
        told before they upgrade.
    migrationPlan: >
      Clients close their tasks before upgrading and are told the history is
      not carried over. After brew upgrade, the first dotdiw command in a
      repository adopted earlier writes the key, makes the tracker under the
      home with the old prefix, says so once, and names the one command that
      removes the in-tree copy -- git rm -r -q .beads && git commit && rm -rf
      .beads .beads.gate.lock where it was committed, rm -rf .beads
      .beads.gate.lock where it was not. dotdiw runs neither. A fresh clone
      runs dotdiw init once.
    approvalStatus: draft
    createdAt: "2026-11-01T21:00:00+08:00"

  - changeId: change.the-tracker-is-not-named
    changeType: model-update
    targetRefs:
      - invariant.one-name-for-all-four
      - step.forward-to-the-tracker
      - step.declare-conventions
      - step.turn-metrics-off
      - step.undo-earlier-adoption
    summary: >
      Nothing dotdiw says names bd or beads: the install line when the
      tracker is missing is Day 0's command, the metrics notice names the
      tracker and its file, --version reports the tracker's version as a
      number, the rename lines say how many files now name dotdiw, and the
      formula problem line says the tracker finds it. The name appears only
      inside the names of bd's own things on the machine. A test holds every
      string literal in the program to that.
    reason: >
      A worker needs a command when something is missing, a path when a file
      of theirs was changed, and a number for a bug report; none of those
      needs the word. The --version line named bd and so breached this
      invariant as written, and nothing checked it.
    compatibility: additive
    impactAssessment:
      affectedDuties:
        - duty.put-all-four-under-one-name
      affectedJourneys:
        - journey.run-a-tracker-command
        - journey.adopt-a-repository
