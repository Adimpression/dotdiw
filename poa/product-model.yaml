      - step.turn-metrics-off
      - step.declare-conventions
      - interaction.run-any-command
      - boundary.run-any-command
    summary: >
      Undoing an earlier adoption and turning bd's metrics off run before every
      command in well under a second; they inherited over-or-equal-1s from the
      adoption interaction. They, and re-declaring the conventions, now follow
      interaction.run-any-command, under-1s, with a boundary that forbids
      separating them from the command they precede.
    reason: >
      Timing claims are measured, not argued. A step that may not be deferred
