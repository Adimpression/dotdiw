    migrationPlan: null
    approvalStatus: draft
    createdAt: "2026-11-01T22:30:00+08:00"
  - changeId: change.every-operation-through-one-door
    changeType: project-python-dispatcher
    targetRefs:
      - idl.dotdiw
      - projection.door
      - invariant.one-door
    summary: >-
      Invoke every operation through one door generated from the IDL into
