schemaVersion: 2.0.1
modelId: model.dotdiw
modelName: dotdiw Product Model
modelPurpose: >
  The governed source model POA derives dotdiw's operation algebra from: the
  duties, journeys, steps, objects, invariants, traces and timing that make
  "the procedure that applies finds you" a set of lawful operations rather
  than a hope. The thin promise is ../product.yaml; this file is POA's
  internal source and mirrors the operation material that ../praxis.yaml owns.
createdAt: "2026-11-01T00:00:00+08:00"
updatedAt: "2026-11-10T05:30:00+08:00"

product:
  productId: product.dotdiw
  name: dotdiw
  description: >
    Workflow discovery for projects worked by people and AI agents together:
    the procedure that applies surfaces when work starts.
  domain: Workflow discovery

lexicon:
  - termId: term.formula
    term: Formula
    definition: >
      A procedure written as a TOML file named <something>.formula.toml, kept
      next to whatever it is about in local storage, or served by a formula
      management provider under its suffixed id: a description, examples,
      steps with which step needs which, and, when it names them, the means to
      prove its run.
    allowedAliases:
      - procedure
    forbiddenAliases:
      - runbook
      - doc
    examples:
      - release-through-tap.formula.toml lives in the tap, next to the formula it releases.
  - termId: term.molecule
    term: Molecule
    definition: >
      A formula instantiated as tracked, ordered steps in the issue tracker,
      so each step is closed in an order its needs allow.
    allowedAliases:
      - mol
      - poured formula
    forbiddenAliases:
      - checklist
    examples:
      - dotdiw mol pour mol-release-through-tap created ten issues under one root.
  - termId: term.title
    term: Title
    definition: >
      What someone calls the work they are about to do, in their own words,
      given to dotdiw create.
    allowedAliases:
      - the work's name
    forbiddenAliases:
      - ticket summary
    examples:
      - '"Release v0.2.1 through the tap"'
  - termId: term.declared-moment
    term: Declared moment
    definition: >
      The single act a project names as the start of every task and subtask.
      In an adopted project it is dotdiw create.
    allowedAliases:
      - where work starts
    forbiddenAliases:
      - kickoff
    examples:
      - CLAUDE.md opens with the declared moment.
  - termId: term.check
    term: Check
    definition: >
      dotdiw check: whether every formula the project holds can be found from
      its own examples, with the example removed from the index while it is
      searched for.
    allowedAliases:
      - self-test
    forbiddenAliases:
      - lint
    examples:
      - "dotdiw check reports: 5 formulas, all discoverable."
  - termId: term.root
    term: Root
    definition: >
      The one item a pour makes to stand for the whole formula, with every
      step as its child. Its kind is root; every other item's kind is task.
    allowedAliases:
      - poured root
    forbiddenAliases:
      - epic
      - molecule
    examples:
      - dotdiw formula pour mol-cut-release makes a root titled mol-cut-release and one child per step.
  - termId: term.verify-using
    term: Verify-using
    definition: >
      The means to prove that a formula's run did what the formula claims: a
      list of one-line strings in the formula, each a command after run:, a
      file in a repository as a git+https:// or git+ssh:// URL with its path
      after #, or a link. Whoever proves the run uses them; dotdiw shows them
      and checks that each is well formed.
    allowedAliases:
      - the means to prove
    forbiddenAliases:
      - evidence
      - attestation
      - hook
    examples:
      - '"run:lint *.*" proves the code is clean.'

  - termId: term.formula-management-provider
    term: Formula management provider
    definition: >
      Where formulas are kept, behind the formula management abstraction: a file
      system or an API endpoint, made eligible by installing a package that
      provides it and registered under an alphanumeric name. It answers list
      and show, and create where it can, and declares through describe which
      of the three it answers. Initial versions require list and show of
      every provider.
    allowedAliases:
      - provider
    forbiddenAliases:
      - tracker
      - adapter
    examples:
      - A provider registered as acme serves mol-ship-a-release-acme.
  - termId: term.local-storage
    term: Local storage
    definition: >
      The file system, where a formula without a suffix is kept. git plays no
      part in finding a formula there, and local storage itself commits
      nothing and keeps no history. Until a git formula management provider
      ships, a formula there is shared by committing it, as every other file
      is.
    allowedAliases: []
    forbiddenAliases: []
    examples:
      - mol-ship-a-release, with no suffix, is in local storage.
  - termId: term.suffixed-id
    term: Suffixed id
    definition: >
      The id of a registered provider's formula: the formula's id, a hyphen,
      and the provider's alphanumeric name.
    allowedAliases: []
    forbiddenAliases: []
    examples:
      - mol-ship-a-release-acme is mol-ship-a-release from the provider registered as acme.
ambiguityPolicy:
  principle: >
    Where the words of a title and the words of a description disagree,
    dotdiw shows a coincidence or stays silent; it never guesses on the
    worker's behalf, and what it could not reach is a question for the
    description, recorded in examples.
  unresolvedQuestionHandling: block-change
  requiresClarificationWhen:
    - A formula cannot be found from one of its own examples.
    - A change would make dotdiw enforce rather than show.
    - A change would make dotdiw commit, push or sync anything on the worker's behalf.

realWorldModel:
  objects:
    - objectId: object.work
      name: Work
      definition: A piece of work someone is about to do in the project.
      lifecycleStates:
        - intended
        - named
        - procedure-poured
        - done
      ownedByDutyIds:
        - duty.surface-procedures-when-work-starts
    - objectId: object.formula
      name: Formula
      definition: A procedure written as a formula file.
      lifecycleStates:
        - repeated
        - written
        - findable
        - held
      ownedByDutyIds:
        - duty.keep-procedures-findable
    - objectId: object.molecule
      name: Molecule
      definition: A poured formula, tracked as ordered steps.
      lifecycleStates:
        - poured
        - complete
      ownedByDutyIds:
        - duty.surface-procedures-when-work-starts
    - objectId: object.repository
      name: Repository
      definition: >
        A git repository in which people and agents work. An adopted one is
        tied to its tracker by one line in its own .git/config, the key under
        which the tracker's state lives under the user's home.
      lifecycleStates:
        - unadopted
        - adopted
        - carrying-earlier-adoption
      ownedByDutyIds:
        - duty.adopt-without-reaching-outside
    - objectId: object.conventions
      name: Conventions
      definition: >
        The declaration in CLAUDE.md and AGENTS.md of where work starts and
        where procedures live.
      lifecycleStates:
        - undeclared
        - declared
      ownedByDutyIds:
        - duty.adopt-without-reaching-outside
    - objectId: object.tracker-command
      name: Tracker command
      definition: >
        A command meant for the issue tracker, given to dotdiw under its own
        name: list, show, close, doctor, cook, remember, and everything else
        dotdiw does not own.
      lifecycleStates:
        - given
        - answered
      ownedByDutyIds:
        - duty.put-all-four-under-one-name
    - objectId: object.tracker
      name: Tracker
      definition: >
        The store that holds the work: items with a kind, root or task, a
        status, a priority and a parent, the needs between them, and the
        steps a formula was poured into. Reached only through the inner door,
        and answered for by one adapter.
      lifecycleStates:
        - unopened
        - open
      ownedByDutyIds:
        - duty.put-all-four-under-one-name
    - objectId: object.tracker-adapter
      name: Tracker adapter
      definition: >
        One implementation of the tracker interface, registered under a name.
        local is a store in the standard library's sqlite under the
        workspace's keyed directory; beads is the tracker of every version
        before 0.6.0, with everything that contains it moved inside; another
        is loaded by name from the home directory, or from share/dotdiw/trackers
        beside the tool, where a package installs it, and says which interface
        it was written for. A request names one, else the workspace's key does,
        else local answers.
      lifecycleStates:
        - registered
        - chosen
      ownedByDutyIds:
        - duty.put-all-four-under-one-name
    - objectId: object.formula-management-provider
      name: Formula management provider
      definition: Where formulas are kept, behind the formula management abstraction.
      lifecycleStates:
        - eligible
        - registered
      ownedByDutyIds:
        - duty.keep-procedures-findable
  interactions:
    - interactionId: interaction.start-work
      name: Start work
      description: >
        Someone names the work they are about to do, and the formulas that
        apply are shown in the same breath.
      participantObjectIds:
        - object.work
        - object.formula
      expectedRealWorldDuration:
        class: under-1s
        explanation: >
          The match belongs in the same breath as the title. A procedure that
          arrives later arrives after the work began.
    - interactionId: interaction.pour-procedure
      name: Pour a procedure
      description: A surfaced formula becomes tracked, ordered steps.
      participantObjectIds:
        - object.work
        - object.formula
        - object.molecule
      expectedRealWorldDuration:
        class: mixed
        explanation: >
          The pour is acknowledged at once; the tracker creates one issue per
          step, which can take longer than a second.
    - interactionId: interaction.write-procedure
      name: Write a procedure down
      description: >
        Someone who repeated themselves writes the procedure as a formula and
        commits it.
      participantObjectIds:
        - object.formula
      expectedRealWorldDuration:
        class: over-or-equal-1s
        explanation: Writing a procedure is authoring, on human time.
    - interactionId: interaction.check-discoverability
      name: Check discoverability
      description: >
        The project asks whether every formula it holds can be found from its
        own examples.
      participantObjectIds:
        - object.formula
      expectedRealWorldDuration:
        class: under-1s
        explanation: >
          A local search over the project's own text, so the answer is
          immediate.
    - interactionId: interaction.adopt-repository
      name: Adopt a repository
      description: >
        A repository is given tracking and the two conventions, once. The
        tracker lives under the user's home, keyed to the checkout; the
        repository gains only the declaration.
      participantObjectIds:
        - object.repository
        - object.conventions
      expectedRealWorldDuration:
        class: over-or-equal-1s
        explanation: The tracker initialises its database, which takes seconds.
    - interactionId: interaction.run-any-command
      name: Run any command
      description: >
        The housekeeping dotdiw does on its own around whatever command it was
        given: the tracker's metrics turned off where it has any, an earlier
        adoption undone, the conventions re-declared where an earlier version's
        tracker rewrote them. Each is a file read and at most one small write.
      participantObjectIds:
        - object.repository
        - object.conventions
      expectedRealWorldDuration:
        class: under-1s
        explanation: >
          Reads of a config file and a git setting, before the command the
          worker actually typed; anything slower would be felt on every run.
    - interactionId: interaction.forward-command
      name: Forward a tracker command
      description: >
        Someone runs a tracker command through dotdiw. The chosen adapter
        answers the ones the interface has; under beads every other reaches
        the tracker unchanged and comes back without its name in it.
      participantObjectIds:
        - object.tracker-command
      expectedRealWorldDuration:
        class: mixed
        explanation: >
          dotdiw adds a process spawn and a stream rewrite; the rest is however
          long the tracker takes, which for a pour or an init is seconds. The
          operation is bound to the worker's terminal: the tracker runs on a
          pty when there is one, so its prompts still work, and its stream is
          the one thing dotdiw shows that no response carries. A transport
          without a terminal projects it with the output in the response and
          no prompts, which is what the quiet path is today.
    - interactionId: interaction.find-procedure
      name: Find a held procedure
      description: >
        Someone asks what procedures the project holds, reads one, or names one
        by its id so it can be poured or cooked from where it lives.
      participantObjectIds:
        - object.formula
      expectedRealWorldDuration:
        class: under-1s
        explanation: A git listing and a handful of small files, read from disk.
    - interactionId: interaction.learn
      name: Learn how work gets done here
      description: >
        Someone, or an agent on its first day, reads how work gets done in this
        project, before there is a project to read it from.
      participantObjectIds: []
      expectedRealWorldDuration:
        class: under-1s
        explanation: Text compiled into the tool, printed.
    - interactionId: interaction.answer-through-adapter
      name: Answer through the chosen adapter
      description: >
        A body asks the tracker for something, an item created, a need
        added, steps poured, an item closed, shown, listed or updated, the
        ready set, and the adapter the request names answers, else the
        workspace's, else local.
      participantObjectIds:
        - object.tracker
        - object.tracker-adapter
        - object.work
      expectedRealWorldDuration:
        class: mixed
        explanation: >
          The local store answers in the same breath; the beads adapter in
          the tracker process's time; a hosted tracker in its network's.
    - interactionId: interaction.choose-tracker
      name: Choose a tracker
      description: >
        Someone lists the registered adapters, makes one the workspace's, or
        checks one against the conformance suite at its declared target.
      participantObjectIds:
        - object.tracker-adapter
        - object.repository
      expectedRealWorldDuration:
        class: mixed
        explanation: >
          Listing and choosing are a line in the checkout's config; a check
          runs the whole suite against the adapter and takes what it takes.
    - interactionId: interaction.move-workspace
      name: Move a workspace between trackers
      description: >
        Every item, status, reason and need of a workspace is read from one
        adapter and written to another; the source is never changed.
      participantObjectIds:
        - object.tracker
        - object.tracker-adapter
        - object.work
      expectedRealWorldDuration:
        class: over-or-equal-1s
        explanation: >
          One item at a time through two adapters; a workspace of hundreds
          takes seconds.
    - interactionId: interaction.ship-tracker
      name: Ship a tracker
      description: >
        Someone asks dotdiw for the file a tracker of their own starts from.
      participantObjectIds:
        - object.tracker-adapter
      expectedRealWorldDuration:
        class: under-1s
        explanation: >
          The file is written from text the tool already holds. The work of
          filling it in is the author's, and no part of the interaction.
    - interactionId: interaction.answer-through-formula-provider
      name: Answer through a formula management provider
      description: >
        dotdiw asks a registered provider what it answers, for its formulas,
        for one of them, or to create one, and the provider answers as it
        declares.
      participantObjectIds:
        - object.formula
        - object.formula-management-provider
      expectedRealWorldDuration:
        class: mixed
        explanation: >
          A file system answers in the same breath; an API endpoint in its
          network's time.
  invariants:
    - invariantId: invariant.work-starts-named
      name: Work starts named
      statement: >
        In an adopted project every task and subtask begins with dotdiw
        create. Nothing else is the first act.
      rationale: >
        The declared moment is the only hook discovery has. Where work may
        begin elsewhere, nothing surfaces.
      severity: critical
      objectIds:
        - object.work
      interactionIds:
        - interaction.start-work
      enforcedByStepIds:
        - step.name-the-work
      guardedByAntiTraceIds:
        - antitrace.procedure-poured-unnamed
    - invariantId: invariant.only-committed-formulas-are-held
      name: Only committed formulas are held
      statement: >
        A formula the project holds is one git tracks. An uncommitted formula
        is one person's: local storage finds it on that person's file system,
        where matching and listing reach it, and check names it as one nobody
        else can see.
        A file of this repository that a formula names under verify-using is
        held the same way.
      rationale: >
        A procedure is available to everyone by being part of the project,
        not by anyone's local setup.
      severity: critical
      objectIds:
        - object.formula
      interactionIds:
        - interaction.write-procedure
        - interaction.check-discoverability
      enforcedByStepIds:
        - step.commit-formula
      guardedByAntiTraceIds:
        - antitrace.formula-held-by-one-person
        - antitrace.proved-by-what-is-gone
    - invariantId: invariant.every-formula-finds-itself
      name: Every formula finds itself
      statement: >
        Every formula the project holds is reachable from each of its own
        examples, with the example removed from the index while it is
        searched for.
      rationale: >
        A procedure nobody can reach is not held. The examples are where a
        project fixes the words.
      severity: high
      objectIds:
        - object.formula
      interactionIds:
        - interaction.check-discoverability
      enforcedByStepIds:
        - step.describe-and-check
      guardedByAntiTraceIds:
        - antitrace.coincidence-surfaces
    - invariantId: invariant.nothing-outside-the-repository
      name: Nothing outside the repository
      statement: >
        Adoption and use leave nothing in the repository but the formulas and
        the declaration. Everything the tracker keeps lives under the user's
        home in a directory of dotdiw's own name, keyed to the checkout, and
        the one other thing changed on the machine -- a tracker's usage-metrics
        setting, turned off where it has one -- is said. Nothing of the
        tracker's enters git.
      rationale: >
        v0.1.0 passed on a hook override and a Dolt remote without saying so;
        every version before 0.4.0 left the tracker's state in the tree. What
        a tool does on somebody's behalf must be stated, and what is the
        project's must be only what the project shares on purpose.
      severity: critical
      objectIds:
        - object.repository
      interactionIds:
        - interaction.adopt-repository
      enforcedByStepIds:
        - step.adopt-repository
        - step.undo-earlier-adoption
        - step.turn-metrics-off
      guardedByAntiTraceIds:
        - antitrace.adoption-reached-outside
    - invariantId: invariant.tool-never-commits
      name: The tool never commits
      statement: >
        dotdiw never commits, pushes or syncs. The formula commit is the
        worker's act, which the project asks for.
      rationale: >
        A commit is the worker's to make and a push publishes; neither is a
        tool's to decide.
      severity: critical
      objectIds:
        - object.formula
        - object.repository
      interactionIds:
        - interaction.write-procedure
        - interaction.adopt-repository
      enforcedByStepIds:
        - step.report-what-is-yours-to-commit
      guardedByAntiTraceIds:
        - antitrace.adoption-reached-outside
    - invariantId: invariant.one-name-for-all-four
      name: One name for all four
      statement: >
        Everything the tracker does is reachable under dotdiw's name. An
        adapter's name appears only where the worker chose or asked for it:
        the list of adapters, the choice of one, the tracker line of the
        version reported, the refusal of a name the worker gave, a line saying
        what is wrong with the adapter a checkout chose, how to install it among
        them, and the one notice that a choice was written for a checkout adopted before
        there was one to make. No other notice, no error and no file
        written for agents names an adapter or the product behind it;
        adapters return records and dotdiw says what it has to say. The one
        stream that passes through
        is a forwarded command's, under the beads adapter, with the word bd
        rewritten; what that product's own report says of itself passes
        through, and its name survives inside the names of its own things
        on the machine -- its config file, its state directory, its variable.
      rationale: >
        A worker who did not choose a tracker has one tool to learn, and the
        files agents read teach that name; a worker who chose beads or jira
        by name may be told that name back.
      severity: high
      objectIds:
        - object.tracker-command
        - object.conventions
      interactionIds:
        - interaction.forward-command
      enforcedByStepIds:
        - step.forward-to-the-tracker
        - step.declare-conventions
      guardedByAntiTraceIds:
        - antitrace.tracker-named-itself
    - invariantId: invariant.notice-stops-when-written
      name: The notice stops when the procedure is written
      statement: >
        A procedure carried out by hand is named as undeclared until a formula
        reaches its title, and from that moment it is not named again.
      rationale: >
        A notice that keeps firing after it was acted on teaches people to
        ignore it; one that stops is the confirmation that writing it down
        worked.
      severity: medium
      objectIds:
        - object.formula
      interactionIds:
        - interaction.check-discoverability
      enforcedByStepIds:
        - step.notice-handmade-procedures
      guardedByAntiTraceIds:
        - antitrace.formulas-moved-to-the-trackers-directory
    - invariantId: invariant.one-door
      name: One door
      statement: >
        Every operation is invoked through the one door generated from the
        operation IDL into dotdiw, by its id and with a request: the request is
        held to its type on the way in and the response to its own on the way
        out, and a key outside either is refused as the project's mistake. A
        body neither reaches a terminal nor reads a field its type does not
        declare; what the worker sees and what the witness log records come
        from the typed response, after the body returns. The one stream no
        response carries is the tracker's own, which the forward passes
        through with the worker's terminal.
      rationale: >
        A body bound to the IDL in name only can read what its type never
        declared and print what no response carries, and nothing would notice.
        Through one door the types are the contract, every transport runs the
        same bodies, and the program is held to the IDL from its source. No
        step enforces this; the promise tests do, by regenerating the door's
        table from the IDL and reading dotdiw's source.
      severity: high
      objectIds:
        - object.work
        - object.formula
        - object.molecule
        - object.repository
        - object.conventions
        - object.tracker-command
        - object.tracker
        - object.tracker-adapter
      interactionIds:
        - interaction.start-work
        - interaction.pour-procedure
        - interaction.write-procedure
        - interaction.check-discoverability
        - interaction.adopt-repository
        - interaction.run-any-command
        - interaction.forward-command
        - interaction.find-procedure
        - interaction.learn
        - interaction.answer-through-adapter
        - interaction.choose-tracker
        - interaction.move-workspace
        - interaction.ship-tracker
      enforcedByStepIds: []
      guardedByAntiTraceIds: []
    - invariantId: invariant.one-tracker-door
      name: One tracker door
      statement: >
        A body reaches a tracker only through the inner door, by the
        operation's id, with the request and the response held to their
        types. The adapter that answers is the one the request names, else
        the workspace's, else local. An adapter returns records: it never
        writes to the terminal, prompts, or reads it, and nothing it holds
        is made in the repository's tree. The answer is held to its type down
        to the values: a record's fields, each item of a list, the values of
        an enum, and a completed answer holds the record its callers read. An
        exit code left out is read from the status, and one against the status
        is outside the interface. A loaded adapter that raises, exits, or answers
        outside the interface, is a failed response naming it and the operation
        in one line; a module that
        declares an interface this tool does not support is refused when it
        loads, in one line that names it; a shipped adapter's mistake is the
        project's, and raises.
      rationale: >
        Swapping the tracker per request is safe only when nothing but the
        door knows which adapter answered, and when no adapter can print its
        own prose past the presenter -- or its traceback, which is prose
        about the adapter and not about the worker's situation.
      severity: high
      objectIds:
        - object.tracker
        - object.tracker-adapter
        - object.work
        - object.molecule
      interactionIds:
        - interaction.answer-through-adapter
        - interaction.choose-tracker
        - interaction.move-workspace
        - interaction.ship-tracker
      enforcedByStepIds: []
      guardedByAntiTraceIds: []
    - invariantId: invariant.the-prover-uses-the-means
      name: The prover uses the means
      statement: >
        dotdiw shows the means to prove a run, after the pour and with the root
        in the tracker, and checks that each is well formed. Running a command,
        reading a file and opening a link are the acts of whoever proves the
        run.
      rationale: >
        A formula is a file that anyone who commits may change. Whoever proves
        the run chooses what runs on their machine.
      severity: critical
      objectIds:
        - object.formula
        - object.molecule
      interactionIds:
        - interaction.pour-procedure
        - interaction.check-discoverability
      enforcedByStepIds:
        - step.pour-procedure
        - step.describe-and-check
      guardedByAntiTraceIds: []
    - invariantId: invariant.every-provider-formula-carries-its-suffix
      name: Every provider's formula carries its suffix
      statement: >
        Every formula from a registered provider carries the provider's name as
        a suffix, after a hyphen. A formula without one is in local storage.
      rationale: >
        The suffix keeps two providers' formulas, and a provider's and local
        storage's, apart when they share an id.
      severity: critical
      objectIds:
        - object.formula
        - object.formula-management-provider
      interactionIds:
        - interaction.answer-through-formula-provider
      enforcedByStepIds:
        - step.register-provider
        - step.list-provider-formulas
      guardedByAntiTraceIds: []
    - invariantId: invariant.formula-storage-apart-from-task-storage
      name: Formula storage apart from task storage
      statement: >
        Nothing about a formula's provider reaches a pour or a tracker.
      rationale: >
        Where formulas are kept and where work is tracked are chosen and
        changed apart.
      severity: high
      objectIds:
        - object.formula-management-provider
        - object.formula
      interactionIds:
        - interaction.answer-through-formula-provider
      enforcedByStepIds:
        - step.list-provider-formulas
        - step.show-provider-formula
      guardedByAntiTraceIds: []
  networkBoundaries:
    - boundaryId: boundary.create-to-match
      name: Create to match
      description: >
        The title and the formulas that apply to it are one invocation.
      interactionId: interaction.start-work
      realWorldProcess: Someone types what they are about to do and reads what applies.
      realWorldLatencyClass: under-1s
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: >
        A match printed after the work began is a runbook nobody opened. The
        match must come back in the same breath as the title.
      userVisibleImpact: The applying formulas appear under the created work item, immediately.
    - boundaryId: boundary.dotdiw-to-tracker
      name: dotdiw to the tracker
      description: >
        dotdiw reaches the tracker through an adapter behind the inner door:
        a store in its own process, the tracker binary as a local subprocess,
        or a hosted tracker over its network. Typed records cross; a
        forwarded command's stream crosses only under the beads adapter.
      interactionId: interaction.answer-through-adapter
      realWorldProcess: A pour becomes one tracker issue per step.
      realWorldLatencyClass: mixed
      separationAllowed: true
      consistencyExpectation: read-your-writes
      causalityJustification: >
        The acknowledgement is immediate; creating the issues is the
        tracker's work and may take longer than a second.
      userVisibleImpact: The poured steps are visible in the tracker once the pour returns.
    - boundaryId: boundary.check-to-report
      name: Check to report
      description: A local search over the project's own text, reported at once.
      interactionId: interaction.check-discoverability
      realWorldProcess: The project asks whether its formulas can be found.
      realWorldLatencyClass: under-1s
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: >
        The answer is computed from files already on disk; nothing justifies
        waiting for it.
      userVisibleImpact: One line per formula that cannot be found, or one line saying all can.
    - boundaryId: boundary.repository-to-remote
      name: Repository to remote
      description: >
        A formula reaches other people the way every other file does: by
        being committed, pushed and pulled.
      interactionId: interaction.write-procedure
      realWorldProcess: A committed formula is shared through git.
      realWorldLatencyClass: over-or-equal-1s
      separationAllowed: true
      consistencyExpectation: eventual
      causalityJustification: >
        Sharing is git's. dotdiw adds nothing of its own, so the formula is
        held by the project when git holds it.
      userVisibleImpact: Everyone's next create can reach the formula once they have pulled it.
    - boundaryId: boundary.adoption
      name: Adoption
      description: >
        One command, run once, on one machine, for one checkout -- a key in
        its .git/config, a tracker under the home, the declaration in its tree.
      interactionId: interaction.adopt-repository
      realWorldProcess: A repository is given tracking under the home and the two conventions in its tree.
      realWorldLatencyClass: over-or-equal-1s
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: >
        Adoption is local and complete when the command returns; nothing of it
        happens elsewhere or later.
      userVisibleImpact: >
        Two files in the repository, which are the worker's to commit, and one
        directory under the home, ~/.dotdiw/<key>.
    - boundaryId: boundary.run-any-command
      name: Run any command
      description: >
        The housekeeping around a command happens in the same process, before
        or after it, on this machine.
      interactionId: interaction.run-any-command
      realWorldProcess: A config file and a git setting are read; one small write where something needs undoing.
      realWorldLatencyClass: under-1s
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: >
        Metrics must be off before the first tracker command of the run, and a hook
        override must be gone before the worker's next commit; neither can be
        deferred past the command it precedes.
      userVisibleImpact: Nothing, except a notice the first time something was turned off or undone.
    - boundaryId: boundary.command-to-tracker
      name: Command to tracker
      description: >
        A command the worker typed reaches the tracker: the interface's own
        are answered by the chosen adapter; under beads any other reaches the
        binary as a local subprocess and its output comes back through
        dotdiw's rewrite.
      interactionId: interaction.forward-command
      realWorldProcess: The tracker runs the command; dotdiw streams the answer back without the tracker's name.
      realWorldLatencyClass: mixed
      separationAllowed: true
      consistencyExpectation: read-your-writes
      causalityJustification: >
        dotdiw owns only the spawn and the stream; the tracker's own latency
        is whatever it is, from a list to an init.
      userVisibleImpact: The tracker's answer, under dotdiw's name, with interactive prompts still working.
    - boundaryId: boundary.list-to-answer
      name: List to answer
      description: The project's formulas are found on the file system and read from disk, answered at once.
      interactionId: interaction.find-procedure
      realWorldProcess: Someone asks what the project holds, or names a formula by id.
      realWorldLatencyClass: under-1s
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: >
        The answer is a walk of the tree and a few small files; nothing
        justifies waiting for it or asking anything outside the repository.
      userVisibleImpact: The formulas the project holds, with their paths, or one formula's text.
    - boundaryId: boundary.provider-to-answer
      name: Provider to answer
      description: A registered provider lists its formulas, asked once per process, and shows one when it is shown or poured.
      interactionId: interaction.find-procedure
      realWorldProcess: A file system or an API endpoint answers list and show.
      realWorldLatencyClass: mixed
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: >
        dotdiw waits for each provider's answer, asked once per process. A
        provider takes what its store takes, a directory read or a call to an
        endpoint, and how fresh its formulas are across processes is its own.
      userVisibleImpact: The provider's formulas beside the local ones, or one line naming a provider left out of the run.
    - boundaryId: boundary.learn-to-text
      name: Learn to text
      description: The teaching text is compiled into the tool and printed.
      interactionId: interaction.learn
      realWorldProcess: Someone reads how work gets done here.
      realWorldLatencyClass: under-1s
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: There is nothing to wait for; the text is in the binary.
      userVisibleImpact: The four capabilities and the two conventions, in full.
    - boundaryId: boundary.new-to-file
      name: New to file
      description: The starting file for a tracker is written from text compiled into the tool.
      interactionId: interaction.ship-tracker
      realWorldProcess: Someone starts a tracker of their own.
      realWorldLatencyClass: under-1s
      separationAllowed: false
      consistencyExpectation: strong
      causalityJustification: There is nothing to wait for; the text is in the tool, and the file is small.
      userVisibleImpact: The path written, and the check to run next.
  # Object Lifecycle Contracts. lifecycle.work and lifecycle.formula mirror
  # ../praxis.yaml, which owns them; lifecycle.molecule and lifecycle.repository
  # are POA-internal, for the objects the tool itself moves. Operations bind to
  # the transitions below, and poa check refuses an operation that performs a
  # transition no contract declares lawful.
  objectLifecycleContracts:
    - lifecycleContractId: lifecycle.work
      title: A piece of work
      objectId: object.work
      objectName: Work
      purpose: >
        Govern how a piece of work may pass from intended to done: named first,
        then the surfaced procedure poured, then its steps closed.
      praxisDutyRefs:
        - duty.name-the-work-first
        - duty.read-what-surfaces
      invariantRefs:
        - invariant.work-starts-named
      states:
        - stateId: intended
          meaning: Someone is about to do it. Nothing has been named.
        - stateId: named
          meaning: dotdiw create ran with a title; the work item exists and the applying formulas were printed.
        - stateId: procedure-poured
          meaning: A formula that surfaced was poured as tracked steps.
        - stateId: done
          meaning: The steps are closed and the work item with them.
      transitions:
        - transitionId: transition.work-intended-to-named
          fromState: intended
          toState: named
          lawfulWhen: The create is the first act of the work.
          authorizedBy:
            - duty.name-the-work-first
          requiredProof:
            - The invocation log shows dotdiw create as the first dotdiw command for this work, and bd shows the issue it created.
          betrayalRisk: The issue is created with bd create directly, so the work looks named while nothing was matched.
        - transitionId: transition.work-named-to-procedure-poured
          fromState: named
          toState: procedure-poured
          lawfulWhen: The poured formula is one the create printed.
          authorizedBy:
            - duty.read-what-surfaces
          requiredProof:
            - The molecule's formula id appears in the create's output.
          betrayalRisk: A procedure is poured from memory that never surfaced, so the surfacing looks to have worked.
        - transitionId: transition.work-procedure-poured-to-done
          fromState: procedure-poured
          toState: done
          lawfulWhen: Every step of the molecule is closed in an order its needs allow.
          authorizedBy:
            - duty.read-what-surfaces
          requiredProof:
            - bd shows each step closed, none before the steps it needs.
          betrayalRisk: Steps are closed in one batch at the end, so the tracking shows a procedure followed that was not.
      forbiddenTransitions:
        - fromState: intended
          toState: done
          reason: Finished work that nobody named. Discovery never had its moment.
        - fromState: intended
          toState: procedure-poured
          reason: A procedure poured for work that was never named.
      poaBindings:
        - operationId: operation.name-the-work
          transitionIds:
            - transition.work-intended-to-named
        - operationId: operation.pour-procedure
          transitionIds:
            - transition.work-named-to-procedure-poured
      cescWitnessExpectations:
        - storyRef: cesc.named-work-found-its-procedure
          mustWitness: "One work item: named, a formula surfaced for it, that formula poured, its steps closed."
          allowedStatuses:
            - valid
            - caveated
      status: draft
    - lifecycleContractId: lifecycle.formula
      title: A formula
      objectId: object.formula
      objectName: Formula
      purpose: >
        Govern how a procedure passes from something done by hand to something
        the project holds and can reach.
      praxisDutyRefs:
        - duty.write-it-down-when-you-repeat
        - duty.describe-to-be-found
        - duty.commit-the-formula
      invariantRefs:
        - invariant.only-committed-formulas-are-held
        - invariant.every-formula-finds-itself
      states:
        - stateId: repeated
          meaning: The procedure exists only as something done by hand, more than once.
        - stateId: written
          meaning: A formula file exists, next to what it is about, uncommitted, and is found on its holder's file system alone.
        - stateId: findable
          meaning: dotdiw check finds the formula from each of its own examples.
        - stateId: held
          meaning: The formula is committed. The project holds it.
      transitions:
        - transitionId: transition.formula-repeated-to-written
          fromState: repeated
          toState: written
          lawfulWhen: The bearer noticed the repetition and wrote steps and needs, not prose.
          authorizedBy:
            - duty.write-it-down-when-you-repeat
          requiredProof:
            - A formula file exists next to what it is about, with a description, examples and steps.
          betrayalRisk: The procedure is written as a runbook in prose, which nothing can match or pour.
        - transitionId: transition.formula-written-to-findable
          fromState: written
          toState: findable
          lawfulWhen: The description and examples use the words people use for the work.
          authorizedBy:
            - duty.describe-to-be-found
          requiredProof:
            - dotdiw check reports the formula found by each of its examples.
          betrayalRisk: Examples that restate the formula's name find it in the test and fail every real title.
        - transitionId: transition.formula-findable-to-held
          fromState: findable
          toState: held
          lawfulWhen: The formula file is committed, on its own, as the last step of writing it.
          authorizedBy:
            - duty.commit-the-formula
          requiredProof:
            - git lists the formula, and dotdiw check no longer reports it as uncommitted.
          betrayalRisk: The formula is used from one checkout and believed shared.
      forbiddenTransitions:
        - fromState: repeated
          toState: held
          reason: Nothing was written. There is nothing to commit.
        - fromState: written
          toState: held
          reason: Committed before it found itself. The project holds a procedure nobody can reach, whatever git says.
      poaBindings:
        - operationId: operation.write-formula
          transitionIds:
            - transition.formula-repeated-to-written
        - operationId: operation.describe-and-check
          transitionIds:
            - transition.formula-written-to-findable
        - operationId: operation.commit-formula
          transitionIds:
            - transition.formula-findable-to-held
      cescWitnessExpectations: []
      status: draft
    - lifecycleContractId: lifecycle.molecule
      title: A poured procedure
      objectId: object.molecule
      objectName: Molecule
      purpose: Govern how a poured formula comes to exist and completes; POA-internal.
      praxisDutyRefs:
        - duty.read-what-surfaces
      states:
        - stateId: poured
          meaning: One tracker issue per step, each of kind task, exists under a root of kind root that names the formula.
        - stateId: complete
          meaning: Every step is closed and the root with it.
      transitions:
        - transitionId: transition.molecule-none-to-poured
          fromState: none
          toState: poured
          lawfulWhen: A formula that surfaced for named work is poured.
          authorizedBy:
            - duty.surface-procedures-when-work-starts
          requiredProof:
            - One tracker issue per step, each blocked by the steps it needs, under a root naming the formula.
          betrayalRisk: Steps created without their needs, so nothing enforces the order.
        - transitionId: transition.molecule-poured-to-complete
          fromState: poured
          toState: complete
          lawfulWhen: Every step is closed in an order its needs allow.
          authorizedBy:
            - duty.surface-procedures-when-work-starts
          requiredProof:
            - The tracker shows each step closed after the steps it needed.
          betrayalRisk: Steps closed in one batch at the end.
      poaBindings:
        - operationId: operation.pour-procedure
          transitionIds:
            - transition.molecule-none-to-poured
      cescWitnessExpectations:
        - storyRef: cesc.named-work-found-its-procedure
          mustWitness: The poured molecule's formula is one that surfaced, and its steps close after it was poured.
          allowedStatuses:
            - valid
            - caveated
      status: draft
    - lifecycleContractId: lifecycle.repository
      title: A repository
      objectId: object.repository
      objectName: Repository
      purpose: Govern what adoption may do to a repository, and what an earlier adoption must be put back from; POA-internal.
      praxisDutyRefs: []
      invariantRefs:
        - invariant.nothing-outside-the-repository
      states:
        - stateId: unadopted
          meaning: No tracking and no conventions.
        - stateId: adopted
          meaning: Keyed in .git/config to a tracker under the home with no hooks and no remote; nothing of the tracker's in the tree; conventions declared; nothing outside the repository changed unsaid.
        - stateId: carrying-earlier-adoption
          meaning: The tracker in the tree, as every version before 0.4.0 left it -- committed by 0.2.x, excluded by 0.3.0, and under v0.1.0 with a core.hooksPath into .beads and a Dolt remote at the git remote.
      transitions:
        - transitionId: transition.repository-unadopted-to-adopted
          fromState: unadopted
          toState: adopted
          lawfulWhen: dotdiw init runs once, in a git repository, on a machine where Day 0 happened.
          authorizedBy:
            - duty.adopt-without-reaching-outside
          requiredProof:
            - The key in .git/config; the tracker under the home at that key, with no remote; nothing of the tracker's in the tree; core.hooksPath unset; the conventions declared; the declaration files listed as the worker's.
          betrayalRisk: bd init passed through in its default mode, as under v0.1.0 and 0.2.x, committing its own files into the repository.
        - transitionId: transition.repository-carrying-earlier-adoption-to-adopted
          fromState: carrying-earlier-adoption
          toState: adopted
          lawfulWhen: Any dotdiw command runs in the repository.
          authorizedBy:
            - duty.adopt-without-reaching-outside
          requiredProof:
            - What was put right is printed once, naming who did it; core.hooksPath is unset; the key is in .git/config and a tracker with the old prefix is under the home; the in-tree copy is byte for byte as it was and the command that removes it was printed.
          betrayalRisk: The repair is silent, blames an earlier version for what the tracker did in this run, or carries tasks over by half and lets the worker believe the history is whole.
      forbiddenTransitions:
        - fromState: unadopted
          toState: carrying-earlier-adoption
          reason: 0.2.x never creates what it undoes.
      poaBindings:
        - operationId: operation.adopt-repository
          transitionIds:
            - transition.repository-unadopted-to-adopted
        - operationId: operation.undo-earlier-adoption
          transitionIds:
            - transition.repository-carrying-earlier-adoption-to-adopted
      cescWitnessExpectations: []
      status: draft
    - lifecycleContractId: lifecycle.conventions
      title: The conventions
      objectId: object.conventions
      objectName: Conventions
      purpose: >
        Govern how the declaration of where work starts comes to be in the
        files agents read, and comes back after the tracker rewrites them;
        POA-internal.
      praxisDutyRefs: []
      invariantRefs:
        - invariant.one-name-for-all-four
      states:
        - stateId: undeclared
          meaning: CLAUDE.md or AGENTS.md does not carry the declaration, or carries bd's name, because it was never written or because bd rewrote the file.
        - stateId: declared
          meaning: Both files carry the declaration between its markers, name dotdiw and not bd, and let the formula commit through bd's git policy.
      transitions:
        - transitionId: transition.conventions-undeclared-to-declared
          fromState: undeclared
          toState: declared
          lawfulWhen: dotdiw init runs, or any dotdiw create finds the files rewritten by the tracker.
          authorizedBy:
            - duty.adopt-without-reaching-outside
          requiredProof:
            - Both files carry the markers and name dotdiw; the files changed are printed.
          betrayalRisk: The declaration is written once and bd's next rewrite removes it unnoticed, so new arrivals read a project that says nothing about where work starts.
      forbiddenTransitions: []
      poaBindings:
        - operationId: operation.declare-conventions
          transitionIds:
            - transition.conventions-undeclared-to-declared
      cescWitnessExpectations: []
      status: draft
    - lifecycleContractId: lifecycle.tracker
      title: A tracker
      objectId: object.tracker
      objectName: Tracker
      purpose: Govern how a workspace's tracker comes to be open behind the inner door; POA-internal.
      praxisDutyRefs: []
      invariantRefs:
        - invariant.one-tracker-door
      states:
        - stateId: unopened
          meaning: The adapter that would answer has no store for the workspace's key.
        - stateId: open
          meaning: The adapter has a store for the key and answers every operation of the interface for it.
      transitions:
        - transitionId: transition.tracker-unopened-to-open
          fromState: unopened
          toState: open
          lawfulWhen: A repository is adopted, or a workspace is moved onto an adapter that has no store for it yet.
          authorizedBy:
            - duty.put-all-four-under-one-name
          requiredProof:
            - A store under the keyed directory for a local adapter, or the adapter's own for a hosted one; the first create answered.
          betrayalRisk: A store made in the repository's tree.
      forbiddenTransitions: []
      poaBindings:
        - operationId: operation.open-tracker
          transitionIds:
            - transition.tracker-unopened-to-open
      cescWitnessExpectations: []
      status: draft
    - lifecycleContractId: lifecycle.tracker-adapter
      title: A tracker adapter
      objectId: object.tracker-adapter
      objectName: Tracker adapter
      purpose: Govern how an adapter comes to answer for a workspace; POA-internal.
      praxisDutyRefs: []
      invariantRefs:
        - invariant.one-tracker-door
        - invariant.one-name-for-all-four
      states:
        - stateId: registered
          meaning: Known to the registry under its name, shipped or loaded from the home, its table complete.
        - stateId: chosen
          meaning: Named in the checkout's config as the workspace's, or named by the request being answered.
      transitions:
        - transitionId: transition.tracker-adapter-registered-to-chosen
          fromState: registered
          toState: chosen
          lawfulWhen: dotdiw init --tracker or dotdiw tracker use names it, or a request carries its name.
          authorizedBy:
            - duty.put-all-four-under-one-name
          requiredProof:
            - The name in dotdiw.tracker, or on the request; the next operation answered by it.
          betrayalRisk: A name that is not registered accepted into the config, so every later command fails.
      forbiddenTransitions: []
      poaBindings:
        - operationId: operation.use-tracker
          transitionIds:
            - transition.tracker-adapter-registered-to-chosen
      cescWitnessExpectations: []
      status: draft

    - lifecycleContractId: lifecycle.formula-management-provider
      title: A formula management provider
      objectId: object.formula-management-provider
      objectName: Formula management provider
      purpose: >
        Govern how a formula management provider comes to serve its formulas
        under a name.
      praxisDutyRefs:
        - duty.register-a-provider-under-its-name
        - duty.migrate-a-clashing-local-formula
      invariantRefs:
        - invariant.every-provider-formula-carries-its-suffix
      states:
        - stateId: eligible
          meaning: A package that provides it is installed.
        - stateId: registered
          meaning: It is registered under an alphanumeric name, and its formulas carry the name as a suffix.
      transitions:
        - transitionId: transition.provider-eligible-to-registered
          fromState: eligible
          toState: registered
          lawfulWhen: Someone registers the provider under an alphanumeric name, and every local formula whose id reads like one of its suffixed ids has migrated.
          authorizedBy:
            - duty.register-a-provider-under-its-name
          requiredProof:
            - Every formula of the provider surfaces under the name as a suffix.
          betrayalRisk: A local formula and a provider's formula read as one id, and one is followed for the other.
        - transitionId: transition.provider-registered-to-eligible
          fromState: registered
          toState: eligible
          lawfulWhen: Someone removes the registration by the provider's name; its package stays installed.
          authorizedBy:
            - duty.register-a-provider-under-its-name
          requiredProof:
            - The provider is no longer listed, and none of its formulas surface.
          betrayalRisk: A removed provider's formulas still surface, from a list kept from before.
      forbiddenTransitions: []
      poaBindings:
        - operationId: operation.register-provider
          transitionIds:
            - transition.provider-eligible-to-registered
        - operationId: operation.remove-provider
          transitionIds:
            - transition.provider-registered-to-eligible
      cescWitnessExpectations: []
      status: draft
objectives:
  - objectiveId: objective.procedures-surface-when-work-starts
    title: Procedures surface when work starts
    description: >
      Whoever starts a piece of work is shown the procedure that applies,
      without searching for it or knowing it exists.
    successMeaning: >
      A formula written once reaches everyone who later does that work,
      including those who were not there when it was written.
  - objectiveId: objective.one-name-for-all-four
    title: One name for all four
    description: >
      Declaration, management, sharing and discovery under one command, so no
      task ever requires typing the tracker's own name.
    successMeaning: A worker never has to know which tracker is underneath.

duties:
  - dutyId: duty.surface-procedures-when-work-starts
    title: Surface procedures when work starts
    intent: >
      Make the declared moment the place where the applying formulas appear,
      and let the chosen one become tracked steps.
    scope: >
      Covers creating the work item, matching the title against the
      formulas in local storage and from the registered providers, printing
      the ones that apply, and pouring one,
      its means to prove the run kept with the root and shown after the
      pour; and what rides along with every create because the tracker
      rewrites the files agents read -- the conventions re-declared,
      procedures built by hand noticed, the conventions check run quietly.
    nonGoals:
      - Enforcing that a surfaced formula is followed.
      - Surfacing anything for work that began some other way.
    criticality: critical
    status: active
    objectiveIds:
      - objective.procedures-surface-when-work-starts
    primaryJourneyIds:
      - journey.start-named-work
    usesRealWorldObjectIds:
      - object.work
      - object.formula
      - object.molecule
    usesRealWorldInteractionIds:
      - interaction.start-work
      - interaction.pour-procedure
    invariantIds:
      - invariant.work-starts-named
    version: 0.3.0
  - dutyId: duty.keep-procedures-findable
    title: Keep procedures findable
    intent: >
      Let a procedure be written where it belongs, checked against the words
      people use, and held by the project.
    scope: >
      Covers formula new, the description and examples, dotdiw check, which
      also holds the means to prove a run to being well formed, and the
      commit that makes the project hold it; noticing a procedure the project
      carried out by hand and never declared, and a memory that reads like a
      procedure; and answering about the project's formulas -- listing them,
      showing one, resolving an id to the file it lives in -- where the tracker
      would answer about its own directories.
    nonGoals:
      - Matching prose runbooks.
      - Registering formulas anywhere; the suffix and git are the registry.
    criticality: critical
    status: active
    objectiveIds:
      - objective.procedures-surface-when-work-starts
      - objective.one-name-for-all-four
    primaryJourneyIds:
      - journey.write-a-procedure-down
      - journey.find-a-held-procedure
    usesRealWorldObjectIds:
      - object.formula
    usesRealWorldInteractionIds:
      - interaction.write-procedure
      - interaction.check-discoverability
      - interaction.find-procedure
    invariantIds:
      - invariant.only-committed-formulas-are-held
      - invariant.every-formula-finds-itself
      - invariant.notice-stops-when-written
    version: 0.3.0
  - dutyId: duty.adopt-without-reaching-outside
    title: Adopt without reaching outside
    intent: >
      Give a repository tracking and the two conventions in one command, and
      change nothing outside it that is not said.
    scope: >
      Covers init with the tracker under the home keyed to the checkout,
      declaring the conventions, renaming the tracker in files an earlier
      version's tracker wrote, naming the declaration files as the worker's to
      commit, putting right what an earlier version left and naming the
      command for what is the worker's to remove, and turning the tracker's
      metrics off where it has any.
    nonGoals:
      - Installing hooks, remotes or anything per project.
      - Committing on the worker's behalf.
    criticality: critical
    status: active
    objectiveIds:
      - objective.one-name-for-all-four
    primaryJourneyIds:
