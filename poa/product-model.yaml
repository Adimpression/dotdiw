  - stepId: step.match-formulas
    journeyId: journey.start-named-work
    sequence: 2
    title: Match formulas
    given: The work has just been named, and formulas are in local storage or served by a registered provider.
    when: The title is ranked against every formula's description, examples and path, with the project's own text as the background.
    then: The formulas accounting for at least 0.15 of what is distinctive about the title are printed, best first, with their paths and the command to pour one.
    thenAssertions:
      - Only formulas in local storage or from a registered provider can appear, each provider formula under its suffixed id.
      - Silence is printed when nothing crosses the threshold.
      - The match is in the same invocation as the create.
      - The command printed to pour the first resolves to that formula -- its id, or its path when its id carries a provider's suffix, is shared, or would be read as an option, from ./ when the path would be read as one too -- quoted for the shell it is copied into.
