        kept to its bytes; a third, for Jira Cloud, is loaded by name from the
        home and proved against a stub. Four operations list, choose, check
        and migrate. Migration plan: a workspace adopted by an earlier version
        is pinned to beads by its first command and told so once; nothing a
        worker who chose nothing sees changes, and under beads the same twenty
        commands print the same bytes; dotdiw tracker migrate moves a
