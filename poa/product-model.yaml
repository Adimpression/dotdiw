        - name: passed
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: "For check."
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - tracker-unknown
              - adapter-failed
              - no-check-target
              - not-a-repository
              - key-not-written
              - no-such-file
              - bad-name
              - shipped-name
              - not-installed
          required: false
          summary: "Why the operation failed, when it did."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
  - journeyId: journey.move-a-workspace
    dutyId: duty.put-all-four-under-one-name
    title: Move a workspace between trackers
    description: >
      Everything a workspace holds in one adapter is written into another, and the source is left as it was.
    purpose: "Changing trackers loses nothing: items, statuses, reasons and needs cross over."
    trigger: A workspace on one adapter is wanted on another.
    preconditions:
      - Both adapters are registered.
      - The target has, or can open, a store for the workspace.
    primaryFlow:
      - dotdiw tracker migrate <from> <to> lists everything in the source.
      - Open items are created in the target, then closed ones with their reasons, then the needs.
      - Ids are kept where the target accepts them; otherwise the mapping is recorded in the target's meta.
    completionCriteria:
      - Every item of the source exists in the target with its status, reason and needs.
      - The source is unchanged.
      - Run again, nothing changes.
    variants:
      - The target already holds some of the items, which are left alone.
    failureBoundaries:
      - A target that refuses an item stops the move with the item named; what was written stays, and the next run continues.
    nonGoals:
      - Keeping two trackers in step afterwards.
    inputObjectIds:
      - object.tracker
      - object.work
    outputObjectIds:
      - object.tracker
      - object.work
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
    stepIds:
      - step.migrate-workspace
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: over-or-equal-1s
      syncExpectation: synchronous
      causalJustification: >
        One item at a time through two adapters; the command runs to completion and reports the count.
    networkBoundaryIds:
      - boundary.dotdiw-to-tracker
    status: active
    version: 0.6.0
    operation:
      visibility: external-facing
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: fromTracker
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The adapter holding the work."
        - name: toTracker
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The adapter to write it into."
      responseFields:
        - name: moved
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: resumed
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            Items an earlier run made, whose needs, status or close this run
            finished.
        - name: mapped
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: mappingPath
          valueType:
            kind: scalar
            scalar: string
          required: false
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - tracker-unknown
              - adapter-failed
              - same-tracker
              - item-refused
          required: false
          summary: "Why the operation failed, when it did."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: assigneesLeft
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            How many of the source's items have an assignee; assignees do not
            carry over.
  - journeyId: journey.ship-a-tracker
    dutyId: duty.put-all-four-under-one-name
    title: Ship a tracker
    description: >
      Someone writes a tracker adapter of their own and ships it so that others install it by name.
    purpose: Let someone write a tracker dotdiw does not ship, check it, and publish it as a package others can install.
    trigger: Someone wants dotdiw to work on a tracker it does not ship.
    preconditions:
      - dotdiw is installed.
    primaryFlow:
      - dotdiw tracker new <name> writes the file to start from.
      - dotdiw tracker check ./<name>.py says which operations are left to answer.
      - A package named dotdiw-tracker-<name> installs the file under share/dotdiw/trackers.
    completionCriteria:
      - The file passes every operation of the scenario.
      - dotdiw tracker list shows it from where the package put it.
    variants:
      - The file is copied to ~/.dotdiw/trackers with no package; that directory is looked in first.
    failureBoundaries:
      - A name with anything but lowercase letters, digits and hyphens, the name of a built-in adapter, or a file that exists is refused and nothing is written.
    nonGoals:
      - A registry of trackers; dotdiw reads no package's name.
      - A repository choosing an adapter; a clone cannot make dotdiw run its code.
    inputObjectIds:
      - object.tracker-adapter
    outputObjectIds:
      - object.tracker-adapter
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
    stepIds:
