              - shipped-name
              - exists
              - unwritable
          required: false
          summary: "Why the operation failed, when it did."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false

  - journeyId: journey.answer-through-a-formula-provider
    dutyId: duty.keep-procedures-findable
    title: Answer through a formula management provider
    description: >
      dotdiw reaches the formulas a registered provider keeps, behind the formula management abstraction, through what the provider declares it answers.
    purpose: A procedure kept on a file system or behind an API endpoint surfaces and pours as one kept in local storage does.
    trigger: A body of dotdiw needs the formulas a provider keeps, or someone hooks a provider in.
    preconditions:
      - A package that provides the provider is installed, which makes it eligible.
    primaryFlow:
      - Someone registers the eligible provider under an alphanumeric name.
      - The provider declares which of list, show and create it answers.
      - Its formulas are listed and shown under its name as a suffix, and created through it where it can.
    completionCriteria:
      - Every formula from the provider carries its suffix.
      - Nothing about the provider reached a pour or a tracker.
    variants:
      - The provider offers discovery only, and nothing is created through it.
    failureBoundaries:
      - A local formula whose id reads like the provider's suffixed id migrates.
      - A registration whose module is gone or fails is listed as unavailable, with why.
    nonGoals:
      - Keeping a formula's history, which is the provider's concern; local storage keeps none.
      - Anything about task storage.
    inputObjectIds:
      - object.formula-management-provider
    outputObjectIds:
      - object.formula
    invariantIds:
      - invariant.every-provider-formula-carries-its-suffix
      - invariant.formula-storage-apart-from-task-storage
    stepIds:
      - step.register-provider
      - step.describe-provider
      - step.list-provider-formulas
      - step.show-provider-formula
      - step.create-provider-formula
      - step.remove-provider
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: mixed
      syncExpectation: mixed
      causalJustification: >
        A file system answers in the same breath and an API endpoint in its network's time; how fresh a provider's formulas are is left to the design.
    networkBoundaryIds: []
    status: active
    operation:
      visibility: external-facing
      calls:
        - operationId: operation.register-provider
          callPurpose: "Register a provider, for the register action."
          required: true
          failurePropagation: propagate
        - operationId: operation.remove-provider
          callPurpose: "Remove a provider, for the remove action."
          required: true
          failurePropagation: propagate
        - operationId: operation.describe-provider
          callPurpose: "Describe every registered provider, for the list action."
          required: true
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The checkout, where a local formula that clashes is found."
        - name: action
          valueType:
            kind: enum-inline
            values:
              - register
              - list
              - remove
          required: true
          summary: "What is asked of the providers."
        - name: name
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The provider's registered name, letters and digits."
        - name: module
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The provider module a package installed, by its name."
        - name: location
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "Where the provider keeps its formulas: a directory or a URL."
      responseFields:
        - name: provider
          valueType:
            kind: type-ref
            typeId: type.formula-provider
          required: false
          summary: "The provider registered or removed."
        - name: providers
          valueType:
            kind: list
            itemType:
              kind: type-ref
              typeId: type.formula-provider
          required: false
          summary: "Every registered provider, with what it answers."
          cardinality: many
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - name-not-alphanumeric
              - name-taken
              - module-not-found
              - not-a-provider
              - lacks-list-or-show
              - clashing-local-formula
              - provider-unknown
              - provider-failed
          required: false
          summary: "Why nothing was registered or removed."
        - name: clashing
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            Local formulas whose ids read like the provider's suffixed ids.
          cardinality: many
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: "The process exit code the command line ends with."
steps:
  - stepId: step.name-the-work
    journeyId: journey.start-named-work
    sequence: 1
    title: Name the work
    given: An adopted repository, and someone about to do a piece of work.
    when: They run dotdiw create with a title in their own words.
    then: A work item is created under that title, and it is the first thing that has happened to the work.
    thenAssertions:
      - The work item exists in the tracker with the title given.
      - No branch, file or other command preceded it for this work.
