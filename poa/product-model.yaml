      responseFields:
        - name: renamed
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: "Files in which bd was renamed."
          cardinality: many
        - name: declared
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: "Files that gained or regained the declaration."
          cardinality: many
        - name: changed
          valueType:
            kind: list
            itemType:
              kind: scalar
              scalar: string
          required: false
          summary: >-
            renamed and declared together, each file once, in that order: what
            ReportWhatIsYoursToCommit is handed.
          cardinality: many
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
            tracker or the operation failed.
  - stepId: step.report-what-is-yours-to-commit
    journeyId: journey.adopt-a-repository
    sequence: 3
    title: Report what is yours to commit
    given: init wrote or changed the declaration files; the tracker committed nothing.
    when: init finishes.
    then: The declaration files are listed as the worker's to commit, with the one command that commits them, so that every clone reads the declaration. The one command that removes a tracker an earlier version left in the tree is named by the account of what init put right.
    thenAssertions:
      - dotdiw made no commit and changed no index.
      - Every file dotdiw wrote or changed is in the list, and nothing else is.
      - Running the printed command leaves the tree clean.
    relatedObjectIds:
      - object.repository
    relatedInteractionIds:
      - interaction.adopt-repository
    relatedInvariantIds:
      - invariant.one-door
      - invariant.tool-never-commits
    expectedUserVisibleOutcome: A list of files and one git command.
    status: active
    operation:
      kind: query
      idempotency:
        idempotencyClass: query-only
        explanation: >-
          Observes and prints; changes nothing in the project or the tracker.
      derivedFrom:
        - sourceKind: manual-decision
          sourceRef: step.report-what-is-yours-to-commit
