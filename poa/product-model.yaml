  - stepId: step.pour-procedure
    journeyId: journey.start-named-work
    sequence: 3
    title: Pour the procedure
    given: A formula surfaced for the named work.
    when: The worker runs dotdiw formula pour with that formula.
    then: One tracked issue per step is created under a root, each blocked by the steps it needs.
    thenAssertions:
      - dotdiw mol pour, the older spelling, does the same and prints the same.
      - A step cannot be closed before the steps it needs.
      - The root names the formula it was poured from.
      - The formula is read once, by the lookup that selects it, and the tracker is handed what that reading parsed -- its title, its description, its means to prove and its steps -- so that the formula asked for is the one poured, whatever is written to its file meanwhile, and the next pour reads it again; no file goes to the tracker, none is read again, and nothing is written under the workspace for it.
      - An id refused as ambiguous, as a provider's formula the provider does not serve, or for a provider that failed, never reaches the tracker.
      - The formula's verify-using goes to the tracker with the root and is shown after the pour.
      - A formula whose steps share an id is refused before the tracker is asked.
      - With --json, a pour that made its root and then failed prints the record of what it made -- the root and the steps -- as JSON, says why in one line on stderr, and exits 1.
