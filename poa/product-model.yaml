    createdAt: "2026-11-01T00:00:00+08:00"
  - changeId: change.name-what-the-program-already-does
    changeType: model-update
    targetRefs:
      - model.dotdiw
      - duty.put-all-four-under-one-name
      - duty.teach-without-a-project
      - journey.run-a-tracker-command
      - journey.find-a-held-procedure
      - journey.learn-the-conventions
    summary: >
      Name the behaviour dotdiw 0.2.1 already has and the first model did
      not: forwarding to beads with the name rewritten, declaring the
      conventions on init and after every create, noticing procedures built by
      hand, the nudge on remember, formula list and show, resolving an id to
      its file, indexing the project, and learn.
    reason: >
      Every one of these was reachable from the command line and traced to
      nothing, so the operation algebra described about half the program. The
      single-implementation and no-private-helper laws cannot be checked
      against behaviour the model does not name.
    compatibility: additive
    impactAssessment:
      affectedDuties:
        - duty.surface-procedures-when-work-starts
        - duty.keep-procedures-findable
        - duty.adopt-without-reaching-outside
        - duty.put-all-four-under-one-name
        - duty.teach-without-a-project
      affectedJourneys:
        - journey.start-named-work
        - journey.write-a-procedure-down
        - journey.adopt-a-repository
        - journey.run-a-tracker-command
        - journey.find-a-held-procedure
        - journey.learn-the-conventions
      affectedSlos: []
      affectedTraces:
        - trace.handmade-procedure-noticed
        - trace.doctor-carried-the-check
        - trace.formula-list-answered-about-the-project
        - trace.day-one-read-learn
        - antitrace.tracker-named-itself
        - antitrace.formulas-moved-to-the-trackers-directory
      affectedInvariants:
        - invariant.one-name-for-all-four
        - invariant.notice-stops-when-written
      riskLevel: medium
      riskExplanation: Nothing the program does changes; what the model says about it grows to match.
    migrationPlan: null
    approvalStatus: draft
    createdAt: "2026-11-01T12:00:00+08:00"
  - changeId: change.housekeeping-is-under-one-second
    changeType: model-update
    targetRefs:
      - step.undo-earlier-adoption
      - step.turn-metrics-off
      - step.declare-conventions
      - interaction.run-any-command
      - boundary.run-any-command
    summary: >
      Undoing an earlier adoption and turning bd's metrics off run before every
      command in well under a second; they inherited over-or-equal-1s from the
      adoption interaction. They, and re-declaring the conventions, now follow
      interaction.run-any-command, under-1s, with a boundary that forbids
      separating them from the command they precede.
    reason: >
      Timing claims are measured, not argued. A step that may not be deferred
      past the command it precedes cannot be classed as one that may run
      asynchronously.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.adopt-a-repository
      affectedSlos: []
      affectedTraces: []
      affectedInvariants:
        - invariant.nothing-outside-the-repository
      riskLevel: low
      riskExplanation: A stricter timing class on steps that already meet it.
    migrationPlan: null
    approvalStatus: draft
    createdAt: "2026-11-01T12:00:00+08:00"
  - changeId: change.init-leaves-git-alone
    changeType: model-update
    targetRefs:
      - step.adopt-repository
      - step.report-what-is-yours-to-commit
      - step.undo-earlier-adoption
      - journey.adopt-a-repository
      - lifecycle.repository
    summary: >
      init runs the tracker in its stealth mode: bd commits nothing, writes
      nothing for agents, configures no remote, and keeps .beads/ local to the
      checkout. The report names dotdiw's declaration files as the worker's to
      commit; the undo step names the one command for repositories where an
      earlier version let bd commit, and says who did what it undid.
    reason: >
      bd's stealth mode commits nothing. 0.2.0 and 0.2.1 used the default
      init, declined the hooks, removed the sync remote afterwards and
      reported the files left modified; the report did not include the file
      the removal changed, and the notice described the removal as undoing an
      earlier version's work. The step's assertion that every edited file was
      listed did not hold.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.adopt-a-repository
      affectedSlos:
        - slo.adoption-leaves-nothing-outside
      affectedTraces:
        - trace.adoption-left-nothing-outside
        - antitrace.adoption-reached-outside
      affectedInvariants:
        - invariant.nothing-outside-the-repository
        - invariant.tool-never-commits
      riskLevel: medium
      riskExplanation: >
        New adoptions change shape; adoptions by 0.1.x and 0.2.x keep working
        and are told one command, which dotdiw never runs for them.
    migrationPlan: >
      For a repository adopted before 0.3.0: every run writes the stealth
      exclude lines into .git/info/exclude; init, check, doctor and lint print
      "git rm -r --cached .beads && git commit" until it is done; clones that
      pull that commit run dotdiw init once. Nothing is deleted and nothing is
      done on the worker's behalf.
    approvalStatus: draft
    createdAt: "2026-11-01T18:30:00+08:00"
  - changeId: change.tracker-state-leaves-the-repository
    changeType: model-update
    targetRefs:
      - object.repository
      - step.adopt-repository
      - step.undo-earlier-adoption
      - journey.adopt-a-repository
      - invariant.nothing-outside-the-repository
      - lifecycle.repository
    summary: >
      The tracker's state leaves the repository: it lives under the user's
      home in ~/.dotdiw/<key>, keyed to the checkout by one line in its
      .git/config, told to bd through BEADS_DIR, with stealth, hooks and agent
      files declined. The repository holds only the formulas and the
      declaration. A repository adopted earlier is adopted under the home by
      its first command, keeping its prefix; its tasks are not carried over.
    reason: >
      Every version before 0.4.0 kept bd's state in the working tree, where it
      needed an exclude, a check for leftovers and an explanation in every
      notice, and where a clone could never use it anyway. Under the home it
      is keyed to the checkout, survives a move, is shared by worktrees, and
      is nobody else's.
    compatibility: corrective
    impactAssessment:
      affectedDuties:
        - duty.adopt-without-reaching-outside
      affectedJourneys:
        - journey.adopt-a-repository
      affectedSlos:
        - slo.adoption-leaves-nothing-outside
      affectedTraces:
        - trace.adoption-left-nothing-outside
        - trace.upgrade-was-one-command
        - antitrace.adoption-reached-outside
      affectedInvariants:
        - invariant.nothing-outside-the-repository
      riskLevel: medium
      riskExplanation: >
        New adoptions change shape; adoptions by earlier versions are upgraded
        by their first command and lose their task history, which clients are
        told before they upgrade.
    migrationPlan: >
      Clients close their tasks before upgrading and are told the history is
      not carried over. After brew upgrade, the first dotdiw command in a
      repository adopted earlier writes the key, makes the tracker under the
      home with the old prefix, says so once, and names the one command that
      removes the in-tree copy -- git rm -r -q .beads && git commit && rm -rf
      .beads .beads.gate.lock where it was committed, rm -rf .beads
      .beads.gate.lock where it was not. dotdiw runs neither. A fresh clone
      runs dotdiw init once.
    approvalStatus: draft
    createdAt: "2026-11-01T21:00:00+08:00"

openQuestions:
  - questionId: question.hundreds-of-formulas
    question: >
      The threshold of 0.15 was calibrated on three to fifty-six formulas.
      What do retrieval and silence look like at the hundreds this is for?
    blocksChange: false
    neededFrom: measurement
    targetRefs:
      - step.match-formulas
      - slo.applicable-formula-surfaces
    decisionNeeded:
      - clarify-timing
      - other
    candidateResolutions:
      - Keep 0.15 and the bm25 ordering until a project with hundreds of committed formulas is measured; the witness log now records every match and every silence, so the measurement can come from use rather than from a built fixture.
      - Raise the floor at scale if coincidences cost more than a glance there.
      - Rank against competitors rather than a constant, which outlier.py showed does not recover silence at the sizes measured.
    recommendedDefault: >
      Kept open on 2026-11-01, consciously: the first candidate, until a
      project of that size is witnessed. Not blocking.
  - questionId: question.enforcing-the-declared-moment
    question: >
      Should a project be able to tell, per piece of work, that it began
      unnamed, or does that cross from showing into enforcing?
    blocksChange: false
    neededFrom: product-owner
    targetRefs:
      - duty.surface-procedures-when-work-starts
      - invariant.work-starts-named
    decisionNeeded:
      - clarify-product-boundary
    candidateResolutions:
      - dotdiw keeps showing and never enforces; a story the contract calls incomplete because a pour had no naming is the project's to read, in its own witness log, and nothing more.
      - A project may opt in to a notice on pour when no create preceded it in the log, which is still showing.
      - A project may refuse the pour, which is enforcing and is boundary.only-the-declared-moment crossed.
    recommendedDefault: >
      Kept open on 2026-11-01, consciously: the first candidate stands until
      the product owner decides otherwise; the second is the furthest this
      product's boundaries allow. Not blocking.
