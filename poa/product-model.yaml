            themselves.
        - name: fromTracker
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The adapter holding the work."
        - name: toTracker
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The adapter to write it into."
      responseFields:
