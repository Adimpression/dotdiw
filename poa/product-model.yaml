  - stepId: step.adopt-repository
    journeyId: journey.adopt-a-repository
    sequence: 1
    title: Adopt the repository
    given: A repository with no tracking, on a machine where Day 0 happened.
    when: Someone runs dotdiw init in a git repository that has no tracker yet.
    then: A key is written into the checkout's own .git/config and the tracker is initialised under the user's home, in a directory of that key, in its stealth mode with hooks and agent files declined. Nothing of the tracker's is in the repository; where an earlier version's tracker sits in the tree, its prefix is kept.
    thenAssertions:
      - The tracker made no commit; git log is as it was; nothing of the tracker's is in the tree.
      - The key is in .git/config and the state is under the home at that key, with no sync remote.
      - core.hooksPath is not set.
      - Outside a git repository init refuses with exit code 2 and creates nothing; in an adopted repository it says so and initialises nothing.
      - A tracker that does not open stops the adoption. What it said is shown, no choice is written and nothing is declared.
      - Where the tracker checked who it acts as, init names them once; a name anyone could give is not shown.
    relatedObjectIds:
      - object.repository
    relatedInteractionIds:
      - interaction.adopt-repository
    relatedInvariantIds:
      - invariant.one-door
      - invariant.nothing-outside-the-repository
    expectedUserVisibleOutcome: The repository is adopted.
    status: active
    stateTransitions:
      - objectId: object.repository
        fromState: unadopted
        toState: adopted
    operation:
      calls:
        - operationId: operation.open-tracker
          callPurpose: >-
            Open the tracker under the key through the tracker door, with the
            prefix init was given.
          required: true
          failurePropagation: propagate
        - operationId: operation.describe-tracker
          callPurpose: >-
            Who the tracker acts as, once it has opened, for the one line init
            says it in.
          required: false
          failurePropagation: propagate
      externalCalls:
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --is-inside-work-tree"
          callPurpose: >-
            Outside a git repository init refuses: there is no .git/config to
            key from, and the tracker's own init would run git init on the
            worker's behalf.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.workspace"
          callPurpose: >-
            The key this checkout is tied to, read with --local so that
            worktrees share it and a global value never leaks in.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local dotdiw.workspace"
          callPurpose: >-
            The key is written once into the checkout's own .git/config, never
            into the tree.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.tracker"
          callPurpose: >-
            The workspace's adapter, read through the tracker door on this
            body's behalf when the request names none.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --show-toplevel"
          callPurpose: >-
            The checkout, when the request carries no root, for the tracker
            door to read the workspace's adapter from.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::config --local dotdiw.tracker"
          callPurpose: >-
            The adapter chosen, written once into the checkout's own
            .git/config beside the key, never into the tree.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --show-toplevel"
          callPurpose: >-
            The checkout, for the tracker door to resolve the adapter from,
            when a request carries no root.
          failurePropagation: propagate
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: quiet
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Run the tracker's init without its output on the terminal; the
            undo step asks for this when it adopts a repository an earlier
            version left.
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, the shipped
            default. The command line fills it from --tracker or
            DOTDIW_TRACKER and nothing else does; a journey hands it to its
            steps.
        - name: prefix
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The prefix the tracker's ids begin with, where the adapter honours one;
            from --prefix or -p.
      responseFields:
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
        - name: workspace
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "~/.dotdiw/<key>, where this checkout's tracker lives."
        - name: created
          valueType:
            kind: scalar
            scalar: boolean
          required: false
          summary: >-
            Whether this call made the tracker, as opposed to finding it
            already there.
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - not-a-repository
              - key-not-written
              - workspace-not-made
              - init-failed
              - not-installed
              - no-workspace
              - store-unwritable
              - tracker-unknown
              - adapter-failed
          required: false
          summary: "Why the repository was not adopted, when it was not."
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter the repository is adopted under, written as
            dotdiw.tracker beside the key.
        - name: actor
          valueType:
            kind: type-ref
            typeId: type.tracker-actor
          required: false
          summary: >-
            Who the tracker acts as, where it was opened here and the adapter
            can say.
  - stepId: step.declare-conventions
    journeyId: journey.adopt-a-repository
    sequence: 2
    title: Declare the conventions
    given: The instruction files may not exist yet, or were written by the tracker under an earlier version, naming it and saying nothing about where work starts.
    when: init finishes, and again after every create, because an earlier version's tracker writes those files again on setup, doctor --fix and upgrades.
    then: The tracker is renamed to dotdiw in every file an earlier version's tracker wrote for agents, the declaration of where work starts and where procedures live is written between its markers in CLAUDE.md and AGENTS.md, and the tracker's own git policy in those files is given the one exception the project asks for -- committing a formula.
    thenAssertions:
      - CLAUDE.md and AGENTS.md say where work starts, between the markers, and name dotdiw.
      - A file that already carries the declaration is left byte-for-byte alone.
      - The files changed are named.
    relatedObjectIds:
      - object.conventions
    relatedInteractionIds:
      - interaction.run-any-command
    relatedInvariantIds:
      - invariant.one-door
      - invariant.one-name-for-all-four
    expectedUserVisibleOutcome: How many files now name dotdiw, and the files declared in, or nothing when nothing changed.
    status: active
    stateTransitions:
      - objectId: object.conventions
        fromState: undeclared
        toState: declared
    operation:
      calls: []
      externalCalls: []
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: announce
          valueType:
            kind: enum-inline
            values:
              - init
              - create
          required: false
          summary: >-
            Which journey is declaring. init announces every file renamed and
