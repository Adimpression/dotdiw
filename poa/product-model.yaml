        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The formula file the worker should commit."
      responseFields:
        - name: command
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The git command the worker runs; dotdiw never runs it."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
          summary: >-
            What the command line exits with for this response: 0 unless the
