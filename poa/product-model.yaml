  - stepId: step.migrate-workspace
    journeyId: journey.move-a-workspace
    sequence: 1
    title: Move a workspace's work to another adapter
    given: Two registered adapters, the source holding the workspace's work.
    when: dotdiw tracker migrate <from> <to> runs.
    then: Open items, then closed ones with their reasons, then the needs are written into the target.
    thenAssertions:
      - The source is unchanged.
      - Ids are kept where the target accepts them, else a mapping is recorded under the workspace.
      - Run twice, the second run changes nothing.
      - A write the target refuses, an item, a need, a status or a close, fails the move and names it; what was written stays recorded.
      - The next run makes only the items not yet made, and finishes the needs, statuses and closes of those an earlier run left.
      - Assignees do not carry over, and the move says how many items had one.
      - Each item is read whole with show-item, and its description and verify-using move with it exactly as given; a root's arrive on the task it becomes, and a second move carries them again.
      - A root moves as a task; how migrate copies a root is question.how-migrate-copies-a-root.
