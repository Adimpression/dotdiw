  - changeId: change.the-means-kept-as-data
    changeType: model-update
    targetRefs:
      - step.pour-steps
      - step.create-item
      - step.show-item
      - step.forward-to-the-tracker
      - step.undo-earlier-adoption
    summary: >
      From 3.0.0, the trackers dotdiw ships keep the means to prove a run as
      data: the local store in a column of its own, at schema 2, and beads in
      the issue's metadata. Descriptions are kept and returned exactly as
      given, and a description typed through the pass-through reaches bd as
      typed. A store an earlier version kept, with the means as the last
      section of a description, is brought up to date by its adapter's
      upgrade extra, which init applies once, taking up an upgrade cut short
      where it stopped; every other command says so until then. An issue an
      earlier version left with dotdiw in its metadata as a value of its own,
      null included, keeps it, and its description as it was.
    reason: >
      The local store is dotdiw's own and the beads issue has metadata, yet
      both kept the means inside the description text, which meant an empty
      section appended to any description that looked like it held one, and
      every description typed through the pass-through rewritten the same way.
