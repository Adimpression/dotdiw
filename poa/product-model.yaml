  - journeyId: journey.answer-through-the-tracker
    dutyId: duty.put-all-four-under-one-name
    title: Answer through the chosen tracker
    description: >
      A body asks the tracker for something and the chosen adapter answers, through the inner door, in typed records.
    purpose: Every tracker operation has one door, and the adapter behind it can be swapped per request.
    trigger: A body of dotdiw needs the tracker.
    preconditions:
      - The repository is adopted and its workspace has a key.
      - The adapter that would answer is registered.
    primaryFlow:
      - The request names an adapter, or the workspace's key does, or local answers.
      - The door holds the request to its type and calls the adapter's callable for the operation.
      - The adapter answers with records, which the door holds to the response type.
    completionCriteria:
      - The response is the operation's, whichever adapter answered.
      - Nothing was printed by the adapter.
    variants:
      - The adapter has no store for the workspace yet and opens one first.
    failureBoundaries:
      - A request naming an adapter that is not registered fails with the registered names.
    nonGoals:
      - Choosing an adapter for the worker.
    inputObjectIds:
      - object.tracker-adapter
      - object.work
    outputObjectIds:
      - object.tracker
      - object.work
      - object.molecule
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
    stepIds:
      - step.open-tracker
      - step.describe-tracker
      - step.create-item
      - step.add-need
      - step.pour-steps
      - step.close-item
      - step.show-item
      - step.list-items
      - step.update-item
      - step.ready-items
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: mixed
      syncExpectation: mixed
      causalJustification: >
        The local store answers in the same breath; the beads adapter in the tracker process's time; a hosted tracker in its network's.
    networkBoundaryIds:
      - boundary.dotdiw-to-tracker
    status: active
    version: 0.6.0
    operation:
      visibility: internal-only
      externalCalls:
        - dependencyId: dependency.git
          operationRef: "product.git::config --local --get dotdiw.tracker"
          callPurpose: >-
            The workspace's adapter, read with --local like the key, when the
            request names none.
          failurePropagation: propagate
        - dependencyId: dependency.git
          operationRef: "product.git::rev-parse --show-toplevel"
          callPurpose: >-
            The checkout, when the request carries no root, to read the
            workspace's adapter from.
          failurePropagation: propagate
      requestFields:
        - name: operation
          valueType:
            kind: scalar
            scalar: string
          required: true
          summary: "The tracker operation's id."
        - name: request
          valueType:
            kind: map
            keyType:
              kind: scalar
              scalar: string
            valueType:
              kind: scalar
              scalar: string
          required: false
          summary: "That operation's request."
        - name: tracker
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The adapter to answer, by its registered name; unsaid, the
            workspace's dotdiw.tracker answers, and unsaid there, local.
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
      responseFields:
        - name: response
          valueType:
            kind: map
            keyType:
              kind: scalar
              scalar: string
            valueType:
              kind: scalar
              scalar: string
          required: false
          summary: "That operation's response, as the inner door held it."
        - name: reason
          valueType:
            kind: enum-inline
            values:
              - operation-not-of-the-tracker
              - tracker-unknown
              - adapter-failed
          required: false
          summary: "Why the operation failed, when it did."
        - name: exitCode
          valueType:
            kind: scalar
            scalar: integer
          required: false
  - journeyId: journey.choose-a-tracker
    dutyId: duty.put-all-four-under-one-name
    title: Choose a tracker
    description: >
      Someone sees which adapters are registered, makes one the workspace's, or checks one against the suite that defines an adapter.
    purpose: A tracker is chosen in the open, by name, and proven before it is trusted.
    trigger: Someone wants a workspace on a tracker other than the default, or wants to know which it is on.
    preconditions:
      - The repository is adopted.
    primaryFlow:
      - dotdiw tracker list prints each registered adapter, its version, and which the workspace uses.
      - dotdiw tracker use <name> writes dotdiw.tracker into the checkout's config and opens the store.
      - dotdiw tracker check <name> runs the conformance suite against the adapter's declared target.
    completionCriteria:
      - The workspace's config names a registered adapter.
      - A checked adapter passed every operation, or the failing one is named.
    variants:
      - init --tracker <name> chooses at adoption.
      - dotdiw tracker check <path> proves a file that is not installed.
    failureBoundaries:
      - A name that is not registered is refused with the registered names and nothing is written.
    nonGoals:
      - Installing a hosted tracker's credentials; the adapter reads its own.
    inputObjectIds:
      - object.tracker-adapter
      - object.repository
    outputObjectIds:
      - object.tracker-adapter
      - object.tracker
    invariantIds:
      - invariant.one-door
      - invariant.one-tracker-door
      - invariant.one-name-for-all-four
    stepIds:
      - step.list-trackers
      - step.use-tracker
      - step.check-tracker
    sliIds: []
    sloIds: []
    goldenTraceIds: []
    antiGoldenTraceIds: []
    timing:
      realWorldLatencyClass: mixed
      syncExpectation: synchronous
      causalJustification: >
        Listing and choosing are a line in the checkout's config and answer at once; a check runs the whole suite and takes what the adapter takes.
    networkBoundaryIds:
      - boundary.dotdiw-to-tracker
    status: active
    version: 0.6.0
    operation:
      visibility: external-facing
      requestFields:
        - name: root
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            The repository the interface resolved; bodies never ask git for it
            themselves.
        - name: action
          valueType:
            kind: enum-inline
            values:
              - list
              - use
              - check
          required: true
          summary: "What dotdiw tracker was asked to do."
        - name: name
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: "The adapter, for use and check."
        - name: path
          valueType:
            kind: scalar
            scalar: string
          required: false
          summary: >-
            A file to load and check, when it is not installed; name is then
