      - object.formula
    relatedInteractionIds:
      - interaction.check-discoverability
    relatedInvariantIds:
      - invariant.one-door
      - invariant.every-formula-finds-itself
      - invariant.the-prover-uses-the-means
    expectedUserVisibleOutcome: One line per failing example, or one line saying every formula is discoverable.
