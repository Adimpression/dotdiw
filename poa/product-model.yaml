  antiGolden:
    - traceId: antitrace.procedure-poured-unnamed
      traceType: anti-golden
      title: A procedure poured for work nobody named
      description: A molecule is poured and its steps closed, but no create ever ran for the work.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: Someone pours a formula they remember, straight from the tracker.
      trigger: dotdiw mol pour without a preceding dotdiw create.
      events:
        - sequence: 1
          title: Poured unnamed
          event: A molecule exists for work that was never named.
          stateBefore: The work is intended.
          stateAfter: A procedure is poured.
          observedOutcome: Discovery never had its moment; whatever else applied was never shown.
          relatedStepIds:
            - step.name-the-work
            - step.pour-procedure
      finalState: Work proceeds by memory under the appearance of a tracked procedure.
      violatesStepIds:
        - step.name-the-work
      violatesInvariantIds:
        - invariant.work-starts-named
      classificationReason: The declared moment was skipped.
      status: active
    - traceId: antitrace.poured-what-never-surfaced
      traceType: anti-golden
      title: Poured what never surfaced
      description: Work was named and one formula surfaced, but a different formula was poured.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: The worker ignores the surfaced formula and pours one from memory.
      trigger: dotdiw mol pour with a formula the create did not print.
      events:
        - sequence: 1
          title: Named and surfaced
          event: create prints formula A.
          observedOutcome: A is in front of the worker.
          relatedStepIds:
            - step.name-the-work
            - step.match-formulas
        - sequence: 2
          title: Poured B
          event: Formula B is poured.
          observedOutcome: The tracking shows a procedure followed; the surfaced one was not.
          relatedStepIds:
            - step.pour-procedure
      finalState: The surfacing looks to have worked and did not.
      violatesStepIds:
        - step.pour-procedure
      violatesInvariantIds:
        - invariant.work-starts-named
      classificationReason: The procedure that applied was shown and not the one followed.
      status: active
    - traceId: antitrace.create-both-surfaced-and-silent
      traceType: anti-golden
      title: One create both surfaced a formula and reported silence
      description: >
        The log for one work item carries both formula_surfaced and
        nothing_surfaced from its create. No single run of match_formulas can
        write both; a log that holds both was written by two processes for one
        id, or by a defect. The contract refuses it as conflicted rather than
        choosing a side.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: A log that contradicts itself about what the worker was shown.
      trigger: Two writers, or a defect in the one body that matches.
      events:
        - sequence: 1
          title: Contradiction
          event: formula_surfaced and nothing_surfaced for the same workId.
          observedOutcome: Nobody can say from the log whether discovery fired.
          relatedStepIds:
            - step.match-formulas
      finalState: The story is conflicted and no report may claim discovery fired for it.
      violatesStepIds:
        - step.match-formulas
      violatesInvariantIds:
        - invariant.every-formula-finds-itself
      classificationReason: Silence and a match are each evidence; both at once is evidence of nothing.
      status: active
    - traceId: antitrace.coincidence-surfaces
      traceType: anti-golden
      title: A coincidence surfaces
      description: >
        A title about turning bd's metrics off surfaces the retrieval
        threshold sweep and the add-a-domain formula, on the word metrics.
      dutyId: duty.surface-procedures-when-work-starts
      journeyId: journey.start-named-work
      scenario: dotdiw create "Turn bd's usage metrics off on every run" in this repository, 2026-11-01.
      trigger: Two measurement formulas share the title's distinctive word.
      events:
        - sequence: 1
          title: Wrong match
          event: sweep-retrieval-threshold and add-domain-trial-matrix are printed.
          observedOutcome: A glance, then nothing poured.
          relatedStepIds:
            - step.match-formulas
      finalState: Nothing was followed that did not apply, at the cost of a glance.
      violatesStepIds:
        - step.match-formulas
      violatesInvariantIds:
        - invariant.every-formula-finds-itself
      violatesSloIds:
        - slo.applicable-formula-surfaces
      classificationReason: >
        The chosen trade: a coincidence costs a glance, silence would cost
        the mechanism. Recorded so the cost is visible.
      status: active
    - traceId: antitrace.formula-held-by-one-person
      traceType: anti-golden
      title: A formula held by one person
      description: A formula is written and used from one checkout and never committed.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.write-a-procedure-down
      scenario: The author believes the project has a procedure.
      trigger: dotdiw check in any other checkout.
      events:
        - sequence: 1
          title: Not held
          event: check in the author's checkout reports the formula as uncommitted; elsewhere it does not exist.
          stateBefore: Findable in one checkout.
          stateAfter: Still held by nobody but the author.
          observedOutcome: Nobody else's create can reach it.
          relatedStepIds:
            - step.commit-formula
      finalState: Sharing is counterfeited.
      violatesStepIds:
        - step.commit-formula
      violatesInvariantIds:
        - invariant.only-committed-formulas-are-held
      violatesSloIds:
        - slo.every-formula-finds-itself
      classificationReason: The project does not hold what git does not hold.
      status: active
    - traceId: antitrace.adoption-reached-outside
      traceType: anti-golden
      title: Adoption reached outside the repository
      description: >
        v0.1.0 passed bd init through unchanged: core.hooksPath set to an
        absolute path into .beads, a Dolt remote aimed at the git remote, and
        telemetry left on, none of it said. Under 0.2.0 and 0.2.1 bd
        committed its own files during init; the sync remote was then removed
        from .beads/config.yaml, and that file was not in the list of files
        reported as left uncommitted.
      dutyId: duty.adopt-without-reaching-outside
      journeyId: journey.adopt-a-repository
      scenario: Clients ran dotdiw init in October 2026.
      trigger: dotdiw init under v0.1.0.
      events:
        - sequence: 1
          title: Hooks overridden
          event: core.hooksPath points at .beads/hooks; hooks added later to .git/hooks are skipped.
          observedOutcome: Commits in between did not see those hooks.
          relatedStepIds:
            - step.adopt-repository
        - sequence: 2
          title: Database aimed at the repository
          event: A Dolt remote at the git remote; a push puts the issue database into the repository as refs/dolt/data and a branch.
          observedOutcome: Plaintext issue content in a git repository, growing with its history.
          relatedStepIds:
            - step.adopt-repository
        - sequence: 3
          title: The tracker's files committed, one of them then changed
          event: Under 0.2.0 and 0.2.1 bd committed fourteen files during init; the sync block was then removed from .beads/config.yaml, the report of what was left uncommitted did not list that file, and the notice described the removal as undoing an earlier version's work.
          observedOutcome: A diff in a file bd committed, with no line in the report naming it. bd's stealth mode commits nothing.
          relatedStepIds:
            - step.adopt-repository
            - step.report-what-is-yours-to-commit
            - step.undo-earlier-adoption
        - sequence: 4
          title: The tracker's state in the tree
          event: Under 0.3.0 the tracker stayed in the working tree, local and excluded, with an exclude to maintain, a leftover check, and a line of explanation in every notice.
          observedOutcome: The repository carried state that was never the project's; 0.4.0 moves it under the home.
          relatedStepIds:
            - step.adopt-repository
      finalState: Repositories changed in ways their owners were not told about.
      violatesStepIds:
        - step.adopt-repository
        - step.undo-earlier-adoption
      violatesInvariantIds:
        - invariant.nothing-outside-the-repository
      violatesSloIds:
        - slo.adoption-leaves-nothing-outside
      classificationReason: What a tool does on somebody's behalf must be stated. It was not.
      status: active
    - traceId: antitrace.tracker-named-itself
      traceType: anti-golden
      title: The tracker named itself
      description: >
        Under 0.1.x, --version forwarded to bd and rewrote bd's name in the
        answer, so dotdiw reported another tool's version as its own; and the
        files bd wrote for agents kept naming bd, which the stream rewrite never
        reached.
      dutyId: duty.put-all-four-under-one-name
      journeyId: journey.run-a-tracker-command
      scenario: dotdiw --version, and an agent reading CLAUDE.md after init, under 0.1.x.
      trigger: The rewrite was applied to the stream and nowhere else.
      events:
        - sequence: 1
          title: Wrong version
          event: dotdiw --version printed bd's version string with bd renamed.
          observedOutcome: A tool reporting a version it does not have.
          relatedStepIds:
            - step.forward-to-beads
        - sequence: 2
          title: Wrong name in the files
          event: AGENTS.md and CLAUDE.md, written by bd, told agents to run bd.
          observedOutcome: Agents learned the name the project was trying not to teach.
          relatedStepIds:
            - step.declare-conventions
      finalState: Two names for the same thing, in the one place that was supposed to have one.
      violatesStepIds:
        - step.forward-to-beads
        - step.declare-conventions
      violatesInvariantIds:
        - invariant.one-name-for-all-four
      classificationReason: Fixed in 0.2.0 by owning --version and renaming in the files; recorded as the shape of the failure.
      status: active
    - traceId: antitrace.formulas-moved-to-the-trackers-directory
      traceType: anti-golden
      title: Formulas moved to the tracker's directory
      description: >
        bd's own formula list answers about .beads/formulas and says No
        formulas found in a project whose formulas sit next to what they are
        about. Every agent in the trial believed it and moved the formulas.
      dutyId: duty.keep-procedures-findable
      journeyId: journey.find-a-held-procedure
      scenario: An agent asks what the project holds and gets the tracker's answer.
      trigger: formula list forwarded to bd unchanged.
      events:
        - sequence: 1
          title: Told nothing is held
          event: No formulas found.
          observedOutcome: The agent moves every formula into .beads/formulas, away from what it is about.
          relatedStepIds:
            - step.list-formulas
      finalState: The convention that a formula lives next to its work is undone by the tool meant to serve it.
      violatesStepIds:
        - step.list-formulas
      violatesInvariantIds:
        - invariant.only-committed-formulas-are-held
        - invariant.notice-stops-when-written
      classificationReason: The question was about the project and the answer was about two directories.
      status: active

