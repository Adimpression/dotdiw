schemaVersion: 3.0.0
productId: product.dotdiw
name: dotdiw
status: active
signal: >
  A project's instructions open with one line -- start every task with
  `dotdiw create "<what you are about to do>"` -- and the command answers a
  title with the procedures the project holds that apply to it.
promise: >
  When work starts by being named, the procedure that applies to it surfaces
  to whoever is starting, person or agent, before the work begins. They did
  not search for it and did not need to know it existed.
reliedUponBy:
  - subjectId: subject.worker
    name: Whoever starts a piece of work in the project
    reliance: >
      Starts by naming the work and trusts that what applies will be shown,
      rather than reading every runbook first.
  - subjectId: subject.procedure-author
    name: Whoever wrote a procedure down
    reliance: >
      Writes the procedure once, as a formula next to what it is about, and
      trusts it will reach everyone who later does that work -- including the
      people and agents who were not there when it was written.
  - subjectId: subject.provider-author
    name: Whoever writes a formula management provider
    reliance: >
      Ships the provider as a package and trusts dotdiw to reach its formulas
      only through what the provider declares it answers: list, show and,
      where it can, create.
  - subjectId: subject.provider-registrar
    name: Whoever hooks a formula management provider in
    reliance: >
      Registers an eligible provider under an alphanumeric name and trusts
      every formula of it to surface under that name as a suffix, in every
      checkout, beside the formulas in local storage.
  - subjectId: subject.formula-keeper
    name: Whoever keeps formulas in a formula management provider
    reliance: >
      Creates formulas through the provider, or keeps them in its store, and
      trusts them to reach everyone who later does that work, wherever the
      provider keeps them.
conditions:
  - conditionId: condition.work-is-named
    statement: >
      Work begins with `dotdiw create "<title>"`, the single declared moment,
      and the title is in the words the worker uses for the work.
  - conditionId: condition.formula-is-committed
    statement: >
      The procedure is a `*.formula.toml` file tracked by git, or a formula a
      registered provider serves. Uncommitted, a file is one person's, found
      on that person's file system alone, and the project does not hold it.
  - conditionId: condition.described-to-be-found
    statement: >
      The formula's description and examples name the situation in the words
      people use for the work, so `dotdiw check` finds it from them.
  - conditionId: condition.day-0-happened
    statement: >
      dotdiw is on the machine, once, the way git is, and so is any tracker a
      checkout chose in place of the store dotdiw brings; this checkout was
      adopted once with `dotdiw init`, which every clone runs for itself,
      since the tracker's state lives under the user's home and not in the
      repository.
boundaries:
  - boundaryId: boundary.shows-does-not-enforce
    statement: >
      dotdiw shows the procedure. It does not make anyone follow it and it does
      not block work.
    whyItMatters: >
      Whether a surfaced procedure is followed belongs to the bearer's praxis,
      not to the tool; a tool that blocked work would be bypassed.
  - boundaryId: boundary.only-the-declared-moment
    statement: >
      Nothing surfaces for work that begins any other way -- by editing a file,
      cutting a branch, or creating the item in the tracker directly.
    whyItMatters: >
      The declared moment is the mechanism, not a note about one. Where work
      may begin elsewhere, the discipline was skipped, not the mechanism broken.
  - boundaryId: boundary.formulas-not-prose
    statement: >
      Only formula files are matched. A runbook in prose is never surfaced,
      however well written.
    whyItMatters: >
      Prose cannot be matched against a title or instantiated as steps. The
      product promises discovery over a set the project can state.
  - boundaryId: boundary.a-coincidence-costs-a-glance
    statement: >
      At the chosen threshold roughly two in five titles that no formula covers
      still surface something. Silence is not promised.
    whyItMatters: >
      Every step towards silence loses real retrievals. The trade is a glance
      at a wrong match against losing the mechanism.
  - boundaryId: boundary.nothing-outside-the-repository
    statement: >
      Adoption and use leave nothing in the repository but the formulas and
      the declaration of where work starts. The tracker's state lives under
      the user's home in a directory of dotdiw's own name, keyed to the
      checkout by one line in its own `.git/config`, and the one other change
      on the machine -- the anonymous usage metrics of a tracker that has
      them, turned off -- is said aloud the first time.
    whyItMatters: >
      v0.1.0 inherited a hook override and a Dolt remote from bd without saying
      so, and every version before 0.4.0 kept the tracker's state in the tree.
      What a tool does on somebody's behalf must be stated, and what is in the
      project must be only what the project shares on purpose.
  - boundaryId: boundary.the-prover-uses-the-means
    statement: >
      dotdiw shows the means to prove a run and checks that each is well
      formed. Running a command, reading a file and opening a link are the acts
      of whoever proves the run.
    whyItMatters: >
      A formula is a file that anyone who commits may change. Whoever proves
      the run chooses what runs on their machine, so a change to a formula
      changes what is shown, and only that.
  - boundaryId: boundary.formula-storage-apart-from-task-storage
    statement: >
      Formula storage is separate from task storage. A formula management
      provider answers for formulas and the tracker for work, and nothing
      about a formula's provider reaches a pour or a tracker.
    whyItMatters: >
      Where formulas are kept and where work is tracked are two choices, each
      made on its own and each changed without touching the other.
possibleCarriers:
  - carrierId: carrier.dotdiw-cli
    name: The dotdiw command
    carrierKind: software
    howEncountered: >
      Typed in a terminal, called from a script, or spawned as a subprocess by
      an agent -- one file on PATH, the same for all three.
  - carrierId: carrier.project-instructions
    name: The project's own instruction files
    carrierKind: hybrid
    howEncountered: >
      CLAUDE.md and AGENTS.md state the convention, so an agent reads where
      work starts before it starts anything.
  - carrierId: carrier.tracker
    name: The tracker underneath, behind a door of its own
    carrierKind: software
    howEncountered: >
      Holds the created work item and the poured steps: the store dotdiw
      brings, one file under the home, or an adapter chosen by name -- beads,
      the tracker of every version before 0.6.0, or one loaded by name from the
      home directory or from where a package installed it.
      dotdiw reaches it in typed records only, and under beads forwards every
      other command to it under its own name.
  - carrierId: carrier.formula-management-provider
    name: A formula management provider, behind the formula management abstraction
    carrierKind: software
    howEncountered: >
      Installed as a package, which makes it eligible, and registered under an
      alphanumeric name: a file system or an API endpoint whose formulas then
      surface in every checkout under that name as a suffix.
evidenceOrProof:
  - evidenceId: evidence.formula-named-at-create
    statement: >
      The output of `dotdiw create` lists the applying formulas by name and
      path, with the command that pours one.
  - evidenceId: evidence.check-finds-every-formula
    statement: >
      `dotdiw check` reports every formula in the checkout reachable from its
      own examples, each example taken out of the index while it is searched
      for.
  - evidenceId: evidence.steps-tracked-in-order
    statement: >
      A poured formula is visible as tracked issues whose dependencies refuse
      to close a step before the ones it needs.
  - evidenceId: evidence.the-log-not-the-agent
    statement: >
      In measurement, the log of every dotdiw invocation and the repository
      diff -- never what an agent said it did -- show the create and what it
      surfaced.
  - evidenceId: evidence.the-witnessed-story
    statement: >
      With the witness log on, the contract in contracts/ reads the events
      dotdiw itself wrote -- named, surfaced or silent, poured, closed -- and
      calls the story valid, or says in which way it is not. A claim that
      discovery fired answers to that contract and to nothing read by hand.
  - evidenceId: evidence.check-holds-the-means-to-prove
    statement: >
      `dotdiw check` names every value of a formula's verify-using that it
      cannot read, every value longer than one line, and every file of this
      repository that a value names and git does not track.
falseSuccessRisks:
  - riskId: risk.silence-read-as-nothing-applies
    statement: >
      `dotdiw create` prints nothing although a formula in its reach applies,
      because its description does not use the worker's words.
    whatItWouldCounterfeit: >
      The absence of a procedure, when the project holds one it could not
      reach.
  - riskId: risk.a-formula-only-one-person-holds
    statement: >
      A formula is written and used locally but never committed. Its author
      believes the project has a procedure.
    whatItWouldCounterfeit: >
      Sharing. The procedure looks held by the project while one checkout has
      it.
  - riskId: risk.work-begun-elsewhere
    statement: >
      An agent reads the task and edits a file first. `dotdiw create` never
      runs and nothing surfaces.
    whatItWouldCounterfeit: >
      Discovery having fired and found nothing, when it never fired.
  - riskId: risk.a-coincidence-surfaces
    statement: >
      A title reaches a formula about different work that happens to share its
      words, and the worker pours it.
    whatItWouldCounterfeit: >
      The right procedure, when it is a coincidence of vocabulary.
  - riskId: risk.a-diff-in-the-trackers-file
    statement: >
      A file the tracker committed is changed by dotdiw without being named in
      its report, and the adopter reasons about the tracker.
    whatItWouldCounterfeit: >
      One name for all four, while the second name is what the repository
      makes them think about.
  - riskId: risk.proved-by-what-is-gone
    statement: >
      A formula's verify-using names a file that a later change deleted or
      moved, or a command that no longer proves what the formula claims.
    whatItWouldCounterfeit: >
      A proved run. The proof points at something that is no longer there.
  - riskId: risk.one-id-two-formulas
    statement: >
      A local formula's id reads like a provider's suffixed id, and the worker
      follows one formula believing it is the other.
    whatItWouldCounterfeit: >
      The procedure that applies. One id stands for two procedures, and the
      wrong one is run.
pressureNotes:
  - >
    Urgency pulls towards starting by doing. A one-second act that names the
    work is the one most likely to be skipped under it.
  - >
    A tool that wraps another inherits what that tool does to a repository.
    The pressure is to not look.
promiseChanges:
  - changeId: change.adoption-declines-bd-hooks-and-remote
    summary: >
      From 0.2.0, `init` declines bd's core.hooksPath override and its Dolt
      remote, undoes both where an earlier version left them, and names the
      files it left uncommitted.
    compatibility: corrective
    rationale: >
      v0.1.0 claimed nothing was configured per project. That was false, and
      two of the inherited things were harmful.
  - changeId: change.metrics-off-on-every-run
    summary: >
      From 0.2.1, every run turns bd's anonymous usage metrics off before any
      bd command, and says so the first time.
    compatibility: strengthening
    rationale: >
      A tool that runs another on the user's behalf was deciding the question
      for them by staying silent.
  - changeId: change.witness-log-opt-in
    summary: >
      From 0.3.0, with DOTDIW_WITNESS=1 or once .beads/witness.jsonl exists,
      every create, pour and close through dotdiw appends one local line, and
      the witness contract decides what those lines may be read as. Off by
      default; nothing is transmitted; init and create keep the file out of
      git.
    compatibility: additive
    rationale: >
      The promise claimed evidence it could not produce: an invocation log
      read by hand. The evidence now comes from the bodies that do the work,
      and a contract says when it counts.
  - changeId: change.init-leaves-git-alone
    summary: >
      From 0.3.0, `init` runs the tracker in its stealth mode: it commits
      nothing, writes nothing for agents, configures no remote, and keeps its
      files local to the checkout. What init leaves behind is dotdiw's own
      declaration, named as yours to commit. Repositories adopted earlier are
      told the one command that does the same for them. Every clone runs
      `init` once, which was always so and was never said.
    compatibility: corrective
    rationale: >
      Under 0.2.0 and 0.2.1 the tracker committed its files during init and
      the sync remote was removed afterwards, which left .beads/config.yaml
      changed and not named in the report. The tracker's stealth mode commits
      nothing.
  - changeId: change.tracker-state-leaves-the-repository
    summary: >
      From 0.4.0 the tracker's state lives under the user's home, in
      `~/.dotdiw/<key>`, keyed to the checkout by one line in its
      `.git/config`; the repository holds only the formulas and the
      declaration. A repository adopted by an earlier version is adopted under
      the home by its first command, keeping its prefix; its tasks are not
      carried over, and that is said once with the one command that removes
      the in-tree copy. Every clone runs `init` once.
    compatibility: corrective
    rationale: >
      Every version before 0.4.0 kept bd's state in the working tree, where it
      needed an exclude, a check for leftovers and an explanation in every
      notice, and where a clone could never use it anyway. Under the home it
      is keyed to the checkout, survives a move, is shared by worktrees, and
      is nobody else's.
  - changeId: change.the-tracker-behind-a-door-of-its-own
    summary: >
      From 0.6.0 the tracker is an interface of ten operations behind a door
      of its own, answered by an adapter chosen per request, else per
      checkout, else the store dotdiw brings: `local`, one sqlite file under
      `~/.dotdiw/<key>/`, the default for a new adoption. `beads`, the
      tracker of every version before, is an adapter; a checkout adopted
      earlier is kept on it by its first command, which says so once.
      `dotdiw tracker` lists, chooses, checks and migrates; a tracker not on
      the machine is a module under the home, proved by the one scenario that
      defines an adapter. Nothing a worker who chose nothing sees changes,
      and under beads the same commands print the same bytes.
    compatibility: strengthening
    rationale: >
      Eight operations crossed to one tracker by name, and no record said
      which calls were the tracker's and which were dotdiw's. Behind one door
      the interface is the record: every adapter is held to the same types by
      the door and to the same scenario by the suite, and a worker can choose
      a tracker, or none, without dotdiw changing.
  - changeId: change.a-tracker-ships-by-convention
    summary: >
      From 0.7.0 a tracker ships as dotdiw-tracker-<name>, a package holding
      one file that installs under share/dotdiw/trackers beside the tool. It is
      compatible when dotdiw tracker check passes every operation, and it says
      which interface it was written for. dotdiw tracker new writes the file to
      start from. The tap's formula no longer installs beads: a checkout that
      chose it is told brew install beads when the binary is missing.
    compatibility: strengthening
    rationale: >
      A tracker could only be copied by hand into the home directory, which a
      package manager cannot write to, and nothing said which interface a
      module was written for.
  - changeId: change.pour-is-a-formula-command
    summary: >
      From 0.8.0, `dotdiw formula pour <id>` creates a formula's steps as
      tracked items, and dotdiw's own messages tell people to use it. The old
      command, `dotdiw mol pour <id>`, still works and prints the same. The
      instructions dotdiw writes into `CLAUDE.md` and `AGENTS.md` still say
      `mol pour`. dotdiw rewrites that text in every repository that uses it,
      on the next `create`, so changing it would change files in every
      repository at once, and teammates on different versions would keep
      overwriting each other's copy.
    compatibility: additive
    rationale: >
      `mol pour` is a name from beads. The other formula commands are
      `formula new`, `formula list` and `formula show`, so pouring now sits
      with them.
  - changeId: change.a-tracker-says-who-it-acts-as
    summary: >
      From 0.8.0, dotdiw says which account a tracker writes work under, when
      the tracker can confirm it. Jira confirms it from the API token, so
      `init` names that account once and `tracker use` names it every time.
      Beads takes its name from git or the environment, which anyone can set,
      so dotdiw does not show it. Items now record who they are assigned to.
      `show` prints it under local and Jira, and in Jira and beads,
      `update -a me` assigns an item to the account the work is written under.
      `tracker migrate` does not carry assignments over to the new tracker,
      and says how many items had one.
    compatibility: additive
    rationale: >
      Jira and beads write work under someone's name, and dotdiw never said
      whose. The worst mistake is writing work under the wrong person's name
      without anyone noticing.
  - changeId: change.kind-is-root-or-task
    summary: >
      From 1.0.0, an item's kind is root or task. The root a pour makes is
      root, and every other item is task, whatever the tracker calls it.
      `create-item` takes no kind. The tracker interface is number 2, and an
      adapter written for 1 is refused in one line that names it. A local
      store made before 1.0.0 reads its roots, recorded as molecule, as root.
    compatibility: breaking
    rationale: >
      dotdiw reads the kind for one thing, telling a poured root from a parent
      someone built by hand. While the kind was open, a root could be a
      molecule or an epic, and an epic someone built by hand could not be told
      from one.
  - changeId: change.a-formula-names-the-means-to-prove-its-run
    summary: >
      From 1.0.0, a formula can name the means to prove that its run did what
      it claims, in a list called `verify-using`. Each value is one line: a
      command after `run:`, a file in a repository as a `git+https://` or
      `git+ssh://` URL with the file's path after `#`, or a link. dotdiw shows
      the list after a pour and gives it to the tracker with the root, which
      keeps it and returns it exactly as given, and `dotdiw tracker migrate`
      carries it with the item. `dotdiw check` names a value it
      cannot read, a value longer than one line, and a file of this repository
      that git does not track. Whoever runs the formula proves the run with
      these means.
    compatibility: additive
    rationale: >
      A formula said what to do and how its steps follow each other. Steps
      closed in order show that the order was kept; the means to prove show
      that the run did what the formula claims.
  - changeId: change.formulas-behind-a-storage-abstraction
    summary: >
      From 2.0.0, formulas are reached through a formula management
      abstraction. A formula management provider behind it can be a file
      system or an API endpoint; several are hooked in at once, and one may
      offer discovery only. Installing a package that provides one makes it
      eligible, and it is registered under an alphanumeric name. Every formula
      from a registered provider carries that name as a suffix, after a
      hyphen. A formula without a suffix is in local storage, the file
      system, where git plays no part in finding it, and local storage itself
      commits nothing and keeps no history; committing is the concern of a
      git formula management provider. Until one ships, a formula in a
      checkout is shared by committing it, as every other file is, and
      `dotdiw check` names one git does not track. A provider answers list
      and show, and create where it can, in typical API style, and declares
      which of these it answers; initial versions require list and show of
      every provider. For now, every registered provider serves every
      checkout. A local formula whose id reads like a provider's suffixed id
      migrates.
    compatibility: breaking
    rationale: >
      A formula was a file that one repository's git tracked, so a procedure
      could be kept nowhere else and shared only by committing it. Behind a
      formula management abstraction, where a formula is kept is the provider's business,
      and a file system or an API endpoint serves the same matching and the
      same pour.
openQuestions:
  - questionId: question.hundreds-of-formulas
    question: >
      The threshold of 0.15 was calibrated on three to fifty-six formulas. What
      do retrieval and silence look like at the hundreds this is for?
    neededFrom: measurement
  - questionId: question.enforcing-the-declared-moment
    question: >
      Should a project be able to tell, per piece of work, that it began
      unnamed -- a commit with no named work behind it -- or does that cross
      from showing into enforcing?
    neededFrom: product-owner
sourceRefs:
  - SPEC.md
  - DAY_0.md
  - DAY_1.md
  - README.md
