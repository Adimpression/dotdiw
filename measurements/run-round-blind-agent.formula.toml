formula = "mol-trial-round"
description = "Run a round of blind agent trials end to end: park anything an agent could read the answer from, install the invocation log, build the repositories, run one agent per repository, then score from the log and the diffs rather than from what the agents reported. Use when measuring whether a change to the tool changes behaviour, when re-running the matrix against a fixed build, or when running the eleven projects again."
examples = [
  "Run a round of blind agent trials",
  "Re-run the matrix against the fixed build",
  "Measure whether the new wording changes what agents do",
  "Run the eleven projects again",
]
version = 1
type = "workflow"

[[steps]]
id = "park"
title = "Park anything an agent could read the answer from: the memory directory, stray notes, any sibling repository in the same parent"

[[steps]]
id = "shim"
title = "Install the invocation shim, and confirm it logs from inside the matrix and nowhere else"

[[steps]]
id = "install"
title = "Copy the build under test onto PATH, so agents run the code being measured and not the last release"
needs = ["shim"]

[[steps]]
id = "build"
title = "Build one repository per run, state absent from every path, one repository per parent directory"
needs = ["park"]

[[steps]]
id = "fixtures"
title = "Run `dotdiw check` in every adopted repository until it is clean -- a fixture that fails its own self-test measures nothing"
needs = ["build", "install"]

[[steps]]
id = "run"
title = "Run one agent per repository, told the domain job and nothing about the tooling"
needs = ["fixtures"]

[[steps]]
id = "score"
title = "Score from the invocation log and the repository diffs, never from what an agent said it did"
needs = ["run"]

[[steps]]
id = "restore"
title = "Restore the machine: real binary back on PATH, shim removed, parked directories returned"
needs = ["score"]
