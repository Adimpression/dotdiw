formula = "mol-add-domain"
description = "Add a new domain to the trial matrix: write the project's own files, write two or three procedures in natural places inside it, and give it a job that one of them covers. Use when widening the matrix beyond the domains it already holds, when a project that is not a software team is needed, or when replacing a domain whose vocabulary turned out to overlap another."
examples = [
  "Add a domain to the trial matrix",
  "Widen the matrix with six more projects",
  "Write a new domain for the simulations",
  "We need a project that is not a software team",
]
version = 1
type = "workflow"

[[steps]]
id = "files"
title = "Write the project's own files: enough prose that the background corpus can tell its everyday words from its distinctive ones"

[[steps]]
id = "vocabulary"
title = "Check the vocabulary does not overlap a domain already in the matrix, or the two will compete for each other's titles"
needs = ["files"]

[[steps]]
id = "procedures"
title = "Write two or three procedures, each beside the part of the project it concerns rather than in a folder of their own"
needs = ["files"]

[[steps]]
id = "job"
title = "Write the job the agent will be given, and decide deliberately whether a procedure covers it"
needs = ["procedures"]

[[steps]]
id = "selftest"
title = "Build it and run `dotdiw check` until clean, rewording descriptions rather than deleting the examples that fail"
needs = ["procedures", "vocabulary"]
