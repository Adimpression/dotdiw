formula = "mol-sweep-threshold"
description = "Sweep a retrieval threshold honestly: gather the positives and negatives, check the negatives are still uncovered, run the whole grid rather than a chosen point, and report recall and silence together. Use when tuning a cutoff, when a rule needs bracketing on both sides, or when a number already reported turns out to rest on too few cases."
examples = [
  "Sweep a retrieval threshold",
  "Bracket the cutoff on both sides",
  "Find out what that number costs on the other side",
  "Re-measure it on more negatives",
]
version = 1
type = "workflow"

[[steps]]
id = "positives"
title = "Gather the positives: every formula's own example titles, each removed from the index before it is searched for"

[[steps]]
id = "negatives"
title = "Gather the negatives, and check each one is still uncovered -- a negative stops being one the moment somebody writes a procedure for it"

[[steps]]
id = "grid"
title = "Run the whole grid, not the point you expect to keep"
needs = ["positives", "negatives"]

[[steps]]
id = "report"
title = "Report both sides at every point: what retrieves, and what is left silent"
needs = ["grid"]

[[steps]]
id = "regress"
title = "Re-run the original fixtures at the chosen point, to see what the change cost somewhere it was not being watched"
needs = ["report"]

[[steps]]
id = "record"
title = "Write the measurement down with the cases it rests on, so a figure drawn from five of them is never quoted as a rate"
needs = ["regress"]
