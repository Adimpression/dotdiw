formula = "mol-make-pull-request"
description = "Commit and push in this project as a pull request, a PR: decide what belongs in the commit, sweep the staged change for credentials and personal data, check the conventions still hold, write a message that says what is now true, then commit — one commit per branch, its message the pull request's description — and get it onto the remote only once somebody has asked for a push and named where it goes. Use when you are about to commit, when you have changes to land, when you are writing a commit message, when something needs pushing, or when a pull request is to be created."
examples = [
  "Commit what I just changed",
  "Write the commit message for this change",
  "Land the fix",
  "Push this up",
  "Get this onto the remote",
  "Squash the branch into one commit",
  "Amend the commit with this change",
  "Create the PR",
  "Open a pull request for this change",
]
version = 5
type = "workflow"

# Reading the diff was the first step in version 1, and using the formula showed
# it is never outstanding: this surfaces on `create`, and by the time you have
# named the work you have already looked. What is still open at that moment is
# the decision about what belongs in this commit, which is not the same thing.
[[steps]]
id = "scope"
title = "Decide what belongs in this commit and what stays out of it"

[[steps]]
id = "sweep"
title = "Sweep the staged change for credentials and personal data: keys, tokens, emails, account names, absolute paths from your own machine"
needs = ["scope"]

[[steps]]
id = "conventions"
title = "Run `dotdiw check` and fix anything it reports"
needs = ["scope"]

[[steps]]
id = "message"
title = "Write the message: what is now true, why, and the number behind any claim it makes"
needs = ["scope"]

# Version 5: the branch is the pull request, and the pull request's description
# is the commit's message. GitHub prefills a one-commit pull request from that
# message; a second commit on the branch means a description typed by hand.
[[steps]]
id = "single"
title = "One commit per branch: amend or squash into the one that is there, never add a second. Its first line is the pull request's title and its body the description, so the message is written to stand as that"
needs = ["message"]

[[steps]]
id = "commit"
title = "Stage only what belongs and commit"
needs = ["sweep", "conventions", "single"]

[[steps]]
id = "verify"
title = "Confirm the tree is clean and read the commit back, to see what actually went in"
needs = ["commit"]

# Version 2 ended at the commit, so pushing had no procedure and happened twice
# without one. A commit is yours to make. A push publishes, and publishing is
# not yours to decide.
[[steps]]
id = "asked"
title = "Stop unless a push was actually asked for. Having just committed is not a request to push, and neither is permission to commit"
needs = ["verify"]

[[steps]]
id = "where"
title = "Get the destination named: which remote, which branch. A branch unless main was named out loud"
needs = ["asked"]

[[steps]]
id = "irreversible"
title = "Before a public remote, sweep once more and accept it is final -- a force-push does not remove a commit from a public repository, it stays reachable by SHA"
needs = ["where"]

[[steps]]
id = "push"
title = "Push, to the destination that was named and nowhere else"
needs = ["irreversible"]

[[steps]]
id = "landed"
title = "Read back what actually landed on the remote, and say so"
needs = ["push"]

# A push to a branch prints the pull request link and it was buried in the
# report every time. The link is the next action; it goes at the top of what
# you say, on its own line, not in a closing paragraph.
[[steps]]
id = "present"
title = "If the push was to a branch, give the pull request link first and on its own line, before anything else you report"
needs = ["landed"]
