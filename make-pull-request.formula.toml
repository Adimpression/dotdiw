formula = "mol-make-pull-request"
description = "Commit and push in this project as a pull request, a PR: confirm there is one branch besides main and that this is it, decide what belongs in the commit, sweep the staged change for credentials and personal data, check the conventions still hold, pass the promise check with every test suite on the tree to be committed -- a bug it finds sends the change back into review -- move the version line when a release ships the change, write a message that says what is now true in plain sentences with a first line that fits the line, review it as the reader will, then commit — one commit per branch, its message the pull request's description — and get it onto the remote only once somebody has asked for a push and named where it goes. Use when you are about to commit, when you have changes to land, when you are writing a commit message, when something needs pushing, or when a pull request is to be created."
examples = [
  "Commit what I just changed",
  "Write the commit message for this change",
  "Land the fix",
  "Push this up",
  "Get this onto the remote",
  "Squash the branch into one commit",
  "Amend the commit with this change",
  "Bump the version for the release",
  "Rewrite the commit message plainly",
  "Fix the pull request title",
  "Create the PR",
  "Open a pull request for this change",
]
version = 10
type = "workflow"

# Version 10: the deliberate breaks run here, every one, and their table is
# the record in measurements/results/mutation-tracker.txt. A review runs only
# its own (mol-answer-a-review), so without this step the record falls behind
# the table it is the record of.

[[steps]]
id = "branch"
title = "Confirm there is one and only one branch besides main or master, the one this work is on; if there is none or more than one, stop and ask the user which it is before touching anything"

[[steps]]
id = "scope"
title = "Decide what belongs in this commit and what stays out of it"
needs = ["branch"]

[[steps]]
id = "sweep"
title = "Sweep the staged change for credentials and personal data: keys, tokens, emails, account names, absolute paths from your own machine"
needs = ["scope"]

[[steps]]
id = "conventions"
title = "Run `dotdiw check` and fix anything it reports"
needs = ["scope"]

[[steps]]
id = "promise"
title = "Run the promise check on the tree to be committed -- `dotdiw mol pour mol-check-promise-artifacts`, followed through with every test suite: `python3 -I suites.py all`. A pull request is pushed only on a tree that has passed it. A bug it finds goes back into review: fix it under mol-answer-a-review, and raise the pull request again once that review passes"
needs = ["scope"]

[[steps]]
id = "breaks"
title = "Run every deliberate break on the tree to be committed, from measurements/: `python3 -I measure/mutate_tracker.py`, every mutation caught, and write the table it prints to measurements/results/mutation-tracker.txt, so that the record covers each entry the table holds. A mutation that survives is a rule nothing holds: it goes back into review like a bug"
needs = ["promise"]

[[steps]]
id = "message"
title = "Write the message in plain sentences a reviewer reads once: what is now true, why, and the number behind any claim it makes; nothing the implementation log already carries at length"
needs = ["scope"]

[[steps]]
id = "version"
title = "If a release ships this change, the version line in `dotdiw` moves in this commit, with the change that earns it -- a release is never a second pull request for the number"
needs = ["scope"]

[[steps]]
id = "review"
title = "Read the message again as the reviewer will: check every claim and number against the staged change, and rewrite any sentence that is not clear and true on one reading"
needs = ["message"]

[[steps]]
id = "single"
title = "One commit per branch: amend or squash into the one that is there, never add a second. Its first line is the pull request's title and its body the description, so the message is written to stand as that -- and the first line is 72 characters or fewer, because GitHub cuts a longer one at 69 and pushes the rest into the description"
needs = ["review"]

[[steps]]
id = "commit"
title = "Stage only what belongs and commit"
needs = ["sweep", "conventions", "promise", "breaks", "version", "single"]

[[steps]]
id = "verify"
title = "Confirm the tree is clean and read the commit back, to see what actually went in"
needs = ["commit"]

[[steps]]
id = "asked"
title = "Stop unless a push was actually asked for. Having just committed is not a request to push, and neither is permission to commit"
needs = ["verify"]

[[steps]]
id = "where"
title = "Get the destination named: which remote, which branch. A branch unless main was named out loud"
needs = ["asked"]

[[steps]]
id = "irreversible"
title = "Before a public remote, sweep once more and accept it is final -- a force-push does not remove a commit from a public repository, it stays reachable by SHA"
needs = ["where"]

[[steps]]
id = "push"
title = "Push, to the destination that was named and nowhere else"
needs = ["irreversible"]

[[steps]]
id = "landed"
title = "Read back what actually landed on the remote, and say so"
needs = ["push"]

[[steps]]
id = "present"
title = "If the push was to a branch, give the pull request link first and on its own line, before anything else you report"
needs = ["landed"]
