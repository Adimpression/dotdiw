# The steps are the sections of README.md beside this file. The README says what
# each one takes, and this file lets `dotdiw formula pour` track them.
formula = "mol-write-tracker-adapter"
description = "Write an adapter for a tracker dotdiw does not ship, as one file, <name>.py, that answers the eleven operations of the tracker interface in records, prove it with dotdiw tracker check, choose it on a checkout and ship it as a package named dotdiw-tracker-<name>. Use when a team's work lives in a tracker dotdiw has no adapter for -- Linear, GitHub Issues, Jira elsewhere, a database of your own -- when a tracker is to be put behind dotdiw, or when tracker check fails on an adapter."
examples = [
  "Write a tracker adapter",
  "Write a tracker adapter for Linear",
  "Add an adapter for GitHub Issues",
  "Put our own tracker behind dotdiw",
  "Connect dotdiw to the tracker we use",
  "A new tracker module under the home",
  "Ship a custom tracker",
  "Package a tracker adapter for Homebrew",
  "Release dotdiw-tracker-linear",
  "tracker check fails on our adapter",
]
version = 3
type = "workflow"

[[steps]]
id = "template"
title = "Run dotdiw tracker new <name>, where the name uses lowercase letters, digits and hyphens, and keep the shape of the file it writes: one function per operation, the TRACKER table at the end, nothing printed"

[[steps]]
id = "table"
title = "Fill the table: info with name, version, interface 4, nativeNeeds and checkTarget, since a file written for an earlier interface is refused; the eleven operations by id, each a callable of one request; extras empty; store optional"
needs = ["template"]

[[steps]]
id = "records"
title = "Answer every operation in records of the IDL's fields and nothing beyond them, deciding the three rules the door does not: a close refused while an open need or child exists, a poured root closed once its steps have, an id asked for honoured or the given one named"
needs = ["table"]

[[steps]]
id = "kind"
title = "Answer kind root for the root pour-steps makes and task for every other item, whatever the tracker calls them, and take no kind on create-item, since only a pour makes a root"
needs = ["table"]

[[steps]]
id = "means"
title = "Keep each item's description and verifyUsing so show-item returns them exactly as pour-steps or create-item gave them, in a field of the tracker's or through the starting file's helper for every description; pouring from path, ignore unknown keys"
needs = ["table"]

[[steps]]
id = "credentials"
title = "Read credentials from the environment or a file under ~/.dotdiw/trackers, never from a repository; put none in a response and print nothing"
needs = ["table"]

[[steps]]
id = "check"
title = "Run dotdiw tracker check ./<name>.py against the declared target, and fix each failing operation until eleven of eleven pass"
needs = ["records", "kind", "means", "credentials"]

[[steps]]
id = "stub"
title = "For a tracker over a network, prove it against a stub of its API in a test, as test_jira.py does, and against nothing live"
needs = ["records", "kind", "means"]

[[steps]]
id = "choose"
title = "Choose it on a checkout with init --tracker or tracker use, move the work with tracker migrate if there is any, and run a day of create, pour, ready and close through it"
needs = ["check"]

[[steps]]
id = "ship"
title = "Ship it as a package named dotdiw-tracker-<name> that depends on dotdiw and installs the one file under share/dotdiw/trackers, run the check by path in CI, and confirm dotdiw tracker list shows it from there"
needs = ["choose", "stub"]
