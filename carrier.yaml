schemaVersion: 0.1.0
representationId: carrier.dotdiw-on-path
productPosition:
  promise: The procedure that applies surfaces when work is named.
  primaryDuty: >
    Answer a title with the project's applying formulas, in the same
    invocation, for a person at a terminal and an agent spawning a subprocess
    alike.
carriers:
  - carrierId: dotdiwCli
    carrierKind: software
    carries: [workNaming, formulaSurfacing, procedurePouring]
    strengths:
      - one file on PATH, reached by terminal, script and subprocess by the same path
      - nothing installed or configured per project
    limits:
      - cannot make anyone follow what it surfaced
      - cannot match prose
      - cannot see a formula outside its checkout and the providers registered under its home
      - cannot tell whether a run was proved
  - carrierId: projectInstructions
    carrierKind: hybrid
    carries: [workNaming]
    strengths:
      - binds whoever shows up, human or agent, including those who were not there when it was written
    limits:
      - only as good as the first line being read before the first act
  - carrierId: formulaManagementProvider
    carrierKind: software
    carries: [formulaKeeping]
    strengths:
      - keeps formulas on a file system or behind an API endpoint, behind one abstraction
      - several hooked in at once, each formula under its provider's registered name as a suffix
    limits:
      - surfaces nothing itself; dotdiw matches a title and pours what applies
      - one that offers discovery only cannot create a formula
      - one that fails is left out of the run, and its formulas with it
substitutionEnvelope:
  maySubstituteWhen:
    - any carrier runs the same dotdiw file against the same formulas, in the checkout and from the registered providers
  equivalentFor:
    - which formulas surface for a title
  notEquivalentFor:
    - whether the worker reads what surfaced
    - whether the worker proved the run
  counterfeitEquivalenceRisk:
    - >
      the tracker's own create, typed directly: the work item exists and looks
      named, but nothing was matched
